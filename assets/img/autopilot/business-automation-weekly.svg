9669"/><circle cx="866.6666666666666" cy="433.73366834170855" r="4" fill="#059669"/><circle cx="897" cy="416.4791666666667" r="4" fill="#059669"/><circle cx="927.3333333333334" cy="415.59375" r="4" fill="#059669"/><circle cx="957.6666666666666" cy="415.59375" r="4" fill="#059669"/><circle cx="988" cy="415.59375" r="4" fill="#059669"/><text x="805" y="622" font-size="15" fill="#059669">AI活用: 89.1%</text><text x="68" y="593" font-size="13" fill="#334155">03</text><text x="219.66666666666666" y="593" font-size="13" fill="#334155">04</text><text x="341" y="593" font-size="13" fill="#334155">05</text><text x="462.3333333333333" y="593" font-size="13" fill="#334155">06</text><text x="614" y="593" font-size="13" fill="#334155">07</text><text x="735.3333333333334" y="593" font-size="13" fill="#334155">08</text><text x="887" y="593" font-size="13" fill="#334155">09</text><text x="82" y="622" font-size="13" fill="#334155">2026年 / 日本時間の週 · 対象変更時は線を切る</text><text x="82" y="650" font-size="13" fill="#334155">3月～最初の台帳以前は未確認。週次値の補間・捏造はしない。</text><text x="82" y="674" font-size="13" fill="#334155">台帳はテスト済み準備を含む実装分類。実際の無人完走を示す証拠とは別。</text><text x="82" y="701" font-size="13" fill="#334155">現在の目標：固定192業務・93%以上×4週。旧90%超の観測は新目標へ換算しない。</text></g></svg>
