<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="736" viewBox="0 0 1080 736" role="img" aria-labelledby="title desc"><title id="title">YURIKA + SimpleMemo weekly business automation</title><desc id="desc">Actual operation and inventory snapshots are separate. Missing observations are not zero. Current goal: at least 93 percent on the fixed 192 tasks and same 11 exclusions for four weeks. Previous target observations are not retroactive goal credit.</desc><rect width="1080" height="736" fill="#fff"/><g font-family="Arial, Hiragino Sans, sans-serif"><text x="78" y="38" font-size="26" font-weight="bold" fill="#0f172a">ユリカ社＋シンプルメモ · 毎週のAI自動化率</text><text x="78" y="65" font-size="14" fill="#64748b">登録済み業務の範囲。法人全体の網羅性は未確認 · 2026-10-01</text><text x="78" y="96" font-size="19" fill="#0f172a">実運用：AI完全自動化率・AI活用率・省力化率（直近28日）</text><path d="M78,288 H988" stroke="#e2e8f0"/><text x="26" y="293" font-size="13" fill="#334155">0%</text><path d="M78,245.5 H988" stroke="#e2e8f0"/><text x="26" y="250.5" font-size="13" fill="#334155">25%</text><path d="M78,203 H988" stroke="#e2e8f0"/><text x="26" y="208" font-size="13" fill="#334155">50%</text><path d="M78,160.5 H988" stroke="#e2e8f0"/><text x="26" y="165.5" font-size="13" fill="#334155">75%</text><path d="M78,118 H988" stroke="#e2e8f0"/><text x="26" y="123" font-size="13" fill="#334155">100%</text><path d="M78,129.9 H988" stroke="#dc2626" stroke-dasharray="5 5"/><text x="994" y="133.9" font-size="12" fill="#dc2626">93%以上</text><text x="225" y="214" font-size="18" fill="#64748b">週次の実運用証拠は未確認。欠測は0%ではありません。</text><text x="520" y="321" font-size="14" fill="#2563eb">完全自動化</text><text x="680" y="321" font-size="14" fill="#059669">AI活用</text><text x="820" y="321" font-size="14" fill="#9333ea">実測省力化</text><text x="78" y="375" font-size="19" fill="#0f172a">台帳の参考値：AI実行の構成率・AI活用の構成率（全業務を分母）</text><path d="M78,567 H988" stroke="#e2e8f0"/><text x="26" y="572" font-size="13" fill="#334155">0%</text><path d="M78,524.5 H988" stroke="#e2e8f