name: PageSpeed 1449 Gate Diagnosis
on:
  push:
    branches: [claude/pagespeed-1449-gate-diagnosis-20260918]
    paths: [.github/workflows/pagespeed-1449-gate-diagnosis.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2eb207418cf067064922e432884f45e444fbf161
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture the unchanged check and evidence records
        env:
          DIAG_DIR: ${{ runner.temp }}/gate-diagnosis
        shell: bash
        run: |
          mkdir -p "$DIAG_DIR"
          set +e
          node scripts/autopilot-selfheal.mjs --check > "$DIAG_DIR/check.txt" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$DIAG_DIR/check-exit-code.txt"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {validate} from './scripts/autopilot-selfheal.mjs';
          const runs=JSON.parse(fs.readFileSync('data/autopilot-runs.json'));
          const matrix=JSON.parse(fs.readFileSync('data/authority-matrix.json'));
          const problems=validate(runs,matrix);
          const matching=runs.runs.filter(row=>problems.some(p=>p.startsWith(row.run_id+':')));
          const result={checked_at:new Date().toISOString(),source:'2eb207418cf067064922e432884f45e444fbf161',problems,matching,self_repair:matrix.self_repair};
          fs.writeFileSync(process.env.DIAG_DIR+'/diagnosis.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({problems,matchingRunIds:matching.map(r=>r.run_id)}));
          JS
          cat "$DIAG_DIR/check.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed-1449-gate-diagnosis
          path: ${{ runner.temp }}/gate-diagnosis/
          retention-days: 7
          if-no-files-found: error
