name: PageSpeed Render Trace Investigation
on:
  push:
    branches: [claude/pagespeed-render-trace-20260917]
    paths: [.github/workflows/pagespeed-render-trace.yml]
permissions:
  contents: read
concurrency:
  group: pagespeed-render-trace-investigation
  cancel-in-progress: false
jobs:
  image-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines and Japanese fallback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/tools" --no-save playwright@1.55.0
          node "$RUNNER_TEMP/tools/node_modules/playwright/cli.js" install --with-deps webkit
      - name: Prepare isolated comparison server; no speed-score retries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/perf/experiment-layout.cjs');t=p.read_text()
          old="process.env.CONFIRM==='1'?{baseline:'',combined:wrap(defer+breaks)}"
          assert t.count(old)==1
          t=t.replace(old,"process.env.CONFIRM==='1'?{baseline:'',deferred:wrap(defer)}")
          old='for(let run=1;run<=runs;run++){'
          assert t.count(old)==1
          t=t.replace(old,"const {run}=require(path.resolve(process.env.QA_SCRIPT));await run({ports:Object.fromEntries(keys.map((v,i)=>[v,18765+i])),output,root});return;\n for(let run=1;run<=runs;run++){")
          p.write_text(t)
          PY
      - name: Center every image and record actual visibility and loading states
        env:
          PERF_RESULTS: ${{ runner.temp }}/image-visibility
          CONFIRM: '1'
          QA_SCRIPT: scripts/perf/experiment-image-visibility.cjs
          LIGHTHOUSE_CLI: unused-functional-only
        run: NODE_PATH="$RUNNER_TEMP/tools/node_modules" node scripts/perf/experiment-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed-image-visibility
          path: ${{ runner.temp }}/image-visibility/
          retention-days: 7
          if-no-files-found: error
