name: PageSpeed Render Trace Investigation
on:
  push:
    branches: [claude/pagespeed-render-trace-20260917]
    paths: [.github/workflows/pagespeed-render-trace.yml]
permissions:
  contents: read
concurrency:
  group: pagespeed-render-trace-investigation
  cancel-in-progress: false
jobs:
  functional-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines and Japanese fallback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/tools" --no-save playwright@1.55.0
          node "$RUNNER_TEMP/tools/node_modules/playwright/cli.js" install --with-deps webkit
      - name: Retain the same CSS hypothesis and reuse the completed performance experiment
        run: |
          test "$(git hash-object index.html)" = f9b41530a4e3f188b44072e86261dd11cf7bd0a4
          test "$(git hash-object assets/css/home-hero.css)" = c70924f4140092371f18071a92144837e41b891b
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/perf/experiment-layout.cjs');t=p.read_text()
          old="process.env.CONFIRM==='1'?{baseline:'',combined:wrap(defer+breaks)}"
          assert t.count(old)==1
          t=t.replace(old,"process.env.CONFIRM==='1'?{baseline:'',deferred:wrap(defer)}")
          old='for(let run=1;run<=runs;run++){'
          assert t.count(old)==1
          t=t.replace(old,"protocol.phase='Functional verification only; performance proof is artifact10478512577';protocol.runsPerVariant=0;fs.writeFileSync(path.join(output,'protocol.json'),JSON.stringify(protocol,null,2));const {run}=require(path.resolve(process.env.QA_SCRIPT));await run({ports:Object.fromEntries(keys.map((v,i)=>[v,18765+i])),output,root});return;\n for(let run=1;run<=runs;run++){")
          p.write_text(t)
          PY
          node --check scripts/perf/experiment-layout.cjs
          node --check scripts/perf/experiment-layout-verified-qa.cjs
      - name: Compare all 48 browser scenarios including image rectangles, scroll and print
        env:
          PERF_RESULTS: ${{ runner.temp }}/layout-verified-functional
          CONFIRM: '1'
          QA_SCRIPT: scripts/perf/experiment-layout-verified-qa.cjs
          LIGHTHOUSE_CLI: unused-functional-only
        run: |
          mkdir -p "$PERF_RESULTS"
          cp scripts/perf/experiment-layout.cjs scripts/perf/experiment-layout-verified-qa.cjs "$PERF_RESULTS/"
          NODE_PATH="$RUNNER_TEMP/tools/node_modules" node scripts/perf/experiment-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed-layout-verified-functional
          path: ${{ runner.temp }}/layout-verified-functional/
          retention-days: 7
          if-no-files-found: error
