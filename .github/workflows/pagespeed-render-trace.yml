name: PageSpeed Render Trace Investigation
on:
  push:
    branches: [claude/pagespeed-render-trace-20260917]
    paths: [.github/workflows/pagespeed-render-trace.yml]
permissions:
  contents: read
concurrency:
  group: pagespeed-render-trace-investigation
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching measurement tools and Japanese fallback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/tools" --no-save lighthouse@12.8.2 playwright@1.55.0
      - name: Confirm unchanged public source inputs
        run: |
          test "$(git hash-object index.html)" = f9b41530a4e3f188b44072e86261dd11cf7bd0a4
          test "$(git hash-object assets/css/home-hero.css)" = c70924f4140092371f18071a92144837e41b891b
      - name: Compare isolated hypotheses without modifying production
        env:
          PERF_RESULTS: ${{ runner.temp }}/render-experiment
        run: LIGHTHOUSE_CLI="$RUNNER_TEMP/tools/node_modules/lighthouse/cli/index.js" node scripts/perf/experiment-render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed-render-experiment
          path: ${{ runner.temp }}/render-experiment/
          retention-days: 7
          if-no-files-found: error
