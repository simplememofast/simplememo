name: Cron Health

# scheduled run の失敗を毎朝1回集計して単一Issueに可視化する。
# X日英・TikTokの自動投稿が全滅しても最長4日以上誰も気づけなかったため、
# 「失敗があればIssue作成/追記、全回復したらクローズ」だけを行う小さな見張り。
#
# - 集計対象: 過去24hの event=schedule かつ conclusion=failure の run
# - Decision Monitorは登録から3時間の猶予後、直近3時間に定期起動が無い場合も追跡する
#   手動・マージ後の実行を定期起動の証拠にしない。監視自身の頻度は毎朝1回のまま
# - 「回復」の判定: Issueに記録した全workflowの最新 scheduled run が成功したこと
#   24hは新規検知の窓。古い故障はIssue本文・追記から追跡を継続する。
# - Issueは label `ops/cron-failure` の open 1件に集約する（毎回コメントで追記）
# - schedule トリガーはデフォルトブランチの定義でのみ動くため、
#   このファイルの変更はmainへマージされて初めて有効になる（auto-merge.ymlと同じ性質）

on:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: cron-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 監視の取得・復旧判定を検査
        run: node scripts/health-intake.mjs --check
      - uses: actions/github-script@v7
        with:
          script: |
            const { confirmCronRecovery } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/cron-recovery.mjs`);
            const { observeScheduleSilence, silenceMarker } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/cron-silence.mjs`);
            const LABEL = 'ops/cron-failure';
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { owner, repo } = context.repo;

            // 過去24hの scheduled run を status 別に収集。created はISO範囲指定。
            const listRuns = async (status) => {
              const runs = [];
              for (let page = 1; page <= 5; page++) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, event: 'schedule', status,
                  created: `>=${since}`, per_page: 100, page,
                });
                runs.push(...data.workflow_runs);
                if (data.workflow_runs.length < 100) return runs;
              }
              throw new Error('過去24hの実行一覧がページ上限内に収まらず、監視を完了できない');
            };
            const failures = await listRuns('failure');
            const successes = await listRuns('success');
            // APIの不明・不完全を空一覧に置き換えず、Issueへ書く前に失敗させる。
            const silences = await observeScheduleSilence({ github, owner, repo, now: Date.now() });

            const startedMs = (r) => Date.parse(r.run_started_at ?? r.created_at);
            const jst = (ms) => new Date(ms).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false });

            // ワークフロー（.ymlパス）単位に集計
            const byWf = new Map();
            for (const r of failures) {
              const e = byWf.get(r.path) ?? { name: r.name, fails: [], latestFail: 0, latestSuccess: 0 };
              e.fails.push(r);
              e.latestFail = Math.max(e.latestFail, startedMs(r));
              byWf.set(r.path, e);
            }
            for (const r of successes) {
              const e = byWf.get(r.path);
              if (e) e.latestSuccess = Math.max(e.latestSuccess, startedMs(r));
            }
            const stillFailing = [...byWf.values()].filter((e) => e.latestSuccess < e.latestFail);

            // レポート本文（Issue本文/コメント/ジョブサマリで共用）
            const lines = [];
            for (const [path, e] of [...byWf.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
              const recovered = e.latestSuccess >= e.latestFail;
              lines.push(`- **${e.name}** (\`${path}\`) — 失敗 ${e.fails.length} 件${recovered ? '・回復済み（最新の scheduled run は成功）' : '・未回復'}`);
              for (const r of e.fails.sort((x, y) => startedMs(y) - startedMs(x)).slice(0, 5)) {
                lines.push(`  - ${jst(startedMs(r))} JST — ${r.html_url}`);
              }
            }
            const body = [
              `## ${jst(Date.now())} JST 時点の集計（過去24h・event=schedule・conclusion=failure）`,
              '',
              ...(lines.length ? lines : ['失敗した scheduled run はありません。']),
              '',
              '### 定期起動の欠落',
              ...(silences.length ? silences.flatMap(s => [
                `- **${s.name}** (\`${s.workflow_path}\`) — 直近${s.max_silence_minutes}分に scheduled run がありません。手動・マージ後の起動とは区別しています。`,
                silenceMarker(s, owner, repo, context.eventName ?? 'unknown'),
              ]) : ['対象workflowの定期起動を確認、または新設直後の猶予内です。']),
              '',
              `_[cron-health.yml](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) による自動投稿_`,
            ].join('\n');

            // open Issue（単一運用）の取得
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL, per_page: 10,
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.state === 'open');

            if (stillFailing.length > 0 || silences.length > 0) {
              try { await github.rest.issues.getLabel({ owner, repo, name: LABEL }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'B60205', description: '定期実行の失敗・起動欠落を cron-health.yml が検知' }); }
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
                core.notice(`未回復 ${stillFailing.length} 件・定期起動欠落 ${silences.length} 件 — #${existing.number} に追記`);
              } else {
                const { data: created } = await github.rest.issues.create({
                  owner, repo, labels: [LABEL],
                  title: 'cron監視: 定期実行の失敗または起動欠落があります',
                  body,
                });
                core.notice(`未回復 ${stillFailing.length} 件・定期起動欠落 ${silences.length} 件 — #${created.number} を作成`);
              }
            } else if (existing) {
              const recovery = await confirmCronRecovery({ github, owner, repo, issue: existing, now: Date.now() });
              const proof = recovery.evidence.map(e => `- workflow ${e.workflow_id}: ${e.url} (completed/success)`).join('\n');
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: body + `\n\n復旧の個別確認: ${recovery.why}\n${proof}`
                  + (recovery.confirmed ? '\n全対象の最新定期実行が成功したためクローズします。'
                    : '\n復旧を確認できないため、未解決のまま追跡を続けます。') });
              if (recovery.confirmed) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
                core.notice(`全回復を確認 — #${existing.number} をクローズ`);
              } else {
                core.warning(`復旧未確認 — #${existing.number} はopenのまま: ${recovery.why}`);
              }
            } else {
              core.notice('失敗なし・open Issue なし');
            }

            await core.summary
              .addHeading('Cron Health — 過去24hの scheduled run', 2)
              .addRaw(body, true)
              .write();
