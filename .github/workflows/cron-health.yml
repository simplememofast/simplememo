name: Cron Health

# scheduled run の失敗を毎朝1回集計して単一Issueに可視化する。
# X日英・TikTokの自動投稿が全滅しても最長4日以上誰も気づけなかったため、
# 「失敗があればIssue作成/追記、全回復したらクローズ」だけを行う小さな見張り。
#
# - 集計対象: 過去24hの event=schedule かつ conclusion=failure の run
# - 「回復」の判定: そのワークフローの窓内の最新 scheduled run が成功していること
# - Issueは label `ops/cron-failure` の open 1件に集約する（毎回コメントで追記）
# - schedule トリガーはデフォルトブランチの定義でのみ動くため、
#   このファイルの変更はmainへマージされて初めて有効になる（auto-merge.ymlと同じ性質）

on:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST
  workflow_dispatch:

permissions:
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'ops/cron-failure';
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { owner, repo } = context.repo;

            // 過去24hの scheduled run を status 別に収集。created はISO範囲指定。
            const listRuns = async (status) => {
              const runs = [];
              for (let page = 1; page <= 5; page++) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, event: 'schedule', status,
                  created: `>=${since}`, per_page: 100, page,
                });
                runs.push(...data.workflow_runs);
                if (data.workflow_runs.length < 100) break;
              }
              return runs;
            };
            const failures = await listRuns('failure');
            const successes = await listRuns('success');

            const startedMs = (r) => Date.parse(r.run_started_at ?? r.created_at);
            const jst = (ms) => new Date(ms).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false });

            // ワークフロー（.ymlパス）単位に集計
            const byWf = new Map();
            for (const r of failures) {
              const e = byWf.get(r.path) ?? { name: r.name, fails: [], latestFail: 0, latestSuccess: 0 };
              e.fails.push(r);
              e.latestFail = Math.max(e.latestFail, startedMs(r));
              byWf.set(r.path, e);
            }
            for (const r of successes) {
              const e = byWf.get(r.path);
              if (e) e.latestSuccess = Math.max(e.latestSuccess, startedMs(r));
            }
            const stillFailing = [...byWf.values()].filter((e) => e.latestSuccess < e.latestFail);

            // レポート本文（Issue本文/コメント/ジョブサマリで共用）
            const lines = [];
            for (const [path, e] of [...byWf.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
              const recovered = e.latestSuccess >= e.latestFail;
              lines.push(`- **${e.name}** (\`${path}\`) — 失敗 ${e.fails.length} 件${recovered ? '・回復済み（最新の scheduled run は成功）' : '・未回復'}`);
              for (const r of e.fails.sort((x, y) => startedMs(y) - startedMs(x)).slice(0, 5)) {
                lines.push(`  - ${jst(startedMs(r))} JST — ${r.html_url}`);
              }
            }
            const body = [
              `## ${jst(Date.now())} JST 時点の集計（過去24h・event=schedule・conclusion=failure）`,
              '',
              ...(lines.length ? lines : ['失敗した scheduled run はありません。']),
              '',
              `_[cron-health.yml](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) による自動投稿_`,
            ].join('\n');

            // open Issue（単一運用）の取得
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL, per_page: 10,
            });
            const existing = openIssues[0];

            if (stillFailing.length > 0) {
              try { await github.rest.issues.getLabel({ owner, repo, name: LABEL }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'B60205', description: 'scheduled run の失敗を cron-health.yml が検知' }); }
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
                core.notice(`未回復 ${stillFailing.length} 件 — #${existing.number} に追記`);
              } else {
                const { data: created } = await github.rest.issues.create({
                  owner, repo, labels: [LABEL],
                  title: 'cron監視: scheduled run が失敗しています',
                  body,
                });
                core.notice(`未回復 ${stillFailing.length} 件 — #${created.number} を作成`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: body + '\n\n全ワークフローが回復したためクローズします。',
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.notice(`全回復 — #${existing.number} をクローズ`);
            } else {
              core.notice('失敗なし・open Issue なし');
            }

            await core.summary
              .addHeading('Cron Health — 過去24hの scheduled run', 2)
              .addRaw(body, true)
              .write();
