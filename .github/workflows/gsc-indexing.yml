name: GSC Crawled URL Checks

on:
  # GITHUB_TOKEN auto-merges do not emit a normal push workflow run.
  # Observe the existing merger's completion without changing its permissions
  # or gate. This workflow checks only the default-branch SHA, never executes
  # an upstream artifact or an untrusted PR head in this event context.
  workflow_run:
    workflows: ['Auto-merge Claude PRs']
    types: [completed]
  push:
    branches: [main, claude/gsc-crawled-indexing-20260916]
    paths:
      - '_headers'
      - 'functions/**'
      - 'robots.txt'
      - 'sitemap*.xml'
      - '**/*.html'
      - 'scripts/gsc-crawled-indexing.mjs'
      - 'scripts/full-public-assets-readback.mjs'
      - 'scripts/full-public-assets-rate-limit.test.mjs'
      - 'scripts/lib/edge-middleware.mjs'
      - 'data/publication-policy.json'
      - 'docs/seo/gsc-crawled-cases-2026-09-16.json'
      - 'docs/seo/gsc-crawled-cases-2026-09-29.json'
      - 'docs/seo/gsc-crawled-cases-2026-10-14.json'
      - '.github/workflows/gsc-indexing.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '_headers'
      - 'functions/**'
      - 'robots.txt'
      - 'sitemap*.xml'
      - '**/*.html'
      - 'scripts/gsc-crawled-indexing.mjs'
      - 'scripts/full-public-assets-readback.mjs'
      - 'scripts/full-public-assets-rate-limit.test.mjs'
      - 'scripts/lib/edge-middleware.mjs'
      - 'data/publication-policy.json'
      - 'docs/seo/gsc-crawled-cases-2026-09-16.json'
      - 'docs/seo/gsc-crawled-cases-2026-09-29.json'
      - 'docs/seo/gsc-crawled-cases-2026-10-14.json'
      - '.github/workflows/gsc-indexing.yml'

permissions:
  contents: read

concurrency:
  group: gsc-indexing-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    # A merge API 5xx may arrive after main was updated. Check trusted main
    # after success or failure; this does not declare the merger successful.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Public asset rate-limit regressions (controlled requests, no HTTP)
        run: node --test scripts/full-public-assets-rate-limit.test.mjs
      - name: All GSC samples (173 unique URLs), metadata, crawl permission and inbound links
        run: node scripts/gsc-crawled-indexing.mjs
      - name: Record production baseline without claiming candidate deployment
        if: github.event_name != 'workflow_run' && github.ref != 'refs/heads/main'
        run: node scripts/gsc-crawled-indexing.mjs --baseline
      - name: Verify production after deployment propagation
        if: github.event_name == 'workflow_run' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: node scripts/gsc-crawled-indexing.mjs --live
      - name: Verify every pinned public raw asset independently of representative checks
        if: always() && (github.event_name == 'workflow_run' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: node scripts/full-public-assets-readback.mjs --live
      - name: Retain public HTTP evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gsc-indexing-http-${{ github.run_id }}
          path: |
            gsc-indexing-http-report.json
            full-public-assets-http/
            full-public-assets-http-startup-failure.json
          if-no-files-found: warn
