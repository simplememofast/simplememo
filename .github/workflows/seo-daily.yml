# 毎日のSEO測定ループ。BigQueryのサチコ一括エクスポートを読み、
# 検出器を回して、結果をジョブサマリに出す。
#
# 【毎日と毎週で挙動が違う理由】
#
# 毎日: 取り込み → 検出 → ジョブサマリ。**何もコミットしない。**
#   スナップショットを毎日コミットすると2つ壊れる。
#   (1) 容量 — 28日窓のJSONを毎日積むと年180MB。静的サイトを配信する
#       リポジトリに置くものではない。
#   (2) decay検出 — previousSnapshot() は「直前のラベル」を返すので、
#       毎日書くと「28日窓 vs 27日重なった28日窓」を比べることになる。
#       差分はゼロに潰れ、原因分類はノイズを読むだけになる。
#   毎日の価値は「今日の数字が見えること」であって、履歴を増やすことではない。
#
# 毎週(月): それに加えてスナップショットと週次レポートをコミットし、PRを作る。
#   growth/README.md の「スナップショットはコミットする」設計はそのまま。
#   28日窓・週1回という既存のリズムを変えていない。
#
# 【エクスポートが止まったときに気づけるようにしてある】
#   preflight を最初に走らせ、鮮度が落ちていたら失敗させる。
#   止まったパイプラインは「エラー」ではなく「小さい数字」として出てくるので、
#   放っておくと「今週は静かだったね」で説明されてしまう。
#   growth/README.md がそもそもその失敗のために書かれている。

name: SEO Daily (BigQuery)

on:
  schedule:
    # 06:00 JST = 21:00 UTC (前日)。サチコのデータ確定は2〜3日遅れなので
    # 時刻そのものに意味はない。1日1回入ればよい。
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      snapshot:
        description: '曜日に関係なくスナップショットをコミットしてPRを作る'
        type: boolean
        required: false
        default: false
      days:
        description: '窓の日数（既定28）'
        required: false
        default: '28'

permissions: {}

concurrency:
  group: seo-daily
  cancel-in-progress: false

env:
  # 非機密の設定はリポジトリ変数で上書きできる。未設定なら既定値を使う。
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'yurika-simplememo' }}
  BQ_DATASET: ${{ vars.BQ_DATASET || 'searchconsole' }}
  GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'sc-domain:simplememofast.com' }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # PAT があればそれで checkout する。push に使う資格情報がこれで決まり、
      # GITHUB_TOKEN による push は他のワークフローを起動しない（GitHubの
      # 再帰防止）ため、PAT でないと SEO Validation が走らず auto-merge も
      # 発火しない。未設定なら GITHUB_TOKEN に落ちて、PRは作られるが
      # マージには手動の再実行が要る。
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 資格情報が無い状態で走らせると BigQuery の認証エラーで落ちる。
      # それは「設定がまだ」であって「壊れた」ではないので、区別して止める。
      #
      # 受け付ける中身は2種類ある。サービスアカウント鍵だけだと思われがちだが、
      # `gcloud auth application-default login` が書く OAuth ユーザー資格情報
      # （authorized_user）でも動く。鍵を発行せずに済むので、そちらの方が
      # 手数が少ないことも多い。どちらも同じシークレットに入れる。
      - name: Credentials are configured
        run: |
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            {
              echo "## SEO Daily — 未設定"
              echo ""
              echo "\`GCP_SERVICE_ACCOUNT_JSON\` シークレットが設定されていません。"
              echo ""
              echo "中身は次のどちらでも構いません（JSONをそのまま貼る）。"
              echo ""
              echo "1. **サービスアカウント鍵** — \`client_email\` と \`private_key\` を持つJSON"
              echo "2. **OAuthユーザー資格情報** — 手元で \`gcloud auth application-default login\` を"
              echo "   実行済みなら \`~/.config/gcloud/application_default_credentials.json\` が"
              echo "   それです（\`client_id\`/\`client_secret\`/\`refresh_token\`）。"
              echo "   \`quota_project_id\` が入っていない場合は先に"
              echo "   \`gcloud auth application-default set-quota-project <PROJECT_ID>\` を実行してください。"
              echo ""
              echo "設定手順: [growth/BIGQUERY_SETUP.md](../blob/main/growth/BIGQUERY_SETUP.md)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GCP_SERVICE_ACCOUNT_JSON が未設定のため測定をスキップした"
            exit 1
          fi
          # 種別だけ出す。値は出さない。認証が通らないときに
          # 「どちらの資格情報で試したのか」が分からないと切り分けができない。
          node -e '
            const raw = process.env.GOOGLE_SERVICE_ACCOUNT_JSON.trim();
            const text = raw.startsWith("{") ? raw : Buffer.from(raw, "base64").toString("utf8");
            let c; try { c = JSON.parse(text); } catch { console.log("::error::シークレットがJSONとして読めない（base64も試した）"); process.exit(1); }
            const kind = c.type ?? (c.private_key ? "service_account" : c.refresh_token ? "authorized_user" : "unknown");
            console.log(`credential type: ${kind}`);
            if (kind === "authorized_user" && !c.quota_project_id) {
              console.log("::warning::authorized_user に quota_project_id がありません。GCP_PROJECT_ID で代用しますが、gcloud auth application-default set-quota-project を実行しておく方が確実です");
            }
          '

      # エクスポートが届いているか。--strict で、止まっていたらここで失敗する。
      #
      # 出力を control フラグではなくファイルに落としているのは、下の復旧ステップが
      # **失敗したときの本文そのもの**を分類に使うため。要約に出た文字列を
      # 人が読んで判断していたのが、この経路が長く `nobody` だった理由。
      - name: Export preflight
        id: preflight
        run: |
          {
            echo "## エクスポートの状態"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node growth/scripts/bq-preflight.mjs --strict 2>&1 | tee "${{ runner.temp }}/preflight.log" | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # 【取り込み復旧】preflight が落ちた回を、機械が分類して1行残す。
      #
      # **落ちる/落ちないは変えていない。** 変えたのは、落ちた回が
      # 「誰かが要約を読むまで何も起きない」状態だったこと。
      # ここで分類（一過性 / 失効 / 設定誤り / 停止 / 欠測 / 不明）まで機械が決め、
      # 退避先と、人にしかできない手が要るかどうかを台帳に置く。
      # 翌朝のレーンF（自己修復）が未修理の故障としてこれを拾う。
      #
      # **人が要る回を「復旧した」と書かない。**その歯止めは
      # scripts/recover-ingest.mjs の check() が持っていて、seo-check が回している。
      - name: Ingest recovery (record + classify)
        if: failure() && steps.preflight.outcome == 'failure'
        run: |
          node scripts/recover-ingest.mjs --record "$(tail -c 2000 '${{ runner.temp }}/preflight.log')" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # 毎日の取り込みは GROWTH_GSC_DIR で捨て場所に書く。
      # コミットされるのは下の weekly ステップだけ。
      - name: Ingest today's window (not committed)
        env:
          GROWTH_GSC_DIR: ${{ runner.temp }}/gsc
        run: |
          node growth/scripts/ingest-bigquery.mjs \
            --days "${{ github.event.inputs.days || '28' }}" \
            --label "$(date -u +%Y-%m-%d)"

      # 【公開表示の突き合わせ】評価・件数・公開バージョンは JSON-LD の
      # aggregateRating としてサイトに出ている。台帳の値は人が App Store Connect を
      # 見て手で書いたもので、**古くなっても誰も気づかない**状態だった。
      #
      # ここで実物（iTunes Lookup）と突き合わせる。**GitHub のランナーは
      # itunes.apple.com に到達できる**（エージェントのサンドボックスは
      # プロキシが CONNECT を拒否するので、そちらでは確認できない）。
      #
      # ずれていても落とさない —— 値の更新は sync_constants.js での
      # ページ反映とセットで行う必要があり、日次ジョブが勝手に公開表示を
      # 書き換える形にはしない。ここは**気づくための経路**。
      # 取得できなかったときも落とさないが、「ずれていない」とは書かない。
      # 【ドメインの期限】RDAP から引いて台帳と突き合わせる。
      #
      # **エージェントのサンドボックスからは届かない**（プロキシが CONNECT を
      # 403 で拒否する）が、GitHub のランナーからは届く —— 下の iTunes Lookup と
      # 同じ事情。だから取得はここに置く。
      #
      # 落とさない: 取れなかった回は unknown を返して台帳を据え置く。
      # **取れないことは期限が無いことではない。**
      # 期限が変わっていたら --write の差分をコミットする回が要るので、
      # ここは気づくための経路。
      - name: Domain expiry (RDAP)
        continue-on-error: true
        run: |
          {
            echo ""
            echo "## ドメインの有効期限"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/check-domain-expiry.mjs --write 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Store facts vs App Store (report only)
        continue-on-error: true
        run: |
          {
            echo ""
            echo "## App Store 由来の公開表示"
            echo ""
            echo '```'
            node scripts/check-store-facts.mjs --net 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 検出器の出力をそのままサマリに出す。読むために別画面を開かせない。
      - name: Detectors
        env:
          GROWTH_GSC_DIR: ${{ runner.temp }}/gsc
        run: |
          {
            echo ""
            echo "## 検出結果"
            echo ""
            echo '```'
            node growth/scripts/analyze.mjs --top 10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ここから下は月曜だけ（または手動実行で snapshot=true のとき）。
      - name: Is this a snapshot day?
        id: when
        run: |
          if [ "${{ github.event.inputs.snapshot }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
            echo "月曜ではないので、記録用スナップショットのコミットは行わない。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ⑦法人経営。各社の規約本文を取りに行き、**改定されたら読み直しへ戻す。**
      #
      # [2026-08-27] **ここへ移した。**元は上の「取得」群に並べて毎日走らせていたが、
      # 書き先の data/corporate-obligations.json を拾う `Commit and open PR` は
      # **月曜だけ**（すぐ上の when ステップ）。つまり火〜日は
      # **16秒かけて10社を取得し、書いて、捨てていた。**
      #
      # 配線した当人が、配線先の commit ゲートを読んでいなかった。
      # **出力が残らない日に走らせない** —— 規約は毎日は改定されないので、
      # 検知が週1でも遅すぎることはない。
      #
      # **取得できなかった回は台帳を触らない**（読めなかった＝変わっていない、にしない）。
      #
      # なお上の「Domain expiry (RDAP)」も同じ性質を持つ（毎日走って月曜しか残らない）。
      # あちらは前任が「期限は年1回しか動かないのでその頻度で足りる」と明記して
      # 選んだ配置なので、**こちらの都合で動かさない。**
      - name: Vendor terms (指紋の更新)
        if: steps.when.outputs.snapshot == 'true'
        continue-on-error: true
        run: |
          {
            echo ""
            echo "## 規約本文の指紋"
            echo ""
            echo '```'
            node scripts/vendor-terms.mjs --write 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ingest snapshot of record
        if: steps.when.outputs.snapshot == 'true'
        id: snapshot
        run: |
          label="$(date -u +%Y-%m-%d)"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          node growth/scripts/ingest-bigquery.mjs --days 28 --label "$label"
          node growth/scripts/weekly-report.mjs --write

      - name: Commit and open PR
        if: steps.when.outputs.snapshot == 'true'
        uses: actions/github-script@v7
        env:
          LABEL: ${{ steps.snapshot.outputs.label }}
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const label = process.env.LABEL;
            const branch = 'claude/seo-weekly-snapshot';
            const sh = (cmd) => execSync(cmd, { encoding: 'utf8' }).trim();

            sh('git config user.name "github-actions[bot]"');
            sh('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            // data/corporate-obligations.json は上の RDAP ステップが --write で書く。
            // **書く動作を誰も動かしていない状態を作らない**（data/generators.json の規律）。
            // 期限は年1回しか動かないので、週次のこの回で拾えば足りる。
            sh('git add growth/data growth/reports data/corporate-obligations.json');

            if (!sh('git status --porcelain -- growth/data growth/reports data/corporate-obligations.json')) {
              core.notice('スナップショットに差分が無いため何もしない');
              return;
            }

            // ブランチは毎週作り直す。前週のPRがマージ済みなら、その履歴の上に
            // 積むのではなく main から取り直すのが正しい。
            sh(`git checkout -B ${branch}`);
            sh(`git commit -m "chore(growth): GSC スナップショット ${label}（BigQuery 自動取り込み）"`);
            sh(`git push -u origin ${branch} --force-with-lease`);

            const { owner, repo } = context.repo;
            const existing = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` });
            if (existing.data.length) {
              core.notice(`#${existing.data[0].number} は既に開いている`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner, repo, head: branch, base: 'main',
              title: `chore(growth): GSC スナップショット ${label}`,
              body:
                `BigQuery の一括エクスポートから ${label} のスナップショットを取り込み、週次レポートを生成した。\n\n` +
                `サイトの配信内容は変えていない（\`growth/data/\` と \`growth/reports/\` のみ）。\n\n` +
                `検出結果はワークフローのジョブサマリを参照。\n\n` +
                `---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });
            core.notice(`#${pr.number} を作成した`);

            if (process.env.HAS_PAT === 'true') {
              core.notice('PAT で push したため SEO Validation が走る。成功すれば auto-merge がマージする。');
            } else {
              // GITHUB_TOKEN による push / PR 作成は他のワークフローを起動しない
              // （GitHub の再帰防止）。つまり SEO Validation が走らず、
              // auto-merge.yml も発火しない。
              core.warning(
                'GH_PAT が未設定のため、このPRでは SEO Validation が自動で走らない' +
                '（GITHUB_TOKEN の push はワークフローを起動しないため）。' +
                'マージには手動の再実行が要る — growth/BIGQUERY_SETUP.md を参照。'
              );
            }
