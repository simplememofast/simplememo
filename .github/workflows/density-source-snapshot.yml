name: Density Source Snapshot
on:
  push:
    branches: [claude/pagespeed-density-source-20260918]
    paths: [.github/workflows/density-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c25e4b5fc4f3395cdc7c16e27a23868510b59e3
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact public source and content-date provenance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/density-source"
          test "$(git rev-parse HEAD)" = 2c25e4b5fc4f3395cdc7c16e27a23868510b59e3
          git archive --format=tar.gz --output="$RUNNER_TEMP/density-source/source.tar.gz" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/density-source/tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/density-source/commit.txt"
          python3 scripts/generate_sitemap.py --check
          sha256sum "$RUNNER_TEMP/density-source/source.tar.gz" > "$RUNNER_TEMP/density-source/source.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: density-immutable-source
          path: ${{ runner.temp }}/density-source/
          retention-days: 2
          if-no-files-found: error
