name: PageSpeed Audit
on:
  pull_request:
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'assets/**'
      - 'scripts/perf/**'
      - '.github/workflows/pagespeed-audit.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'assets/**'
      - 'scripts/perf/**'
      - '.github/workflows/pagespeed-audit.yml'
  # 公開後の速度監査は main への push でしか走らなかった。auto-merge は
  # GITHUB_TOKEN でマージするため GitHub の再帰防止で push run が起きず、
  # 2026-09-19T02:35Z 以降この監査は1回も走っていない（その間に監査対象パスへ
  # 触れたコミットが8件 main に入った）。escalation-rules.json の
  # post-merge-performance-budget（who: self_then_owner / within_hours: 24 /
  # channel: daily_report・2026-09-18 オーナー承認）は、この監査が走ることを
  # 前提にした規則なので、経路が無いままでは死文になる。
  #
  # 日次にするのは規則の cadence に合わせたため。09:00 JST の
  # autopilot-act.mjs による failure 取り込みより前に終わる時刻に置く。
  # **GitHub の scheduled 起動は数十分遅れることがある**ので 05:30 JST は公称値。
  schedule:
    - cron: '30 20 * * *'   # 05:30 JST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pagespeed-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize audit output directory
        run: |
          mkdir -p "$RUNNER_TEMP/perf-results"
          echo "PERF_RESULTS=$RUNNER_TEMP/perf-results" >> "$GITHUB_ENV"
          echo "PERF_EXPECTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install Japanese system fallback for realistic browser screenshots
        timeout-minutes: 3
        run: |
          # The Azure mirror can trickle forever without an inactivity timeout.
          # Keep the runner's existing official HTTPS fallbacks and APT trust.
          grep -qE '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' /etc/apt/apt-mirrors.txt
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          if grep -qF 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt; then exit 1; fi
          # Fail on unavailable package indexes and bound stalled mirrors.
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null <<'APT'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "2";
          APT::Update::Error-Mode "any";
          APT
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Reproduce generated assets and test integrity guards
        timeout-minutes: 3
        run: |
          pip install fonttools==4.63.0 brotli==1.2.1 Pillow==12.3.0
          # FontTools prefers brotlicffi when present; require the patched decoder.
          python -c "import brotli; from fontTools.ttLib import woff2; assert woff2.brotli is brotli; assert brotli.__version__ == '1.2.1'; print('WOFF2 decoder:', woff2.brotli.__name__, brotli.__version__)"
          python scripts/perf/build_home.py --check
          python scripts/perf/verify_home.py --selftest
          python scripts/perf/verify_home.py
          node --test scripts/perf/inline_styles.test.mjs scripts/perf/verify_production.test.cjs scripts/perf/browser_checks.test.cjs scripts/perf/lighthouse_runtime.test.cjs
          python scripts/perf/test_summarize.py
      - name: Install pinned browser measurement tools
        timeout-minutes: 2
        run: npm install --prefix "$RUNNER_TEMP/perf-tools" --no-save lighthouse@12.8.2 chrome-launcher@1.2.2 playwright@1.55.0
      - name: Verify production deployment after a main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: NODE_PATH="$RUNNER_TEMP/perf-tools/node_modules" node scripts/perf/verify_production.cjs --require
      - name: Observe the production revision for PR or manual audits
        if: github.event_name != 'push'
        run: NODE_PATH="$RUNNER_TEMP/perf-tools/node_modules" node scripts/perf/verify_production.cjs
      - name: Measure mobile pages and exercise responsive behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PERF_RESULTS"
          python3 scripts/perf/server.py > "$RUNNER_TEMP/perf-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          measure() {
            NODE_PATH="$RUNNER_TEMP/perf-tools/node_modules" node scripts/perf/lighthouse_runtime.cjs "$1" "$PERF_RESULTS/$2"
          }
          for run in 1 2 3; do
            measure http://127.0.0.1:8765/ "local-ja-$run"
            measure https://simplememofast.com/ "production-ja-$run"
            measure http://127.0.0.1:8765/en/ "local-en-$run"
            measure https://simplememofast.com/en/ "production-en-$run"
          done
          NODE_PATH="$RUNNER_TEMP/perf-tools/node_modules" node scripts/perf/browser_checks.cjs 2>&1 | tee "$PERF_RESULTS/browser-output.txt"
          # **本番を測る唯一の経路。**PERF_BASE_URL を production へ向けるのは
          # リポジトリ内でここだけ（grep -rn PERF_BASE_URL）。push が起きない
          # auto-merge 経由のデプロイを拾うため、schedule も同じ扱いにする。
          if [[ ( "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "schedule" ) && "$GITHUB_REF" == "refs/heads/main" ]]; then
            PERF_BASE_URL=https://simplememofast.com PERF_RESULTS="$PERF_RESULTS/production-browser" NODE_PATH="$RUNNER_TEMP/perf-tools/node_modules" node scripts/perf/browser_checks.cjs 2>&1 | tee "$PERF_RESULTS/production-browser-output.txt"
          fi
      - name: Report all runs and check mobile regression budgets
        if: always()
        run: python scripts/perf/summarize.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pagespeed-mobile-reports
          path: ${{ runner.temp }}/perf-results/
          retention-days: 14
          if-no-files-found: error
