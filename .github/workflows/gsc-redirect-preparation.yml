name: GSC redirect preparation
on:
  push:
    branches: [claude/gsc-redirect-87-20260916]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked audit inputs only
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          suffixes = {'.html', '.js', '.mjs', '.py', '.xml', '.json', '.yml', '.toml', '.jsonc', '.md', '.txt'}
          with zipfile.ZipFile('/tmp/gsc-audit-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  p = root / name
                  if name and p.is_file() and (p.suffix in suffixes or name in ('_redirects', '_headers')) and p.stat().st_size < 2000000:
                      if not any(part in ('.git', 'node_modules') for part in p.parts) and not p.name.startswith('.env'):
                          z.write(p, name)
          PY
      - name: Read-only public HTTP baseline
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse, json
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          for path in ['/', '/en', '/en?lang=en', '/vs/trello?lang=ja', '/vs/trello/', '/blog/captio-alternatives-comparison.html?lang=ja']:
              url = 'https://simplememofast.com' + path
              chain = []
              for step in range(5):
                  try:
                      r = opener.open(urllib.request.Request(url, headers={'User-Agent': 'SimpleMemo-Redirect-Audit/1.0'}), timeout=20)
                  except urllib.error.HTTPError as e:
                      r = e
                  except Exception as e:
                      chain.append({'url': url, 'error': str(e)}); break
                  status = r.code
                  location = r.headers.get('Location')
                  chain.append({'url': url, 'status': status, 'location': location})
                  r.close()
                  if status not in (301,302,303,307,308) or not location:
                      break
                  url = urllib.parse.urljoin(url, location)
              print(json.dumps(chain, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gsc-audit-source
          path: /tmp/gsc-audit-source.zip
          retention-days: 3
