name: Viewport Full Report

# Independent of SEO Validation: auto-merge waits for that entire workflow.
# Use the same event SHA / PR merge tree, not a later checkout of main or PR head.
# A PR report continues after merge; GITHUB_TOKEN merges do not emit push runs.
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: viewport-full-report-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  viewport-full-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      # 【描画側・報告のみ】判定にブラウザが要り、それを本番デプロイの門に乗せると
      # ブラウザ側の不調でCIが赤くなる（check-benchmark を報告のみにしたのと同じ理由）。
      # **落とす側は Runbook §4。**ランナーの Chrome を使うのでダウンロードはしない。
      # WebKit も測る。**Blink とは行分割の判断が違い、実機（iOS）はこちら側。**
      # 2026-09-03、実機で over=41px が出た版を Blink は 5幅すべてで over=0 と報告した。
      # `npx playwright install webkit` はサンドボックスの egress で塞がれていたが、
      # **apt の webkit2gtk-driver は通る**（WebKitGTK = Safari と同じ WebKit コア）。
      # ヘッドレスで動かないので Xvfb を併せて入れる。約30秒。
      # `apt-get update` を先に撃つ。**ランナーの索引は mirror より古いことがある** ——
      # 初回の実行が、索引の 2.52.3 を取りに行って mirror の 2.52.6 しか無く 404 で落ちた
      # （ローカルで同じ壁に当たって update で解けていたのに、CI 側へ写し忘れていた）。
      #
      # `continue-on-error` にしてあるのは、**apt の不調で本番デプロイを止めないため。**
      # このリポジトリは描画側の検査を報告のみにしており（ブラウザ側の不調でCIが赤くなる）、
      # ここも同じ扱いにする。**ただし黙らせない** —— 失敗すると手順が赤い警告で残り、
      # 検査本体も `WebKit — **測れなかった**` と理由つきで出す。
      # `|| true` にしないのはそのため（それだと成功と見分けがつかない）。
      #
      # `timeout-minutes` は**失敗しないまま止まる**ときのため。2026-09-30 の深夜（JST）、PR #1774 の
      # 検証（SEO Validation #4014 の1回目）がこの手順で `sudo apt-get update -qq` のあと何も出さずに
      # 1時間22分止まり（23:42 開始、01:05 に取り消し）、流し直すまでマージされなかった。
      # 流し直しでは27秒で通り、同じ時間帯の #1775・#1777・#1770 の検証も通っている。
      # 上限が無いとジョブの既定の360分まで待つので、「apt の不調で本番デプロイを止めない」が
      # 止まりのときには成り立たない。ふだんは約30秒なので10分で切り、失敗と同じ扱いで先へ進める。
      #
      # [2026-10-04] **Ubuntu 26.04 には `webkit2gtk-driver` が無い**（`webkitgtk-webdriver` が置き換える）。
      # `ubuntu-latest` は 2026-10-19〜11-19 に 26.04 へ切り替わる（GitHub の注記と actions/runner-images#14748）。
      # 切り替わる前に、この検証を `ubuntu-26.04` で流して確かめた（下書きの PR #1987）——
      # 1回目は `E: Package 'webkit2gtk-driver' has no installation candidate` で入らず、
      # 横漏れの検査が「WebKit — 測れなかった: WebKitWebDriver が無い」になった（門は緑のまま）。
      # 先に `webkit2gtk-driver` を試し、無ければ `webkitgtk-webdriver` を入れる形にした2回目は、
      # WebKit で 500 通りを実測できた（ドライバは今の探し方 `findWebKitDriver` のままで見つかった）。
      # 24.04 では1つ目がそのまま通るので、今の動きは変わらない。
      - name: Install WebKit (WebKitGTK + WebDriver)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb x11-utils; then
            sudo apt-get install -y --no-install-recommends webkitgtk-webdriver xvfb x11-utils
          fi

      - name: Landing pages do not scroll sideways (report-only)
        # Unchanged exhaustive page/width matrix and both Chromium and WebKit.
        # Completion/coverage comes from SIMPLEMEMO_VIEWPORT_V1, not workflow success.
        timeout-minutes: 60
        run: |
          npm i --no-save playwright-core
          node scripts/check-viewport-overflow.mjs --selftest || true
          node scripts/check-viewport-overflow.mjs --report
