name: Aftercare Report Diagnostic

on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/aftercare-report-diagnostic.yml']

permissions:
  contents: read

concurrency:
  group: aftercare-report-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.repository == 'simplememofast/simplememo' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'Codex/aftercare-report-diagnostic-20260918' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main
            ref: 2c25e4b5fc4f3395cdc7c16e27a23868510b59e3
          - label: pr1447-head
            ref: cbd59a9aab690ce54acf86cde4c5e6782108c56a
          - label: pr1447-merge
            ref: 4ceb0418aa81c863ebdecb24cc1a332e9d16abff
    steps:
      - name: Check out the fixed public code revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up the existing CI Node major
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reproduce page drift without reconciling any ledger
        env:
          EXPECTED_SHA: ${{ matrix.ref }}
          DIAGNOSTIC_LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess

          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'report-diagnostic'
          out.mkdir()
          expected = os.environ['EXPECTED_SHA']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == expected, 'Checkout does not match the fixed revision'
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          tracked_data = subprocess.check_output(['git', 'ls-files', 'data'], text=True).splitlines()
          before_data = {p: digest((root / p).read_bytes()) for p in tracked_data if (root / p).is_file()}
          page = root / 'autopilot/index.html'
          before_page = page.read_bytes()
          (out / 'page-before.html').write_bytes(before_page)
          sources = {}
          for name in ('scripts/check-autopilot-page.mjs', 'scripts/decision-monitor.mjs',
                       'scripts/lib/decision-report.mjs', '.github/workflows/autopilot-act.yml'):
              path = root / name
              if path.is_file():
                  raw = path.read_bytes()
                  sources[name] = {'sha256': digest(raw), 'git_blob': subprocess.check_output(
                      ['git', 'rev-parse', 'HEAD:' + name], text=True).strip(), 'bytes': len(raw)}
          # This job has no production credentials and never invokes --apply,
          # --once, an intake handler, a model, a database reader or a deployment.
          commands = [
              ('page-before', ['node', 'scripts/check-autopilot-page.mjs', '--check']),
              ('render', ['node', 'scripts/decision-monitor.mjs', '--publish-report']),
              ('page-after', ['node', 'scripts/check-autopilot-page.mjs', '--check']),
          ]
          results = []
          for name, argv in commands:
              try:
                  run = subprocess.run(argv, cwd=root, text=True, capture_output=True, timeout=90)
                  (out / (name + '.stdout.txt')).write_text(run.stdout)
                  (out / (name + '.stderr.txt')).write_text(run.stderr)
                  results.append({'name': name, 'argv': argv, 'exit_code': run.returncode})
              except subprocess.TimeoutExpired:
                  results.append({'name': name, 'argv': argv, 'timed_out': True})
                  break
          after_data = {p: digest((root / p).read_bytes()) for p in before_data if (root / p).is_file()}
          data_unchanged = before_data == after_data
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          after_page = page.read_bytes()
          (out / 'page-after.html').write_bytes(after_page)
          (out / 'page.diff').write_bytes(subprocess.check_output(['git', 'diff', '--', 'autopilot/index.html']))
          summary = {
              'observed_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'label': os.environ['DIAGNOSTIC_LABEL'], 'fixed_commit': head,
              'sources': sources, 'commands': results, 'data_files_unchanged': data_unchanged,
              'changed_paths': changed, 'page_before_sha256': digest(before_page),
              'page_after_sha256': digest(after_page),
              'production_accessed': False, 'ledger_intake_invoked': False,
              'model_invoked': False, 'git_published': False,
          }
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          # Fixed, already-public source/data fixture for offline reproduction.
          # Archive committed bytes only, never .git, environment or runner files.
          subprocess.run(['git', 'archive', '--format=tar.gz', '-o', str(out / 'public-source-fixture.tar.gz'),
                          head, 'scripts', 'data', 'autopilot/index.html', 'index.html', 'en/index.html',
                          '.github/workflows', 'CLAUDE.md'], check=True)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          assert data_unchanged, 'The report command modified a data file; do not publish'
          assert set(changed) <= {'autopilot/index.html'}, 'Unexpected changed paths; do not publish'
          assert all('timed_out' not in result for result in results), 'Bounded diagnostic timed out'
          # Reproduction findings stay in their individual exit_code fields.
          # Passing this transport job does not certify the page or original CI.
          PY
      - name: Retain isolated diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aftercare-report-${{ matrix.label }}
          path: ${{ runner.temp }}/report-diagnostic/
          retention-days: 3
          if-no-files-found: error
