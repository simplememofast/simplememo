name: Analytics API (encrypted)
run-name: Analytics API ${{ inputs.request_tag }}

on:
  workflow_dispatch:
    inputs:
      report:
        description: Fixed read-only report
        type: choice
        options: [preflight, gsc, ga4-quality, ga4-funnel]
        default: preflight
      execution:
        description: Validate SQL or retrieve the aggregate results
        type: choice
        options: [dry-run, export]
        default: dry-run
      start_date:
        description: Inclusive YYYY-MM-DD (empty for preflight)
        type: string
      end_date:
        description: Inclusive YYYY-MM-DD (empty for preflight)
        type: string
      recipient_public_key_base64:
        description: Base64-encoded RSA public PEM; never provide a private key
        type: string
        required: true
      request_tag:
        description: Unique nonsecret identifier used to find this run
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: analytics-api-read
  cancel-in-progress: false

jobs:
  read:
    # Google credentials are used only with reviewed code on the default branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read fixed report and encrypt the result
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          ANALYTICS_REPORT: ${{ inputs.report }}
          ANALYTICS_EXECUTION: ${{ inputs.execution }}
          ANALYTICS_START_DATE: ${{ inputs.start_date }}
          ANALYTICS_END_DATE: ${{ inputs.end_date }}
          ANALYTICS_RECIPIENT_PUBLIC_KEY_BASE64: ${{ inputs.recipient_public_key_base64 }}
          ANALYTICS_ENCRYPTED_OUTPUT: ${{ runner.temp }}/analytics-export/analytics.enc.json
        run: node growth/scripts/export-analytics.mjs
      - name: Retain encrypted report (including diagnostic failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-${{ github.run_id }}
          path: ${{ runner.temp }}/analytics-export/analytics.enc.json
          if-no-files-found: error
          retention-days: 7
