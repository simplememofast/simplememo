name: PageSpeed 1449 Classify Observed Failure
on:
  push:
    branches: [claude/pagespeed-1449-gate-diagnosis-20260918]
    paths: [.github/workflows/pagespeed-1449-classify-once.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2eb207418cf067064922e432884f45e444fbf161
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original failed gates and stage one-field correction
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const assert=require('node:assert/strict');
            const expected='2eb207418cf067064922e432884f45e444fbf161';
            const pr=(await github.rest.pulls.get({...context.repo,pull_number:1449})).data;
            assert.equal(pr.state,'open');assert.equal(pr.draft,true);assert.equal(pr.head.sha,expected);
            const proofs=[];
            for(const [id,sha] of [[35231730962,'e4f4061910e9de07cb79ed3a29ac5f29c4047f6a'],[35235783346,'3298c729a91ffda8b06e439401c07dd87bb05211']]){
              const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:id})).data;
              assert.equal(run.head_sha,sha);assert.equal(run.conclusion,'failure');
              const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:id})).data.jobs;
              const job=jobs.find(j=>j.name==='mobile-audit');assert(job);
              assert.equal(job.steps.find(s=>s.name==='Measure mobile pages and exercise responsive behavior')?.conclusion,'success');
              assert.equal(job.steps.find(s=>s.name==='Report all runs and check mobile regression budgets')?.conclusion,'failure');
              proofs.push({id,sha,job_id:job.id,conclusion:run.conclusion});
            }
            const file='data/autopilot-runs.json';
            const text=fs.readFileSync(file,'utf8'),before=JSON.parse(text),after=JSON.parse(text);
            const row=after.runs.find(r=>r.run_id==='ap-20260917-owner-session-pagespeed-poster');
            assert(row);assert.equal(row.outcome,'failed');assert.equal(row.route,'owner-session');
            assert.equal(row.needs_triage,true);assert.equal(row.failure_class,undefined);
            row.failure_class='post-merge-performance-budget';
            const copy=structuredClone(after);delete copy.runs.find(r=>r.run_id===row.run_id).failure_class;
            assert.deepEqual(copy,before,'Only the observed failure classification may change');
            const modified=JSON.stringify(after,null,2)+'\n';
            fs.writeFileSync(file,modified);
            const dir=process.env.RUNNER_TEMP+'/classification-proof';fs.mkdirSync(dir,{recursive:true});
            fs.writeFileSync(dir+'/evidence.json',JSON.stringify({source:expected,proofs,run_id:row.run_id,failure_class:row.failure_class,root_cause:'unproven; needs_triage and original failure remain unchanged'},null,2));
      - name: Existing boundary and ledger checks must pass
        run: |
          node scripts/autopilot-selfheal.mjs --check
          node scripts/autopilot-runs.mjs --check
          node scripts/autopilot-runs.mjs --selftest
          git diff --check
          git diff -- data/autopilot-runs.json > "$RUNNER_TEMP/classification-proof/correction.patch"
      - name: Commit only the verified ledger blob to the same unchanged draft
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),assert=require('node:assert/strict');
            const expected='2eb207418cf067064922e432884f45e444fbf161';
            const pr=(await github.rest.pulls.get({...context.repo,pull_number:1449})).data;
            assert.equal(pr.state,'open');assert.equal(pr.draft,true);assert.equal(pr.head.sha,expected);
            assert.equal(pr.head.ref,'claude/pagespeed-hero-density-20260918');
            const path='data/autopilot-runs.json';
            const prior=(await github.rest.repos.getContent({...context.repo,path,ref:expected})).data;
            assert.equal(prior.sha,'680d4717446de20f6f1bbe9c8d8af58c64e00947');
            const response=(await github.rest.repos.createOrUpdateFileContents({...context.repo,path,branch:pr.head.ref,sha:prior.sha,content:fs.readFileSync(path).toString('base64'),message:'fix(ops): classify observed post-merge performance gate failure without claiming its cause'})).data;
            fs.writeFileSync(process.env.RUNNER_TEMP+'/classification-proof/commit.json',JSON.stringify({sha:response.commit.sha,blob:response.content.sha,parent:expected},null,2));
            core.notice('Updated exact draft only: '+response.commit.sha);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed-1449-classification-proof
          path: ${{ runner.temp }}/classification-proof/
          retention-days: 7
          if-no-files-found: error
