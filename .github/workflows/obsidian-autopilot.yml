# Obsidianオートパイロットの独立フォールバック（GitHub Actions / Claude OAuth）。
#
# 【2026-09-19 再有効化】06:00 JST のMac Codex主系が利用枠で2日続けて
# 出荷できず、同じCodex枠の補完だけでは経路冗長化にならないことが実測された。
# このActions経路を07:30 JSTに戻し、主系が当日claim/statusを残していればGateで
# 何もせず終了、主系が出せなかった日だけ別プロバイダーのOAuth枠で引き継ぐ。
# 起動・失敗・成果はGitHub Actionsに残るため、外から後追いできる。
#
# 【二重実行の防止】主・副どちらも実行前に同じ2つを見る:
#   (1) origin に claude/obsidian-auto-<当日JST> ブランチが既にある
#   (2) 本番の data/autopilot-status.json の date_jst が当日
# どちらかが真なら即終了。(1)は進行中/未マージを、(2)はマージ済みを検知する。
#
# 【ANTHROPIC_API_KEY は使わない — 2026-09-03 オーナー判断】
# 「追加チャージなら使わない方向」。API課金はサブスクとは別勘定で、
# data/autopilot-cost.json の monthly_usd_cap（$280）の外に**第2の請求経路**ができる。
#
# **ANTHROPIC_API_KEY はこの経路から完全に外す。**429の回避を追加API課金へ
# すり替えない。独立性は、Mac Codexとは別の既存CLAUDE_CODE_OAUTH_TOKEN
# （サブスク枠）で持つ。API key がrepoに存在しても、このworkflowは読まない。
#
# 【OAuthが無い間は静かに寝る】CLAUDE_CODE_OAUTH_TOKEN が必要。
# 未設定ならGateで実行せず、課金経路を自動で増やさない。
#
# 【2026-10-20 権限の分離 — モデルが動くジョブは書き込みの資格情報を持たない】
# モデルは WebFetch/WebSearch・GSC のクエリ文字列など第三者の文章を読む。同じ
# ランナーに GH_PAT や書き込みトークンがあると、注入された指示がそのまま push・
# PR・本番デプロイに届く（監査 F2/F3）。ジョブの秘密情報は sudo で同じランナーの
# 別ステップからも読めるため、**GH_PAT はモデルのジョブ全体から外した。**
#   autopilot … モデルが動く。読み取り専用の job token・資格情報を残さない checkout・
#               id-token なし。作業はローカルのコミットまで（git bundle で引き渡す）。
#   publish   … 新しいランナーでモデルを動かさず、$GITHUB_SHA の
#               scripts/autopilot-publish.mjs だけを実行する。引き渡しを検証し
#               （fsck・経路の拒否リスト・コミットの名義・緊急停止・重複）、当日ブランチへ
#               force なしで push、PR 作成、運転台帳への PR 番号の記帳、成果物の照合。
#               GH_PAT はここの3段（push・PR作成・記帳の push）にだけ渡す。
# PR は従来どおり GH_PAT の持ち主が開く（GITHUB_TOKEN の push は SEO Validation を
# 起動せず auto-merge が来ないため。seo-daily.yml と同じ理由）。

name: Obsidian Autopilot

# Mac Codex remains the 06:00 JST primary. This workflow is the independent
# 07:30 JST fallback; the shared daily claim/status Gate prevents double shipping.
# workflow_dispatch remains for explicit recovery/diagnosis.
on:
  schedule:
    - cron: '30 22 * * *' # 07:30 JST
  workflow_dispatch:
    inputs:
      force:
        description: '当日分の実行痕跡があっても実行する（検証用）'
        type: boolean
        required: false
        default: false

# 既定は無権限。ジョブごとに必要なものだけを書く（モデルのジョブは読み取りのみ）。
permissions: {}

concurrency:
  group: obsidian-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 読み取りだけ。Gate・成果物の基準点・モデルの gh は job token（読み取り専用）で読む。
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    # publish ジョブへ渡すもの。モデルより前に決まった値（run・日付・takeover・基準点・
    # モデルの結果）だけが判定に使われ、モデルより後の段の値は記録用の手掛かりに留まる。
    # 実行の要約（JSON）はジョブ出力にしない。このジョブでは `{` `}` がマスク対象の値に含まれ、
    # JSON のジョブ出力はランナーが捨てる（2026-10-22 run 39701630744 の
    # "Skip output 'exec_summary' since it may contain secret"）。要約は引き渡しの summary.json で渡す。
    outputs:
      run: ${{ steps.gate.outputs.run }}
      today: ${{ steps.gate.outputs.today }}
      today_dash: ${{ steps.gate.outputs.today_dash }}
      takeover: ${{ steps.gate.outputs.takeover }}
      baseline: ${{ steps.output_baseline.outputs.baseline }}
      model_outcome: ${{ steps.claude.outcome }}
      audit_verdict: ${{ steps.audit.outputs.verdict }}
      checkpoint_outcome: ${{ steps.checkpoint.outcome }}
      checkpoint_saved: ${{ steps.checkpoint.outputs.saved }}
      checkpoint_reason: ${{ steps.checkpoint.outputs.reason }}
      declared_page_change_count: ${{ steps.checkpoint.outputs.declared_page_change_count }}
    steps:
      # 【なぜ checkout が先か】判定を .yml の中に持たない。
      #
      # 2026-09-02、`isAbandonedClaim()`（死んだ占有の引き継ぎ）を
      # `scripts/autopilot-gate.mjs` に入れたが、**同じ判定をここの bash へ移す
      # push が GitHub に拒否された** —— GH_PAT に `workflow` scope が無いため。
      # scope は意図的に足さないと決めてある（`act-gh-pat-scope-and-rotation`。
      # 足すと無人の主系が自分の permissions を書き換えられる）。結果、
      # **Runbook を読む経路だけが新しい判定になり、主系は旧判定のまま残った。**
      #
      # bash を書き直す代わりに、判定そのものをここから出した。以後この判定の
      # 修理は `scripts/` への普通のPRで主系にも届く（workflow scope が要らない）。
      # **権限は1ミリも広げていない。**広げずに自己修復の届く範囲だけを広げてある。
      #
      # 代償は、スキップする日も checkout ぶんのランナー時間を使うこと。
      # **それは払う。**払わない代わりに払っていたのは「片方だけ直る」ことだった。
      - name: Checkout（読み取り専用・全履歴）
        uses: actions/checkout@v4
        with:
          # 資格情報を .git/config に残さない。push と PR 作成は publish ジョブが行う
          # （このジョブには書き込みの資格情報が無い）。
          persist-credentials: false
          # sitemap の lastmod は git 履歴から引くため浅いと全ページ分が壊れる
          fetch-depth: 0

      # 【Gate】秘密鍵・当日ブランチの占有（死んだ占有の引き継ぎを含む）・
      # 本番/main の当日分を見る。判定は scripts/autopilot-gate.mjs の decide() で、
      # ドリル（19シナリオ）と性質テストが同じ関数を固定している。
      #
      # **例外で赤くしない。**判定器が落ちた日は「実行済みかもしれない」側へ倒し、
      # notice に理由を出す（赤い通知は翌日から読まれなくなる）。
      #
      # GH_TOKEN は占有の**中身**（差分・PR・経過分）を読むために要る。読むだけなので
      # job token（このジョブでは読み取り専用）で足りる。
      - name: Gate（秘密鍵・当日重複・死んだ占有の引き継ぎ）
        id: gate
        env:
          HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          # This fallback is OAuth-only. Never open a second API-billing path.
          HAS_ANTHROPIC_KEY: 'false'
          FORCE: ${{ inputs.force == true }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # job_started_epoch: モデルの後の1回の再開がジョブ上限に収まるかを測る起点（モデルより前に記録する）。
        run: |
          echo "job_started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          node scripts/autopilot-gate.mjs --preflight

      # 【判定コードを Actions API から読めるようにする】(2026-09-04)
      #
      # 判定コードは `$GITHUB_OUTPUT` にも `::notice` にも出ているが、
      # **Actions API の run 一覧から読めるのはステップの name と conclusion だけ。**
      # 注釈は checks:read が要り、ジョブログは追加の取得経路が要る。
      # ステップ名に埋めれば、日次アクチュエータが**いま既に取っている情報**の中に入る。
      #
      # **なぜ要るか。**運転台帳は「なぜ寝たか」を持たない行を
      # declined_unrecorded として区別する（2026-09-04〜）。停止理由のうち3つ
      # （緊急停止・1回上限・月次上限）はステップの実行結果から一意に決まるが、
      # **秘密鍵未設定と当日重複は同じ形になる** —— どちらも「Gate が run=false を
      # 出して以降が skipped」。実際 08-27〜29 の3日連続の沈黙は、
      # **正常な冪等スキップなのか主系が壊れているのか誰も言えないまま4日目まで残った。**
      #
      # 何もしないステップなので、これ自体が run を止めることはない。
      # 判定そのもの（autopilot-gate.mjs）には1ミリも触っていない。
      - name: "判定コード: ${{ steps.gate.outputs.code }}"
        if: always()
        run: 'true'

      # 【予算ゲート】当月の実費が上限に達していたら、今日の主系runを止める。
      #
      # 「可視化した」と「予算に応じて止まる」は別物で、外に言えるのは後者だけ。
      # scripts/autopilot-budget.mjs --check が非ゼロを返し、この step の出力を
      # 下の2ステップが見て実際に走らないところまで通っていて初めて自己制御になる。
      # 表示だけなら「見ているが従っていない」であり、それは growth/README.md が
      # 冒頭で戒めている「散文は手を挙げない」の別形態でしかない。
      #
      # 台帳（data/autopilot-cost.json）が壊れているときも止める。壊れた台帳は
      # 「集計できない」ではなく「上限に永久に当たらない」＝安全装置の停止を意味する。
      # continue-on-error にはしない — フォントは記事より優先されてはいけないが、
      # 上限は記事より優先される。ここだけは逆にする。
      #
      # 止められるのは主系だけである。副系CCR Routineは別経路で、
      # スケジュール起動セッションのログは外から読めない（Runbook §0-2）ため
      # 観測も停止もできない。この非対称性はスクリプトの出力にも書いてある。
      # 【緊急停止】**他のどの判定よりも先に見る。**
      #
      # 予算ゲートは主系しか止めず、秘密鍵の削除は「静かに寝る」ので止めたのか
      # 壊れたのか区別がつかない。ワークフローの無効化は GitHub が読める必要がある。
      # **主系と副系を同時に、確実に、意図が残る形で止める手段が無かった。**
      #
      # チェックアウト後に置いてあるのは、この判定がリポジトリのファイルだからで、
      # 主系（Actions）も副系（CCR）も作業前に必ずチェックアウトするため両方に効く。
      # ここより手前で走るのは checkout だけなので、止め損ねる範囲は無い。
      # 全体停止と**この経路（actions）の停止**の両方を見る。片方だけだと、
      # 「主系だけ止めたい」ときに止まらない。
      - name: 緊急停止の確認
        if: steps.gate.outputs.run == 'true'
        id: estop
        run: |
          STOP="$(node -p "
            const d = require('./data/emergency-stop.json');
            const a = (d.agents || {}).actions || {};
            d.stopped ? ('all:' + (d.reason || '理由未記入'))
              : a.stopped ? ('actions:' + (a.reason || '理由未記入'))
              : '';
          ")"
          if [ -z "$STOP" ]; then
            echo "stopped=false" >> "$GITHUB_OUTPUT"
          else
            echo "stopped=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Emergency stop::停止が立っている: ${STOP}。data/emergency-stop.json"
            exit 1
          fi

      # 【封じ込め】同じ故障を上限回数直して再発しているなら、**この経路を走らせない。**
      #
      # これまでは「⛔ 人に上げる」と表示するだけだった。表示は翌朝の実行を
      # 止めないので、上げた先が見ていない間、直せない故障を毎日直そうとする
      # ループが回り続ける。着手前に止めるところまでを機械にやらせる。
      #
      # ここは --dry-run（書かずに落ちるだけ）。判定は data/autopilot-runs.json
      # から毎回導出されるので、状態を残さなくても翌朝また同じ結論になる。
      # 停止を台帳に書いて残す形にすると、このレーンに main への書き込み権限が
      # 要る — self_repair.must_not の「自分の権限を広げない」に正面から反する。
      # 台帳へ書くのは人かセッション（--contain）で、通常のPR経路を通る。
      #
      # 【所有者承認の試運転（1回限り）】オーナーが Settings → Secrets and variables →
      # Actions → Variables に AUTOPILOT_RECOVERY_ONCE = JST の日付 を入れた日の
      # **定時の1回目だけ**、封じ込めを越える（docs/obsidian/ACTIONS_RECOVERY_ONE_USE.md）。
      # 対象の故障行・修理回数・上限が1つでも変わっていれば越えない。変数はこの段にだけ渡す。
      - name: 封じ込め（修理上限に達した経路は着手しない）
        id: contain
        if: steps.gate.outputs.run == 'true' && steps.estop.outputs.stopped == 'false'
        env:
          AUTOPILOT_RECOVERY_ONCE: ${{ vars.AUTOPILOT_RECOVERY_ONCE }}
        run: node scripts/autopilot-selfheal.mjs --contain --dry-run

      # 試運転だったことを Actions API の段名から読めるようにする（判定コードの段と同じ理由）。
      - name: 所有者承認の試運転（1回限り）
        if: steps.contain.outputs.recovery == 'actions_once'
        run: 'true'

      - name: 予算ゲート（当月の実費が上限を超えていたら走らない）
        if: steps.gate.outputs.run == 'true'
        id: budget
        run: |
          if node scripts/autopilot-budget.mjs --check; then
            echo "within=true" >> "$GITHUB_OUTPUT"
          else
            echo "within=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Obsidian Autopilot::当月のAI実費が上限に達したため主系をスキップ（data/autopilot-cost.json）。副系CCRは別経路のため止まらない。"
          fi
          node scripts/autopilot-budget.mjs >> "$GITHUB_STEP_SUMMARY"

      # 【タスク種別とモデルの振り分け】
      #
      # その日が「記事を書く日」か「壊れた基盤を直す日」かで、要る能力が違う。
      # 故障の原因特定を安いモデルにやらせると外し、レーンFの歯止め
      # （同一 failure_class 3回で人間へ）に早く当たる。**安いほうが高くつく。**
      #
      # モデル名をここに直書きしない。直書きすると data/model-routing.json が
      # 装飾になり、check-model-routing.mjs が守っている「不可逆なタスクを
      # 最安ティアに落とさない」規則も効かなくなる。
      #
      # 種別ごとの残枠もここで見る。月次上限だけだと、記事で使い切った月に
      # 修理が走らない（あるいはその逆）が起きる。
      - name: タスク種別とモデルの振り分け
        if: steps.gate.outputs.run == 'true' && steps.budget.outputs.within == 'true'
        id: route
        run: |
          if node scripts/autopilot-selfheal.mjs --json | grep -q '"lane_f_required": true'; then
            KIND=repair
          else
            KIND=article
          fi
          MODEL="$(node scripts/check-model-routing.mjs --resolve "$KIND")"
          echo "kind=$KIND"   >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Model routing::$KIND -> $MODEL"
          # 種別ごとの枠。超えていても主系全体は止めない（月次上限がその役目）。
          # ここは「この種別はもう枠を使い切っている」を日報へ出すための警告。
          node scripts/autopilot-budget.mjs --check --task "$KIND" \
            || echo "::warning title=Task budget::$KIND の月次枠を超過（月次上限には未到達）"

          # 【1回あたりの上限】data/model-routing.json の max_usd_per_run は
          # 2026-08-25 まで**宣言だけ**で、実行時に見る経路が無かった。08-23 の
          # 1回は article の上限 $2.00 に対し $7.2967（3.6倍）を使い切って正常終了
          # している。**上限は在ったが当たらなかった。**
          #
          # SDKは応答ごとに費用を加算する。既存上限を実行中の閾値にも渡し、
          # 超過後の呼出を止める。進行中の応答分は超え得るため事後検査も残す。
          # 未レビュー超過は次の1回を止める。**種別ごとに見る**ので、
          # 記事の超過が修理（レーンF）を止めることはない。
          #
          # 止まるのは主系だけ。副系CCRは別経路なので、人間のレビューを待つ間も
          # 出荷は続く。**二重化が承認待ちを吸収する。**
          if node scripts/autopilot-budget.mjs --check-run-cap --task "$KIND"; then
            RUNTIME_BUDGET="$(node scripts/autopilot-budget.mjs --runtime-budget --task "$KIND")"
            echo "runtime_budget_usd=$RUNTIME_BUDGET" >> "$GITHUB_OUTPUT"
            echo "run_cap_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_cap_ok=false" >> "$GITHUB_OUTPUT"
            # 月次上限の分岐と同じ形で notice を出す。**止まった日が無音だと
            # 「今日は書くことが無かった」と見分けがつかない。**解除は人間のみ
            # なので、無音のまま毎日この形で止まり続けるのがいちばん悪い。
            echo "::notice title=Obsidian Autopilot::$KIND の1回あたり実費上限が未レビューのため主系をスキップ。解除は node scripts/autopilot-budget.mjs --ack-overrun <run_id> --why \"…\"（人間のみ）。副系CCRは別経路のため止まらない。"
          fi

      # SEO Daily's daily snapshot exists only in its separate runner.
      # Pass verified data to the model; keep credentials in this step.
      - name: Collect verified Search Console inputs
        id: collect_data
        if: >-
          steps.gate.outputs.run == 'true' && steps.budget.outputs.within == 'true'
          && steps.route.outputs.run_cap_ok == 'true'
        timeout-minutes: 5
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: node scripts/autopilot-data.mjs --output "$RUNNER_TEMP/autopilot-data.json"

      # 【2026-08-20】この1行が主系の初回本番運転を丸ごと潰した。秘密鍵を入れて
      # 初めてGateを通った run 32303452390 で、apt が**一切出力しないまま**
      # 21:21Z→22:52Z の90分（ジョブ上限）を使い切り、`Claude Code` は
      # skipped のまま終わった。その日の記事はゼロ。
      #
      # 出力が皆無なので根本原因はログからは確定できない（updateで詰まったのか
      # installで詰まったのかも区別できない）が、最も疑わしいのはランナー背後の
      # unattended-upgrades が握る apt/dpkg ロックの待ち。そこで
      # DPkg::Lock::Timeout で「待たずに諦める」ようにしてある。
      #
      # ただし本質はそこではない。**フォントは記事より優先されてはいけない。**
      # あって綺麗になるだけのものが、無いと1日分の出荷を止められる構造が誤り
      # なので、時間を区切り（5分）失敗を許容する（continue-on-error）。
      # フォントが入らない日はQAスクリーンショットの和文が豆腐になるだけで、
      # 記事は出る。逆にはしない。
      - name: 日本語フォント（ページQAスクリーンショット用・失敗しても続行）
        if: steps.gate.outputs.run == 'true' && steps.budget.outputs.within == 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y -qq --no-install-recommends fonts-noto-cjk

      - name: Capture output baseline before the model
        id: output_baseline
        if: >-
          steps.gate.outputs.run == 'true' && steps.budget.outputs.within == 'true'
          && steps.route.outputs.run_cap_ok == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TODAY_DASH: ${{ steps.gate.outputs.today_dash }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/output-tools" "$GITHUB_SHA"
          node "$RUNNER_TEMP/output-tools/scripts/autopilot-output.mjs" --capture "$RUNNER_TEMP/autopilot-output-before.json"
          # モデルより前の基準点を publish ジョブの照合へ渡す（1 KB 未満）。
          echo "baseline=$(base64 -w0 "$RUNNER_TEMP/autopilot-output-before.json")" >> "$GITHUB_OUTPUT"

      # 【2026-08-21】run 32419185478（06:23 JST）はこのステップが**3秒**で
      # failure になり、その日の主系出荷がゼロになった。08-20 のapt詰まりとは
      # 別物で（フォント導入は同runで9秒・success）、ジョブログの実際の1行は:
      #
      #   Action failed with error: Workflow initiated by non-human actor:
      #   github-actions (actor not found on GitHub). Add bot to allowed_bots
      #   list or use '*' to allow all bots.
      #
      # claude-code-action@v1 はフローティングタグなので、非人間アクターを
      # 拒否するガードが後から乗ってくる。schedule 起動の triggering_actor は、
      # 直前にmainへ書き込んだのが auto-merge（github-actions[bot]）だと
      # `github-actions` になり、これに当たる。
      #
      # このワークフローは schedule と workflow_dispatch でしか起動しない。ただし
      # **起動経路が閉じていても、第三者の文章はセッションに入る**（WebFetch/WebSearch・
      # GSC のクエリ・Issue 本文）。だから安全はここで判断せず、ジョブの権限で担保する:
      # このジョブには GH_PAT も書き込みトークンも id-token も無く、push と PR 作成は
      # モデルを動かさない publish ジョブが検証してから行う（2026-10-20）。
      - name: Claude Code（Runbook 1イテレーション実行）
        id: claude
        if: >-
          steps.gate.outputs.run == 'true' && steps.budget.outputs.within == 'true'
          && steps.route.outputs.run_cap_ok == 'true'
        # ジョブ上限（90分）より前に止め、引き渡しの梱包と upload が必ず走るようにする。
        timeout-minutes: 75
      # 【2026-08-25 SHA pin】フローティングタグ @v1 をやめて版を固定する。
      #
      # 発端は 08-24・08-25 の2日連続の即時失敗で、そのとき @v1 が指していたのは
      # c81e3bc6（Claude Code 2.1.241）だった。直前に出荷できた 08-23 は
      # 24dcd50c / 2.1.240、復旧した 08-25 15:16 は 16b3b310 / 2.1.245。
      #
      # 【2026-08-26 実測】**あの2日の原因は版ではなく資格情報だった。**
      # 2.1.241 を現在の有効なトークンで直接走らせたら正常に完走している
      # （run 32919495397 / is_error=false / result="PROBE_OK" / 実費 $0.04）。
      # 上流の差分も clone して読んだ: c81e3bc6→16b3b310 の src/ の違いは
      # `const claudeCodeVersion = "2.1.241" → "2.1.245"` の1文字列だけで、
      # ラッパーのロジックは同一。**版が失敗を説明できる余地が無かった。**
      #
      # **それでも pin は残す。理由が変わっただけ。**
      # 当時の「壊れた版を引いた」という理由は実測で否定されたが、08-21 の
      # allowed_bots は本当にフローティングタグが原因で（非人間アクターを拒否する
      # ガードが後から乗ってきた）、本番デプロイまで直結する経路が実行のたびに
      # 上流の最新版へ勝手に乗り換える構造そのものは残っている。
      #
      # **pin が副産物として効くのはこちら:** 版が固定されていれば、次に同じ形の
      # 即時失敗が出たとき「直近の成功と同じSHAか」を見るだけで版を機械的に外せる。
      # 08-25 に版を疑って1日を使ったのは、@v1 では**SHAが常に違って見える**ため
      # だった（フローティングタグでは日をまたげばほぼ必ず変わる。あの対照は
      # 原因が何であれ必ず「違い」を見つける）。pin はこの誤読を構造的に塞ぐ。
      #
      # 代償は上流の修正も自動では入らないこと。**それは意図した代償**で、
      # 版を上げるのは data/autopilot-actions.json に起票してから行う
      # （いつ・なぜ上げたかが残る）。上げるときはこの行のSHAとコメントを一緒に直すこと。
        uses: anthropics/claude-code-action@16b3b310c3d7b5279df73130324d5205aeea8eac # v1 (Claude Code 2.1.245 / Agent SDK 0.3.245)
        env:
          # 読み取り専用の job token（gh で前回 run のログ等を読むため）。書き込みはできない。
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "*"
          # 【2026-08-22】run 32528028588 は Claude Code ステップが success で
          # 終わりながら成果物がゼロだった。ジョブログの result 行は
          # num_turns=30 / permission_denials_count=14 / cost $0.81。
          #
          # 原因は claude_args に `--allowedTools` が無かったこと。
          # claude-code-action の既定はファイル操作・読み取り専用git・コメント
          # 操作までで、**任意のBashは既定で不許可**。一方このプロンプトが要求
          # するのは git のブランチ作成/commit/push・`gh pr create`・
          # `npx playwright install`・node の検証スクリプトで、全てBash。
          # つまり出荷手段が最初から全部塞がれた状態で30ターン回り、何も出せない
          # まま success で終わっていた。
          #
          # リポジトリに `.claude/settings.json` が無いので、SDKの settingSources
          # にある project 層でも補われない。ここで明示するのが唯一の経路。
          #
          # Bash の全面許可が無害だという根拠は「外部起動が無い」ではない（第三者の
          # 文章はセッションに入る）。根拠はこのジョブの権限で、Bash からも push・
          # PR 作成・本番への書き込みに使える資格情報が無い（2026-10-20）。
          # 【2026-10-24 引き渡しは構造化した結果で・背景実行は無し】試運転は2回とも依頼ファイルを書かずに終わり
          # （10-22・10-24）、10-24 の再開は0ターンだった（主セッションが残した背景タスクの古い通知に
          # CLI が先に答え、action はその最初の result で止まる）。
          #   --json-schema … 最後の結果を HANDOFF_SCHEMA の形で返させる。StructuredOutput を呼ばずにターンを
          #                   終えると CLI 自身が呼ぶよう求める。--inspect-handoff がこれを2つのファイルへ写す。
          #   --settings    … 背景実行を止め（再開が古い通知に当たらない）、Bash の既定10分・上限40分を明示する。
          #   --disallowedTools … 監視・ワークフロー・予約ターンを始める道具は、この経路では答えが返らない。
          # 3つとも scripts/autopilot-publish.mjs の MAIN_SETTINGS・MAIN_DISALLOWED_TOOLS・HANDOFF_SCHEMA と
          # 同じ文字列であることを --check が検査する（片方だけ直すと SEO Validation で落ちる）。
          claude_args: |
            --max-turns 250
            --max-budget-usd ${{ steps.route.outputs.runtime_budget_usd }}
            --model ${{ steps.route.outputs.model }}
            --settings '{"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1","BASH_DEFAULT_TIMEOUT_MS":"600000","BASH_MAX_TIMEOUT_MS":"2400000"}}'
            --disallowedTools "Monitor,Workflow,ScheduleWakeup,CronCreate,CronDelete,RemoteTrigger,PushNotification"
            --json-schema '{"type":"object","additionalProperties":false,"required":["exit_code","request"],"properties":{"exit_code":{"type":"string","enum":["shipped_pr","no_ship_pr","skipped_already_done","blocked_unverifiable","blocked_scope","blocked_local_check","abandoned_after_declaration","tool_denied","other"]},"request":{"type":"object","additionalProperties":false,"required":["action"],"properties":{"action":{"type":"string","enum":["pr","push_only","none"]},"title":{"type":"string","minLength":1,"maxLength":200},"body":{"type":"string","maxLength":30000},"run":{"type":"object","additionalProperties":false,"required":["run_id","outcome"],"properties":{"run_id":{"type":"string","pattern":"^ap-[0-9]{8}-actions(-[0-9]{1,20})?$"},"outcome":{"type":"string","enum":["shipped","no_artifact","failed"]},"lane":{"type":"string","pattern":"^[A-F]$"},"action":{"type":"string","pattern":"^[a-z0-9][a-z0-9_-]{0,63}$"},"artifact":{"type":"string","maxLength":300},"failure_reason":{"type":"string","maxLength":500},"failure_class":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,47}$"},"repair_of":{"type":"array","minItems":1,"maxItems":20,"items":{"type":"string"}}}}}}}}'
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,WebFetch,WebSearch,TodoWrite,NotebookEdit"
          prompt: |
            simplememofast.com のObsidian情報ハブを育てる毎日の定期実行（GitHub Actions版）です。リポジトリはチェックアウト済み・カレントディレクトリがリポジトリルートです。次を厳守して1イテレーションだけ実行してください。
            【この経路の制約 — Runbook より優先】このセッションには書き込みの資格情報が無い（GitHub のトークンは読み取り専用）。**`git push`・`gh pr create`・PR やIssueへの書き込みはしない。**作業はローカルのコミットで終え、手順5の依頼を StructuredOutput で渡す。push・PR作成・運転台帳への PR 番号の記帳・公開運転表と生成物の再生成は、モデルを含まない publish ジョブが検証してから行う。Runbook の push / PR 作成の指示は、この経路ではこの読み替えに従う。
            【この環境の実行のしかた — Runbook より優先】(a) このセッションは1回のターンで、**ターンを終えるとセッションも終わる。**背景タスクの完了通知は届かず、待っても再開されない。「通知を待つ」ためにターンを終えないこと。(b) 背景実行は無効（Bash の `run_in_background` は使えない）。`&`・`nohup`・`setsid` でも処理を残さない。長いコマンドは前景で、Bash の `timeout`（ミリ秒）を明示する。既定は10分、上限は40分で、超えると打ち切られる（exit 143）。(c) 最後の行為は StructuredOutput の呼び出し1回（手順5・8）。**呼ぶとセッションは終わる**ので、コミット・検証・status/LOG を済ませてから呼ぶ。呼ばずにターンを終えると、呼ぶよう求められる。

            0. 【冪等性・最初に必ず】FORCE_RUN=${{ inputs.force == true }} 。FORCE_RUN が true なら本チェックは省略して必ず実行する（手動の検証実行。当日分のstatus JSONは上書きしてよい）。false の場合: `git ls-remote origin refs/heads/claude/obsidian-auto-$(TZ=Asia/Tokyo date +%Y%m%d)` が存在する、または https://simplememofast.com/data/autopilot-status.json の date_jst が当日（JST）なら、本日分は別経路で実行済み。StructuredOutput を `{"request":{"action":"none"},"exit_code":"skipped_already_done"}` で呼んで終了すること。
            0-1. 【死んだ占有の引き継ぎ】GATE_TAKEOVER=${{ steps.gate.outputs.takeover == 'true' }} 。true のときだけ、上の「ブランチが存在する＝実行済み」を**この日は適用しない**。当日ブランチは claim だけ取られて90分以上動いていない（宣言ファイル以外の差分0・PR0）とGateが実測している。Runbook §0-2 の「死んだ占有の引き継ぎ」の手順に従い、**既存のブランチの上に**ローカルで作業を積むこと（`git fetch origin <当日ブランチ> && git checkout -B <当日ブランチ> origin/<当日ブランチ>`）。push はしない（publish ジョブが fast-forward でだけ push し、他経路が先に進めていれば何も push しない）。ブランチを消さない。 GATE_STALE_DECLARATIONS=${{ steps.gate.outputs.stale_declarations }} 。空でなければ、その占有には**死んだ run の価値契約の宣言**が残っている。**その契約は実装しない。**Runbook §0-2 の手順で `node scripts/value-contracts.mjs --retire <宣言ファイル> --reason "declaring run <run_id> failed (<failure_class>); takeover re-declares under a new id"` を実行して data/decision-rejections/ へ移し、コミットしてから 3-1 を新しい候補で最初からやり直す。契約と記帳の run_id は `ap-<YYYYMMDD>-actions-$GITHUB_RUN_ID`（Bash で読める）。
            0-2. 【所有者承認の試運転】TRIAL_RUN=${{ steps.contain.outputs.recovery || 'none' }} 。actions_once なら、今日はオーナーが日付を入れた1回限りの試運転の回で、封じ込めはワークフローが判定済み（docs/obsidian/ACTIONS_RECOVERY_ONE_USE.md）。**`node scripts/autopilot-selfheal.mjs --contain` を実行しない**（停止を書き込んで自分を止めることになる）。`--contain --dry-run` が「止めるべき」と exit 1 を返しても、この環境には許可の値が渡っていないためで、止まる理由ではない。⛔ の 10-05・10-06・10-22 は直さず repair_of も書かず、通常どおりレーンA〜Eの1アクションを行う。none なら通常の回。
            1. `docs/obsidian/AUTOPILOT_RUNBOOK.md` を読む。以降の判断・実装・出荷はすべてRunbookに従う（このプロンプトより詳しい指示はRunbookが優先）。
            1-1. `AUTOPILOT_DATA_REPORT` のJSONを読む。取得済みの鮮度・実日数・欠損の検査結果が入っている。`ready` なら `GROWTH_GSC_DIR` の検査済みデータを分析に使い、再認証・再取得は不要。`partial` は取得成功だが28日未満、`unavailable` は取得失敗であり0件ではない。Runbook §1-2に従い今回の実測をstatusへ記録する。一時データを公開リポジトリにコピーしない。
            2. `tail -n 200 docs/obsidian/AUTOPILOT_LOG.md` で前回までの記録を確認する。**全文は読まないこと**（77,000文字あり毎日+5,000増える。入力はターンごとに付いて回るので、ここが1回あたり実費の最大要因）。**保留事項は LOG からではなく `data/autopilot-actions-report.json` を見る**（型付きで、閉じ条件が通れば消える。散文の履歴から拾うと解消済みが混ざる）。**台帳そのもの `data/autopilot-actions.json` は読まないこと** — 閉じた行が消えずに貯まるので、LOG と同じく増え続ける（レポート側は open と当日クローズだけなので未処理の件数でしか増えない）。レポートの `as_of_jst` が当日でない場合だけ、09:00 JST のアクチュエータがまだ走っていないということなので台帳側を見てよい。Runbook §0の「読むもの」も、全文を読むものと一部だけ読むものを分けてある——そちらの指定に従うこと。
            2-1. 【レーンF・A〜Eより先】`node scripts/autopilot-selfheal.mjs` を実行する。未修理の故障が出たら、**その日の最優先アクションは基盤の修理**で、記事は書かない。触ってよいファイルとやってはいけない変更はスクリプトが出力する（検証を弱めない・自分の権限を広げない。これはCIが実際に検出する）。直したら手順5の依頼（StructuredOutput の `request`）の `run` に `"repair_of":["<直した run_id>"]` を入れること（`data/autopilot-runs.json` は直接書かない。publish ジョブが main の台帳に実在する run_id かを確かめ、記帳する自分の行に書く。スクリプトと Runbook の「自分の行に `repair_of` を書く」は、この経路ではこの読み替えに従う）——書かない限り翌日も未修理として上がってくる。⛔ が出ている対象は直さず `owner_requests` に上げる。**監視Issueは `node scripts/health-intake.mjs --dry-run` で読むだけにし、取り込み分の `data/autopilot-actions.json` をこのブランチにコミットしない**（宣言の外のパスになり、PR が decision-ci で必ず落ちる。2026-10-06 の形。取り込みは Autopilot Act が当日中に行う。Runbook §7-1 の依頼を積む日だけは、宣言の touches に入れる）。
            3. 目標は毎日1記事。ただしRunbook §0のゲート（ノイズフロア＝期待クリック3未満を根拠にしない・品質・検証・実験非干渉）が常に優先。ゲートを通る施策が無い日は堂々とスキップし、保守レーン（Runbook §6）に切り替える。基準を下げて書くことは失敗と定義されている。
            3-1. 【着手前の価値契約】`node scripts/value-contracts.mjs --readiness` と `--feedback` を読む。承認済み指標がある場合は、Runbook §2-1 に従い候補2件以上を `/tmp/decision-candidates.json` に書く。各候補に `calibration: {snapshot_sha256, reason}` を付け、返された参照hashと、過去の予測・実測が今回の確率と順位にどう関わるかを記す。決済0件なら根拠と不確実性を記し、較正済みとは書かない。`node scripts/value-contracts.mjs --select /tmp/decision-candidates.json` が選んだ契約を、実装より先に別コミットにする（push はしない。コミットの順序と日時は publish ジョブの push でそのまま残る）。選択された候補だけを実装する。契約の指標・確率・基準値・対象パスを実装後に変えない。公開ページを編集・追加する候補の `touches` には、そのページと `data/i18n/pages.json` にあるその生成ロケールのページを入れ、訳の単位を足すなら `data/i18n/translations/<locale>.json`、ページを追加するなら `data/i18n/pages.json` と4つの sitemap（`sitemap.xml`・`sitemap-ja.xml`・`sitemap-en.xml`・`sitemap-locales.xml`）も入れる。`max_changed_lines` はそれら全部で見積もる（上限1500。収まる編集を選ぶ）。いまの適格性の範囲（`data/eligibility-policy.json` の boundedness）はカタログと `data/i18n/pages.json` を含まないので、それらを触る候補は `--select` で不適格になる。その日は訳の単位が増えない編集（数値・日付の更新など）を選ぶか、出荷しない。候補が通らない日は不適格理由だけ記録し、出荷を捏造しない。承認済み指標が0件の間は既存運転を維持し、承認欄を代筆しない。
            4. ブランチは claude/obsidian-auto-$(TZ=Asia/Tokyo date +%Y%m%d)。Runbook §3の実装規約・§4の検証（seo-check等9チェック。ブラウザが要る工程は先に `npx playwright install --with-deps chromium` を実行し、OG生成スクリプトは PLAYWRIGHT のデフォルトパスで動く）を全て通してから commit する（push はしない）。**apt を伴うコマンド（`--with-deps` を含む）が数分たっても出力を返さない場合は深追いしないこと。** `--with-deps` を外して再試行し、それでも駄目ならブラウザが要るQAだけを省略して、その旨を status JSON の `checks` に明記したうえで記事の出荷を優先する。2026-08-20に、この種の apt の停止がジョブ上限90分を食い尽くして1日分の出荷をゼロにした前例がある（run 32303452390）。**セットアップのために出荷を落とさない。****長い検証の時間（CI 実測）と指定する `timeout`:** `python3 scripts/build_site_translations.py --check`・`--write` は約5分 → `timeout` 900000。`npx playwright install --with-deps chromium` と apt は `timeout` 300000（打ち切られたら上のとおり深追いしない）。`node scripts/check-viewport-overflow.mjs --check --no-sweep`（深い3面×14幅＋WebKit 全面320px、約10分）→ `timeout` 1500000。これをこの経路の横漏れの落とす側とする。`--no-sweep` なしの全面の掃き（Blink 全面×4幅を足すと CI 実測29分）は**このセッションでは走らせない**（PR の SEO Validation が `--report` で全面を測る）。どのコマンドも1回ずつ・前景で走らせ、終わるのを待ってから次へ進む。 **公開ページを編集・追加した回は、commit の前に訳を揃える**（公開ページはすべて `data/i18n/pages.json` に登録され、訳の欠けたページは SEO Validation で落ちる。publish ジョブは訳を作らない。記帳で台帳・status JSON・公開運転表とその生成訳・sitemap 以外が変われば記帳ごと失敗する）。`docs/site-localization.md` に従い、`python3 scripts/build_site_translations.py --extract <作業用JSON>` → 必要な単位を訳してカタログへ取り込む（`python3 scripts/import_site_translations.py` は渡した下書きだけから全カタログを作り直すので、既存の項目も含めて渡すか、カタログの JSON に項目を足す）→ `--write` → `--check`。訳を揃えられない日は shipped の依頼を出さない。
            4-1. 【PRの依頼を書く前と、作業をやめる前に必ず】`node scripts/decision-ci.mjs --verify-local` を実行する。宣言の外のパス（未コミット・未追跡を含む）を挙げる。落ちたら PR を作る前に直す（直し方は出力と Runbook §2-1 手順6-1。宣言し直すときは、先に宣言後の実装コミットを全部 `git revert` して正味ゼロに戻す）。直せない日は宣言を取り下げ、status/LOG だけの PR にする。
            5. 【PRの依頼 — StructuredOutput の request】PR は作らない。**手順6の status JSON・LOG を含む最後のコミットと手順4-1の `--verify-local` を済ませたら、最後の行為として** StructuredOutput を1回だけ呼び、`request` に次の形の依頼を入れる: `{"action":"pr","title":"<1行・200字以内>","body":"<本文。型はマージ済みPR #470を踏襲>","run":{"run_id":"ap-<YYYYMMDD>-actions-<GITHUB_RUN_ID>","outcome":"shipped|no_artifact|failed","lane":"<A〜F>","action":"<アクション名>","artifact":"<成果物>","failure_reason":"<shipped 以外のとき必須>","failure_class":"<shipped 以外のとき必須。種別を英小文字・数字・_・- で（例: no_artifact）>"}}`（outcome が shipped 以外で failure_reason か failure_class が無い依頼は、publish ジョブが何も push せずに拒否する。レーンFで直した日だけ `run` に `"repair_of":["<直した run_id>"]` を足す。手順2-1）。価値契約がある回は宣言した `run_id`・`lane`・`action` を使う。PR を出さない日は `{"action":"none"}`。作業が途中で、PR にしてはいけない日は `{"action":"push_only"}`（ブランチだけ残り、PR は作られない）。ワークフローがこの `request` を `$RUNNER_TEMP/autopilot-pr-request.json` に写し、publish ジョブが、検証→当日ブランチへの push→PR 作成→Runbook §5-4 の運転台帳へ PR 番号を記帳→status JSON の `runs` を台帳から数え直し（`autopilot-runs.mjs --write-status`）→`decision-monitor.mjs --publish-report`・`build_site_translations.py --write`・`generate_sitemap.py` の再生成と push を行う。**このセッションでは `gh pr create`・`autopilot-runs.mjs --append`・`decision-monitor.mjs --publish-report`・`generate_sitemap.py` を実行しない**（PR番号の無い行や二重の生成物が残る）。`build_site_translations.py` は手順4の訳のためだけに使う。**LOG や status に「依頼を書く」と記しても依頼にはならない**（2026-10-22・10-24 の試運転はどちらも依頼が無いまま終わり、何も公開されなかった）。依頼のファイルを自分で書く必要はない（書いても StructuredOutput の内容が優先される）。マージは auto-merge が行い、結果は翌朝の日報メールが拾う。CCR用ツール subscribe_pr_activity / send_later はこの環境には無いので使わない。
            6. 【毎回必須】`data/autopilot-status.json` をRunbook §5-2のスキーマで当日の内容に上書きし、`AUTOPILOT_LOG.md` の追記と合わせてコミットに含める（記事なしの日はこの2ファイルだけのコミットで、手順5の依頼は outcome を no_artifact 等にした PR 依頼）。これが10:00 JSTの日報メールのデータ源。
            7. できないこと（iOS Simulator実行・オーナー作業）は偽装せず、Runbook §7に従って owner_requests として積む。
            8. 【終了コード — StructuredOutput の exit_code】同じ StructuredOutput の `exit_code` に次のどれか1つを入れる: shipped_pr（記事・修理のPRを依頼した）/ no_ship_pr（status/LOG だけのPRを依頼した）/ skipped_already_done（手順0で終了）/ blocked_unverifiable（固有価値を実確認できなかった）/ blocked_scope（宣言の範囲では実装できなかった）/ blocked_local_check（5-1 が落ちて直せなかった）/ abandoned_after_declaration（宣言後にそれ以外の理由でやめた）/ tool_denied（必要な操作が権限で拒否された）/ other。**文章は書かない**（公開される診断に残るのは code だけ）。PR を作れなかった日ほど必要。StructuredOutput は `{"request":{...手順5...},"exit_code":"<CODE>"}` の形で1回だけ呼び、呼んだらそれで終わる。

      # 【2026-10-22 引き渡しファイルの確認と、同じセッションの再開（1回）】
      #
      # 試運転 run 39701630744 は 47分・236ターン・$15.41 で宣言どおりの3コミットを作ったが、
      # 依頼（手順5）も終了コード（手順8）も書かずに終わり、publish は rejected_request_missing で
      # 何も push しなかった（LOG には「依頼を書いて終える」と書いてあった）。publish の判定は1つの
      # ファイルの有無に懸かっているので、無いときだけ同じセッションを1回だけ再開して書かせる。
      #
      # 判定は $GITHUB_SHA の写しの scripts/autopilot-publish.mjs --inspect-handoff が行う（publish と
      # 同じ有界読み取り。symlink・巨大・JSON でないものは「無い」側）。session_id は厳密な UUID の形の
      # ときだけ、予算は「この run の上限（--runtime-budget）− 主セッションの実費」と $3 の小さい方で、
      # $0.50 未満なら再開しない。主の段が success のときだけ（failure の回は publish が依頼を読まない
      # push_only になり、上限で止まった回にさらに使わない）。
      # 再開しない回はほかに2つ。手順0で終える日（終了コード skipped_already_done だけがあり、依頼は要らない）と、
      # 再開（8分）と後の段（梱包・upload）がジョブ上限（90分）に収まらない回（Gate の段で記録した時刻から測る。
      # 収まらない再開はジョブごと切られ、書いてあった依頼の引き渡しまで失う）。
      #
      # 再開の段は主の段と同じ固定版・同じモデル・同じ読み取り専用の job token で、道具は Bash・Read・
      # Write だけ（WebFetch/WebSearch を外し、新しい外部の文章を入れない）。プロンプトは固定文で、
      # モデルが書いた値を埋め込まない（埋めるのは検証済みの session_id と予算だけ）。それでも無ければ
      # 何も変えない: publish は従来どおり rejected_request_missing で何も push しない。
      # 段名は Act が読む語（Claude Code・Gate など）と重ねない（scripts/autopilot-publish.mjs --check）。
      - name: Check the handoff files after the model
        id: handoff_files
        if: >-
          !cancelled() &&
          (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        continue-on-error: true
        env:
          MODEL_OUTCOME: ${{ steps.claude.outcome }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          RUNTIME_BUDGET_USD: ${{ steps.route.outputs.runtime_budget_usd }}
          JOB_STARTED_EPOCH: ${{ steps.gate.outputs.job_started_epoch }}
        run: |
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false worktree add --detach "$RUNNER_TEMP/handoff-tools" "$GITHUB_SHA"
          node "$RUNNER_TEMP/handoff-tools/scripts/autopilot-publish.mjs" --inspect-handoff

      - name: Resume the session once for the missing handoff files
        id: resume
        if: >-
          !cancelled() && steps.claude.outcome == 'success'
          && steps.handoff_files.outputs.resume == 'true'
        # 結果は要約（summary.json）に残す。この段の失敗でジョブの判定を変えない。
        continue-on-error: true
        timeout-minutes: 8
        # 主の段（id: claude）と同じ SHA。版を上げるときは両方を一緒に直す。
        uses: anthropics/claude-code-action@16b3b310c3d7b5279df73130324d5205aeea8eac # v1 (Claude Code 2.1.245 / Agent SDK 0.3.245)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "*"
          claude_args: |
            --resume ${{ steps.handoff_files.outputs.session_id }}
            --max-turns 12
            --max-budget-usd ${{ steps.handoff_files.outputs.resume_budget_usd }}
            --model ${{ steps.route.outputs.model }}
            --settings '{"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1","BASH_DEFAULT_TIMEOUT_MS":"600000","BASH_MAX_TIMEOUT_MS":"2400000"}}'
            --allowedTools "Bash,Read,Write"
          prompt: |
            このセッションは終わったが、引き渡しの2つのファイル（`$RUNNER_TEMP/autopilot-pr-request.json` と `$RUNNER_TEMP/autopilot-exit.json`）の少なくとも一方が無いか、JSON として読めなかった。依頼ファイルが無いと publish ジョブは何も push せず、今日の作業は公開されない。次の3つだけを行って終了すること。
            1. 無いか読めない方だけを書く。依頼は最初のプロンプトの手順5の `request` と同じ形で、Bash で `$RUNNER_TEMP/autopilot-pr-request.json` に書く。終了コードは手順8の `exit_code` と同じ語を `{"code":"<CODE>"}` の形で `$RUNNER_TEMP/autopilot-exit.json` に書く。内容は、このセッションですでにコミットした作業と、すでに書いた status JSON・LOG に合わせる（run_id・lane・action は宣言・記録したものと同じにする）。作業が途中なら依頼は `{"action":"push_only"}` にする。すでにあって JSON として読める方は変えない。
            2. 書いたら `node -e 'for (const f of ["autopilot-pr-request.json","autopilot-exit.json"]) JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/" + f, "utf8"))'` で2つとも読み戻す。失敗したら直して読み戻し直す。
            3. ほかには何もしない。コミット・ブランチの操作・push・PR の作成・リポジトリのファイルの編集はしない。Bash で行うのは、この2つのファイルの書き込みと読み戻し、内容を決めるための読み取り（git log・git show・cat など）だけ。

      # 【2026-08-26】即死したときに、資格情報かどうかを**機械が**切り分ける。
      #
      # 08-24〜08-25 の2日連続の即時失敗は、検知そのものは初日に効いていた。
      # 溶けたのは診断のほうで、台帳は「認証系」→「上流の版」→「やはり認証系」と
      # 2回ひっくり返り、そのたびに1日を使った。**同じ形の失敗が来たら、
      # 人にもセッションにも推測させずここで割る。**
      #
      # 理屈は単純で、失敗した回と同じトークンで1ターンだけ走らせるだけ:
      #
      #   401で落ちる → 認証が拒否された
      #   それ以外の失敗 → 判定不能（通信やサービスも同時に変わりうる）
      #   ここは通る   → 資格情報ではない（--model指定・MCP・プロンプト等の側）
      #
      # 上のステップと違って --model も MCP も渡さないので、切り分けたい変数
      # （トークンが通るか）だけが残る。2026-08-26 に手で1回やったのがこれで、
      # 実費は $0.04・所要3秒だった。**失敗した回にしか走らない。**
      #
      # `continue-on-error` は使わない。あれはステップの conclusion を success に
      # 書き換えるので、**失敗が成功に見える**（この装置を手で組んだとき実際に
      # 読み違えた）。ここでは終了コードそのものを判定に使い、
      # scripts/autopilot-act.mjs の interpretRun が conclusion を読む。
      #
      # CLI が入る前に落ちた回（08-21 の actor 拒否のような形）では下の
      # `command -v claude` が失敗し、判定ステップは skipped になる。
      # **判定不能は「資格情報は無事」ではない**ので、そこは従来どおり
      # needs_triage としてセッションへ回る。
      - name: SDKの停止理由を確認
        id: model_limit
        if: always() && steps.claude.outcome == 'failure'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          MAX_BUDGET_USD: ${{ steps.route.outputs.runtime_budget_usd }}
        run: |
          f="${EXEC_FILE:-}"
          [ -n "$f" ] && [ -f "$f" ] || f="${RUNNER_TEMP}/claude-execution-output.json"
          verdict="$(node "$RUNNER_TEMP/output-tools/scripts/check-credential-probe.mjs" --classify-limit "$f" --max-budget-usd "$MAX_BUDGET_USD" --max-turns 250)"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: 実行中の支出閾値で停止
        if: always() && steps.model_limit.outputs.verdict == 'budget'
        run: |
          echo '::error title=Obsidian Autopilot::SDKの支出閾値に到達したため次の呼出を停止した。実費と未完の作業を確認する。'
          exit 1

      - name: ターン上限で停止
        if: always() && steps.model_limit.outputs.verdict == 'turns'
        run: |
          echo '::error title=Obsidian Autopilot::SDKのターン上限に到達した。未完の作業と繰り返しの原因を確認する。'
          exit 1

      - name: 切り分け用のCLIを確認
        id: credprobe_ready
        if: always() && steps.claude.outcome == 'failure' && steps.model_limit.outputs.verdict != 'budget' && steps.model_limit.outputs.verdict != 'turns'
        run: command -v claude

      - name: 即死が資格情報かを切り分ける
        id: credprobe
        if: always() && steps.credprobe_ready.outcome == 'success'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          out="$(claude -p 'Reply with exactly the word PROBE_OK and nothing else.' \
                   --max-turns 1 --output-format json 2>&1)"
          code=$?
          set -e
          # 503・通信失敗・壊れたJSONは、資格情報の失効を証明しない。
          # SDKの構造化応答だけで判定し、生の応答はログへ出さない。
          verdict="$(printf '%s' "$out" | node -e '
            let d;
            try { d = JSON.parse(require("node:fs").readFileSync(0, "utf8")); }
            catch { process.stdout.write("unknown"); process.exit(0); }
            const exitCode = Number(process.argv[1]);
            let verdict = "unknown";
            if (d?.type === "result" && exitCode === 0 && d.is_error === false) verdict = "ok";
            else if (d?.type === "result" && d.is_error === true && d.api_error_status === 401) verdict = "credential";
            else if (d?.type === "result" && d.is_error === true && d.api_error_status === 429
              && /hit.*(?:limit|quota)|(?:weekly|session|five.hour|seven.day).*(?:limit|quota)/i.test(d.result ?? "")) verdict = "usage_limit";
            process.stdout.write(verdict);
          ' "$code")"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          case "$verdict" in
            ok)
              echo "::notice title=Obsidian Autopilot::単独実行が正常終了した。資格情報は通っているため、モデル指定・MCP・プロンプト・上流の版を確認する。"
              exit 0 ;;
            usage_limit)
              echo "limit_message=利用枠の上限を示す応答（HTTP 429）" >> "$GITHUB_OUTPUT"
              echo "::warning title=Obsidian Autopilot::利用枠の上限で止まっている。解除予定はプロバイダーの利用状況で確認する。"
              exit 0 ;;
            credential)
              echo "::error title=Obsidian Autopilot::単独実行で認証が拒否された（HTTP 401）。既存の資格情報の状態を確認する必要がある。"
              exit 1 ;;
            *)
              echo "::warning title=Obsidian Autopilot::単独実行から資格情報の可否を判定できない。通信・サービス・CLIを含めて原因を確認する。"
              exit 0 ;;
          esac

      - name: 資格情報の診断は判定不能
        if: always() && steps.credprobe_ready.outcome == 'success' && (steps.credprobe.outputs.verdict == 'unknown' || (steps.credprobe.outcome == 'failure' && steps.credprobe.outputs.verdict != 'credential'))
        run: |
          echo "::error title=Obsidian Autopilot::診断は判定不能。資格情報が無事とも失効したとも断定しない。"
          exit 1

      # 上のステップは「資格情報かどうか」しか答えない係なので、使用量上限のときは
      # exit 0 で抜ける（鍵は無事なので、資格情報の判定としては正しい）。
      # だが**ジョブは赤でなければならない** —— 1日ぶんの出荷が消えている。
      # ここを別ステップに分けてあるのは、`scripts/autopilot-act.mjs` の
      # interpretRun が読めるのが**ステップ名と conclusion だけ**だから。
      # ログ本文は読めないので、判定結果はステップの形で残す必要がある。
      #
      # メッセージは env 経由で渡す。**${{ }} を run: に直接埋めない** ——
      # 中身は API の応答文字列なので、シェルへ展開させる形にはしない。
      - name: 使用量上限で止まっている
        if: always() && steps.credprobe.outputs.verdict == 'usage_limit'
        env:
          LIMIT_MESSAGE: ${{ steps.credprobe.outputs.limit_message }}
        run: |
          echo "::error title=Obsidian Autopilot::**使用量上限で1日ぶんの出荷が消えた。**${LIMIT_MESSAGE}。資格情報は無事なので入れ替えないこと。"
          exit 1

      # 「成果物の実行IDを照合」と「成果物判定」は publish ジョブへ移した（PR はそこで
      # 作られるため）。実費の抽出は `if: always()` のまま、失敗した回にも走る。

      # 【モデル後の照合】モデルが手順 4-1（--verify-local）を飛ばしても、宣言と残った作業
      # （コミット済み・未コミット・未追跡）をここで照らす。2026-10-06 は success・PR なしで
      # 終わり、何を変えたのか誰にも言えなかった。**判定には使わない（記録だけ）。**
      # 道具は $GITHUB_SHA の写しから動かす（モデルの作業ツリーのスクリプトを実行しない）。
      # 外へ出すのは理由のコード・件数・main に既にあるパスだけ（scripts/autopilot-audit.mjs）。
      # チェックポイントが作業ツリーへ fetch する前に読む。stderr は捨てる（git の警告が新しい
      # ファイル名を出すことがあり、ジョブログは公開）。結果は段名・成果物・GITHUB_OUTPUT に残る。
      - name: Audit the declaration against the work after the model
        id: audit
        if: >-
          !cancelled() &&
          (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        continue-on-error: true
        env:
          TODAY_DASH: ${{ steps.gate.outputs.today_dash }}
        run: |
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false worktree add --detach "$RUNNER_TEMP/audit-tools" "$GITHUB_SHA"
          node "$RUNNER_TEMP/audit-tools/scripts/autopilot-audit.mjs" --save "$RUNNER_TEMP/autopilot-audit" --workspace "$GITHUB_WORKSPACE" 2>/dev/null

      # 照合の結果を Actions API の段名から読めるようにする（判定コードの段と同じ理由）。
      - name: "モデル後の照合: ${{ steps.audit.outputs.verdict || 'unavailable' }}"
        if: always() && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        run: 'true'

      - name: Upload the post-model audit
        if: always() && steps.audit.outputs.saved == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autopilot-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autopilot-audit
          retention-days: 7
          if-no-files-found: error

      # 【実費の記録】claude-code-action の実行ログから total_cost_usd を取り出し、
      # runのサマリと通知に出す。
      #
      # 台帳（data/autopilot-cost.json）への追記をここでやらない理由: この時点で
      # ワークスペースはセッションが作った当日ブランチの上にあり、ここから
      # commit/push するとセッションのPRと競合しうる。実費1行のために出荷を
      # 壊すのは本末転倒なので、**追記は翌日のセッションが status JSON と同じPRで行う**
      # （Runbook §5-3）。セッションは `get_job_logs` で前回runのこの値を読める
      # ——2026-08-22のセッションが実際にそうやって 0.8149 を読んでいる。
      # `--append` は run_id で冪等なので、遅れて追記しても二重計上にならない。
      #
      # `if: always()` なのは、失敗した回にも実費が発生しているため。成功した回だけ
      # 記録すると、上限判定が実態より甘くなる。
      #
      # 実行ログが見つからない場合は「0」ではなく「取得できなかった」と書く。
      # 0を書くと「無料で動いた」になり、Runbookが繰り返し戒めている
      # 「取得できなかった」と「増えていない」の取り違えと同じ誤りになる。
      #
      # 【2026-10-22 再開した回は2つの合計】再開の段の実行ログは主の段と同じパスを上書きする。
      # 主セッション分は、再開の前に取った写し（ハッシュは再開の前の段の出力）から読んで足す。
      # 写しがハッシュと合わない・再開の実行ログが無い回は、合計を「取得できなかった」と書く。
      # Act（scripts/autopilot-act.mjs の fetchRunCost）は、2つのモデルの段の中で出た result 行（段ごとに1つまで）を足す。
      # 再開の段が result 行を出さずに終わった回は、主セッション分だけを「再開分を含まない」と注記して記帳する。
      - name: 実費の抽出（台帳への追記は翌日のセッションが行う）
        if: always() && steps.claude.conclusion != 'skipped'
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          TASK_KIND: ${{ steps.route.outputs.kind }}
          RESUME_OUTCOME: ${{ steps.resume.outcome }}
          MAIN_EXECUTION_SHA256: ${{ steps.handoff_files.outputs.main_execution_sha256 }}
        run: |
          f="${EXEC_FILE:-}"
          [ -n "$f" ] && [ -f "$f" ] || f="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$f" ]; then
            echo "::warning title=Autopilot cost::実行ログが見つからず実費を取得できなかった（0ではない）。path=$f"
            echo "* AI実費: **取得できなかった**（0ではない）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -- "$f"
          case "${RESUME_OUTCOME:-}" in
            success|failure|cancelled) set -- "${RUNNER_TEMP}/autopilot-execution-main.json" "$f" ;;
          esac
          python3 - "$@" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import hashlib, json, os, sys
          def part(path, expect=None, differ=None):
              # One execution file: (cost, turns, denials), or why it cannot be counted.
              try:
                  raw = open(path, 'rb').read()
                  digest = hashlib.sha256(raw).hexdigest()
                  if expect is not None and digest != expect:
                      return '主セッション分の写しが再開前のハッシュと一致しない'
                  if differ is not None and digest == differ:
                      return '再開の実行ログが無い'
                  d = json.loads(raw.decode('utf-8'))
              except Exception as e:
                  return f'実行ログのJSONを読めない: {e}'
              if isinstance(d, list):
                  d = next((x for x in reversed(d) if isinstance(x, dict) and 'total_cost_usd' in x), {})
              if not isinstance(d, dict):
                  d = {}
              cost = d.get('total_cost_usd')
              if type(cost) not in (int, float):
                  return 'total_cost_usd がログに無い'
              raw_denials = d.get('permission_denials')
              denials = len(raw_denials) if isinstance(raw_denials, list) else d.get('permission_denials_count')
              if type(denials) is not int or denials < 0:
                  denials = None  # unknown is not zero
              return (cost, d.get('num_turns'), denials)
          main_sha = os.environ.get('MAIN_EXECUTION_SHA256') or ''
          if len(sys.argv) > 2:
              parts = [part(sys.argv[1], expect=main_sha), part(sys.argv[2], differ=main_sha)]
          else:
              parts = [part(sys.argv[1])]
          for label, p in zip(['主セッション分: ', '再開分: '] if len(parts) > 1 else [''], parts):
              if isinstance(p, str):
                  print(f"* AI実費: 取得できなかった（{label}{p}）")
                  sys.exit(0)
          cost = sum(p[0] for p in parts)
          turns, denials = parts[0][1], parts[0][2]
          if len(parts) > 1:
              turns = sum(p[1] for p in parts) if all(type(p[1]) is int for p in parts) else None
              denials = sum(p[2] for p in parts) if all(type(p[2]) is int for p in parts) else None
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          print(f"* AI実費: **${cost:.4f}** / turns {turns} / permission_denials {denials}")
          if len(parts) > 1:
              print(f"* 内訳: 主セッション ${parts[0][0]:.4f} / 引き渡しファイルのための再開 ${parts[1][0]:.4f}")
          print("")
          # 【1回あたりの上限・その場での検知】台帳への追記は翌日のセッションが
          # 行うので、そこに頼ると**追記する主体が落ちた日は超過も一緒に消える。**
          # 実際に08-23の$7.2967は、翌日の主系が即時失敗したため丸ごと抜けた。
          # 金額が手元にあるのはこのステップなので、判定もここで一度出す。
          kind = os.environ.get('TASK_KIND') or ''
          try:
              rules = json.load(open('data/model-routing.json', encoding='utf-8'))['rules']
              cap = rules.get(kind, {}).get('max_usd_per_run')
          except Exception:
              cap = None
          if cap and cost > cap:
              print(f"* ⛔ **1回あたりの上限を超過**: {kind} は上限 ${cap:.4f} に対し ${cost:.4f}"
                    f"（{cost / cap:.1f}倍）。**次回の主系はこの超過がレビューされるまで走らない。**")
              print(f"::error file=data/model-routing.json::1回上限の超過: {kind} ${cost:.4f} / 上限 ${cap:.4f}")
          elif cap:
              print(f"* 1回あたりの上限: ${cost:.4f} / ${cap:.4f} — 枠内")
          print("")
          print("翌日のセッションはこの1行を台帳へ入れること（Runbook §5-3）:")
          print("```")
          print(f"node scripts/autopilot-budget.mjs --append --date <当日JST> --route actions \\")
          print(f"  --run-id {run_id} --cost {cost} --turns {turns} --outcome <shipped|no_artifact|failed>")
          print("```")
          PY

      # 成果物の照合は publish ジョブで後から行うため、モデルが走った回は毎回とっておく
      # （コミット済みの作業は引き渡しに入る。ここに残るのは未コミットの宣言済みページ作業）。
      - name: Preserve declared page work after model or output failure
        id: checkpoint
        if: >-
          !cancelled() &&
          (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        continue-on-error: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/checkpoint-tools" "$GITHUB_SHA"
          node "$RUNNER_TEMP/checkpoint-tools/scripts/autopilot-checkpoint.mjs" --save "$RUNNER_TEMP/autopilot-checkpoint" --workspace "$GITHUB_WORKSPACE"

      - name: Upload bounded work checkpoint
        if: always() && steps.checkpoint.outputs.saved == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autopilot-work-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autopilot-checkpoint
          retention-days: 7
          if-no-files-found: error

      # Only typed counts/states/hashes leave the runner; never upload SDK messages.
      # The receipt itself is assembled in the publish job, after the output check.
      # The summary is a file packed into the handoff (summary.json, sha256 in the manifest), not a
      # job output: on 2026-10-22 the runner dropped the JSON job output. It records whether the request
      # and exit files were there after the main step and after the resume, and the resume's outcome.
      - name: Summarize the execution file
        id: exec_summary
        if: >-
          !cancelled() &&
          (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          RESUME_OUTCOME: ${{ steps.resume.outcome }}
          RESUME_DECISION: ${{ steps.handoff_files.outputs.resume_decision }}
          REQUEST_AFTER_MAIN: ${{ steps.handoff_files.outputs.request_after_main }}
          EXIT_AFTER_MAIN: ${{ steps.handoff_files.outputs.exit_after_main }}
          HANDOFF_SOURCE: ${{ steps.handoff_files.outputs.handoff_source }}
          MAIN_EXECUTION_SHA256: ${{ steps.handoff_files.outputs.main_execution_sha256 }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/diagnostic-tools" "$GITHUB_SHA"
          node "$RUNNER_TEMP/diagnostic-tools/scripts/autopilot-diagnostics.mjs" --summarize

      # 【引き渡し】コミット済みの作業だけを git bundle にし、PR の依頼と終了コード・実行の要約を添える。
      # 道具は $GITHUB_SHA の写しから動かす。このジョブの中身はモデルが触れるので、
      # 梱包の正しさは信用しない — publish ジョブが中身をすべて検証し直す。
      - name: Pack the work for the publish job
        id: pack
        if: >-
          !cancelled() &&
          (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        continue-on-error: true
        env:
          DAY: ${{ steps.gate.outputs.today }}
          TAKEOVER: ${{ steps.gate.outputs.takeover }}
        run: |
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false worktree add --detach "$RUNNER_TEMP/pack-tools" "$GITHUB_SHA"
          node "$RUNNER_TEMP/pack-tools/scripts/autopilot-publish.mjs" --pack --workspace "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/autopilot-handoff" --day "$DAY" --takeover "$TAKEOVER" 2>/dev/null

      - name: Upload the handoff for the publish job
        if: always() && steps.pack.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autopilot-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autopilot-handoff
          retention-days: 1
          if-no-files-found: ignore

  # 【publish】モデルを動かさないジョブ。新しいランナーで $GITHUB_SHA の道具だけを実行し、
  # モデルのジョブから来たもの（bundle・依頼JSON・後段の出力）はすべて信用しない入力として扱う。
  # GH_PAT は push・PR作成・記帳の push の3段にだけ渡す。ログには型付きのコードと件数だけを出す。
  # 段名は Act の interpretRun が読む語（Gate・Claude Code・緊急停止 など）と重ねない
  # （scripts/autopilot-publish.mjs --check が検査する）。
  publish:
    needs: autopilot
    if: >-
      always() && !cancelled()
      && (needs.autopilot.outputs.model_outcome == 'success' || needs.autopilot.outputs.model_outcome == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout the workflow commit for trusted tools
        # このジョブは後の段で GH_PAT を持つので、フルのコミットSHAで固定する（acquisition-daily.yml と同じSHA）。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          # 検証は main の履歴と突き合わせ、記帳後の sitemap の lastmod は git 履歴から引く
          fetch-depth: 0

      - name: Download the handoff
        continue-on-error: true
        # このジョブは後の段で GH_PAT を持つので、upload-artifact と同じくフルのコミットSHAで固定する。
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: autopilot-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handoff

      - name: Verify the handoff
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ needs.autopilot.outputs.today }}
          TAKEOVER: ${{ needs.autopilot.outputs.takeover }}
          FORCE: ${{ inputs.force == true }}
          MODEL_OUTCOME: ${{ needs.autopilot.outputs.model_outcome }}
        run: node "$GITHUB_WORKSPACE/tools/scripts/autopilot-publish.mjs" --verify --handoff "$RUNNER_TEMP/handoff" --repo-dir "$GITHUB_WORKSPACE/tools" --day "$DAY" --takeover "$TAKEOVER" --force-run "$FORCE" --model-outcome "$MODEL_OUTCOME"

      # 判定を Actions API の段名から読めるようにする（判定コードの段と同じ理由）。
      - name: "公開判定: ${{ steps.verify.outputs.verdict || 'unknown' }}"
        if: always()
        run: 'true'

      - name: Push the work branch
        id: push
        if: steps.verify.outputs.verdict == 'publish' || steps.verify.outputs.verdict == 'push_only'
        env:
          PUBLISH_TOKEN: ${{ secrets.GH_PAT }}
          DAY: ${{ needs.autopilot.outputs.today }}
          HEAD_SHA: ${{ steps.verify.outputs.head }}
        run: node "$GITHUB_WORKSPACE/tools/scripts/autopilot-publish.mjs" --push --repo-dir "$GITHUB_WORKSPACE/tools" --day "$DAY" --sha "$HEAD_SHA"

      - name: Open the PR
        id: open_pr
        if: steps.verify.outputs.verdict == 'publish' && steps.push.outcome == 'success'
        env:
          PUBLISH_TOKEN: ${{ secrets.GH_PAT }}
          DAY: ${{ needs.autopilot.outputs.today }}
        run: node "$GITHUB_WORKSPACE/tools/scripts/autopilot-publish.mjs" --open-pr --handoff "$RUNNER_TEMP/handoff" --day "$DAY"

      # 信頼できる道具（$GITHUB_SHA の scripts/）を、push したブランチのデータに対して動かす。
      - name: Record the PR number and regenerate the report
        id: record
        if: steps.open_pr.outcome == 'success'
        env:
          DAY: ${{ needs.autopilot.outputs.today }}
          HEAD_SHA: ${{ steps.verify.outputs.head }}
          PR_NUMBER: ${{ steps.open_pr.outputs.pr }}
        run: node "$GITHUB_WORKSPACE/tools/scripts/autopilot-publish.mjs" --record --handoff "$RUNNER_TEMP/handoff" --repo-dir "$GITHUB_WORKSPACE/tools" --day "$DAY" --pr "$PR_NUMBER" --sha "$HEAD_SHA"

      - name: Push the ledger commit
        id: push_record
        if: steps.record.outcome == 'success' && steps.record.outputs.record_changed != '0'
        env:
          PUBLISH_TOKEN: ${{ secrets.GH_PAT }}
          DAY: ${{ needs.autopilot.outputs.today }}
          RECORD_SHA: ${{ steps.record.outputs.record_sha }}
        run: node "$GITHUB_WORKSPACE/tools/scripts/autopilot-publish.mjs" --push --repo-dir "$GITHUB_WORKSPACE/tools" --day "$DAY" --sha "$RECORD_SHA"

      # A pre-existing declaration branch passed the former existence check on
      # 2026-09-05 even though this model run created no PR. Verify a fresh remote
      # record bound to this run; an open PR remains pending, never production proof.
      # The baseline was captured before the model ran (model job output).
      - name: 成果物の実行IDを照合
        id: output
        if: always() && !cancelled() && needs.autopilot.outputs.model_outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TODAY_DASH: ${{ needs.autopilot.outputs.today_dash }}
          OUTPUT_BASELINE: ${{ needs.autopilot.outputs.baseline }}
          # The PR head is updated asynchronously after the ledger push: wait (bounded) for this commit.
          EXPECTED_HEAD: ${{ steps.push_record.outcome == 'success' && steps.record.outputs.record_sha || '' }}
        run: |
          printf '%s' "$OUTPUT_BASELINE" | base64 -d > "$RUNNER_TEMP/autopilot-output-before.json"
          node "$GITHUB_WORKSPACE/tools/scripts/autopilot-output.mjs" --verify "$RUNNER_TEMP/autopilot-output-before.json"

      - name: "成果物判定: ${{ steps.output.outputs.verdict || 'unknown' }}"
        if: always() && needs.autopilot.outputs.model_outcome == 'success'
        run: 'true'

      # Only typed counts/states/hashes leave the runner; never upload SDK messages.
      # Independent of checkpoint success and the verifier's exit code. Values from
      # the model job (the handoff's summary.json) are re-validated into finite states by the receipt.
      - name: Preserve bounded execution diagnostics
        id: diagnostics
        if: >-
          !cancelled() &&
          (needs.autopilot.outputs.model_outcome == 'success' || needs.autopilot.outputs.model_outcome == 'failure')
        continue-on-error: true
        env:
          TODAY_DASH: ${{ needs.autopilot.outputs.today_dash }}
          MODEL_OUTCOME: ${{ needs.autopilot.outputs.model_outcome }}
          OUTPUT_VERDICT: ${{ steps.output.outputs.verdict }}
          OUTPUT_REASON_CODE: ${{ steps.output.outputs.reason_code }}
          MATCHING_PR_COUNT: ${{ steps.output.outputs.matching_pr_count }}
          CURRENT_RUN_RECORD_COUNT: ${{ steps.output.outputs.current_run_record_count }}
          REMOTE_HEAD_SHA: ${{ steps.output.outputs.remote_head_sha }}
          CHECKPOINT_OUTCOME: ${{ needs.autopilot.outputs.checkpoint_outcome }}
          CHECKPOINT_SAVED: ${{ needs.autopilot.outputs.checkpoint_saved }}
          CHECKPOINT_REASON: ${{ needs.autopilot.outputs.checkpoint_reason }}
          DECLARED_PAGE_CHANGE_COUNT: ${{ needs.autopilot.outputs.declared_page_change_count }}
          AUDIT_VERDICT: ${{ needs.autopilot.outputs.audit_verdict }}
        run: node "$GITHUB_WORKSPACE/tools/scripts/autopilot-diagnostics.mjs" --save "$RUNNER_TEMP/autopilot-diagnostic" --handoff "$RUNNER_TEMP/handoff"

      - name: Upload bounded execution diagnostics
        if: always() && steps.diagnostics.outputs.saved == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autopilot-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autopilot-diagnostic
          retention-days: 7
          if-no-files-found: error

  # A completion event did not start Act after the scheduled 2026-09-05 failure.
  # Keep the independent workflow_run + daily cron, and explicitly wake the observer.
  # This token exists only in this job: no checkout, PAT, model, or Actions write access.
  notify-completion:
    name: Notify Autopilot Act
    needs: [autopilot, publish]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Dispatch the independent observer
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner, repo: context.repo.repo,
              event_type: 'autopilot-completed',
              client_payload: { upstream_run_id: String(context.runId) }
            });
