name: Auto Post TikTok (3x daily)

# 【運用停止 2026-08-11】scheduled 自動投稿はオーナー判断で停止した。
# 理由: 画像系コンテンツの品質が公開基準に達していないため。加えて
#       privacy_level=SELF_ONLY のハードコード問題（依頼書C3）も未解決のまま
#       （これまでの投稿は非公開のまま積まれていた疑いがある）。
# 再開条件: 画像パイプラインの品質を確保し、C3の公開設定（PUBLIC切替 or 継続
#           停止）の判断を済ませてから下の schedule ブロックを戻すこと。
# workflow_dispatch（手動）は残している。
#
# 【C2の原因 — 2026-08-18 実測】再開の前提として書き残す。
# 失敗は投稿内容ではなく**認証**で起きている。最後の scheduled 実行
# （run 31565070619 / 2026-08-12 05:24 UTC）のログは、投稿本文を送る前に
#   HTTP 302 / <center>cloudflare</center>
# を受けて `管理 API が HTTP 302 を返しました` で落ちている＝Cloudflare Access の
# ログイン画面へリダイレクトされている。
#
# 理由: `/admin/*` は 2026-05-08 の #207/#209 で **Cloudflare Access (Zero Trust)**
# の背後に移り、`functions/admin/_middleware.js` は `Cf-Access-Jwt-Assertion` か
# `Cf-Access-Authenticated-User-Email` が無い要求を通さない。一方このワークフローは
# 今も `curl -u "$ADMIN_BASIC_AUTH"` の Basic 認証しか送っていない。Access は
# Basic 認証を知らないので、認証前の 302 で終わる。
#
# したがって再開時に要るのは投稿ロジックの修理ではなく、次のどちらか:
#   (a) Zero Trust で **サービストークン**を作り、Access アプリのポリシーに許可を足し、
#       ここから `CF-Access-Client-Id` / `CF-Access-Client-Secret` ヘッダを送る
#       （Access がトークンをJWTに交換するので middleware 側は無改修）
#   (b) `/admin/api/*` を Access のバイパスにし、関数側で別の認証を持つ
#
# 未確定が1点: Access は 5月に入ったのに、scheduled が壊れたのは 8/7 以降。
# その間に効いていたバイパス（ダッシュボード側のポリシー）が消えた可能性が高いが、
# リポジトリ側のログからは決められない。Zero Trust の Access → Applications で
# ポリシー履歴を見れば分かる。
#
# 【C3の所在 — 2026-08-18】`privacy_level: "SELF_ONLY"` は3箇所にハードコードされている:
#   tools/post-to-tiktok.js:107 / tools/auto-post.js:387 / functions/admin/api/post-tiktok.js:46
# 設定でも環境変数でもないので、これまでの投稿はすべて非公開で積まれている。
# PUBLIC へ切り替える判断をする場合、TikTok の Content Posting API は未監査アプリからの
# 投稿を非公開に制限する仕様があるため、**先にアプリの監査状態をダッシュボードで確認する**こと
# （ハードコードを外しただけでは公開にならない可能性がある）。
on:
  # schedule:
  #   # JST 10:00, 16:00, 21:00 (UTC 01:00, 07:00, 12:00)
  #   - cron: '0 1 * * *'
  #   - cron: '0 7 * * *'
  #   - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: tools
        run: npm ci

      - name: Restore post history
        uses: actions/cache@v4
        with:
          path: tools/.auto-post-history.json
          key: auto-post-history

      - name: Run auto-post
        working-directory: tools
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          POSTIZ_TIKTOK_ID: ${{ secrets.POSTIZ_TIKTOK_ID }}
        run: node auto-post.js

      - name: Save post history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/.auto-post-history.json
          key: auto-post-history-${{ github.run_id }}
