name: AI Visibility Probe

# Collection moved to the local Codex weekly heartbeat on 2026-09-13.
# Keep this workflow identity for independent health monitoring and cron-health.
# No model login or secret is needed in GitHub Actions.
on:
  schedule:
    - cron: '47 21 * * *' # Daily 06:47 JST; Codex collection is Wednesday 06:47 JST.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-visibility-probe
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Test Codex observation verification
        run: python3 scripts/codex-ai-visibility-probe.test.py
      - name: Require a complete Codex observation within eight days
        run: python3 scripts/codex-ai-visibility-probe.py --health
