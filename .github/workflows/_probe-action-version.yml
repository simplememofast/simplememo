# 【一時的な実験装置】結果が出たら消す。
#
# 2026-08-24〜08-25 に主系を2日止めた即時失敗（is_error / num_turns=1 /
# duration_ms=486 / cost $0）の原因が「上流の版」か「CLAUDE_CODE_OAUTH_TOKEN」
# かを分離する。
#
# ■ 埋まっていないマス
#
#   SHA        CLI      token   結果
#   24dcd50c   2.1.240  旧      成功  (08-23 schedule)
#   c81e3bc6   2.1.241  旧      失敗  (08-24 schedule)
#   c81e3bc6   2.1.241  旧      失敗  (08-25 schedule)
#   16b3b310   2.1.245  新      成功  (08-25 dispatch / 08-26 schedule)
#
# **最後の失敗と最初の成功の間で、版とトークンが同時に動いている。**
# オーナーが復旧runの直前に `claude setup-token` を再実行しているため
# （data/autopilot-runs.json の reclassified_note）。空きマスは1つ:
# **2.1.241 × 新トークン。**
#
# ■ なぜ action ではなく CLI を直接叩くのか
#
# 上流リポジトリを clone して差分を実測した結果、**c81e3bc6 と 16b3b310 の
# `src/` の違いは1文字列しかない**:
#
#     src/entrypoints/run.ts
#     -  const claudeCodeVersion = "2.1.241";
#     +  const claudeCodeVersion = "2.1.245";
#
# 他は package.json / bun.lock / base-action/action.yml の同じ定数だけ。
# **ラッパーのロジックは完全に同一。**したがって「版が原因か」は
# 「Claude Code CLI 2.1.241 が壊れているか」に還元される。
#
# そして action は `push` イベントを受け付けない
# （src/github/context.ts の `Unsupported event type`。対応は
# issues / pull_request / workflow_dispatch / repository_dispatch /
# schedule / workflow_run で、**後半はどれもデフォルトブランチからしか
# 走らない**）。実際、最初にこの装置を action で組んだときは両ジョブとも
# CLI を入れる前に落ち、版について何も言えなかった。
#
# CLI を直接入れれば `push` で回せて、しかも変数は版そのものになる。
# インストール手順は action と同一（base-action/action.yml の
# `curl -fsSL https://claude.ai/install.sh | bash -s -- <version>`）。
#
# ■ 対照を必ず一緒に回す
#
#   2.1.245 通る & 2.1.241 落ちる → 版で確定
#   両方通る                      → 旧トークンが原因だった（**pinでは防げない**）
#   両方落ちる                    → 装置側の誤り。版については何も言えない
#
# ■ 前回の読み違いを装置側で潰してある
#
# 最初の版は `continue-on-error: true` を付けたうえで API の
# step.conclusion を読み、**両方 success と誤読した。**
# continue-on-error はステップの conclusion を success に書き換えるので、
# 失敗が success に見える。ここでは `claude` の**終了コードと
# --output-format json の中身をジョブ要約に自分で書き出す。**
# 判定はそちらを読む。
name: _probe action version

on:
  push:
    branches:
      - claude/simplememo-autopilot-eval-jesi78
    paths:
      - .github/workflows/_probe-action-version.yml

permissions:
  contents: read

concurrency:
  group: probe-action-version
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 対照。いま本番が pin している版。ここが落ちたら装置の誤り。
          - version: "2.1.245"
            role: control
          # 本題。08-24/08-25 に主系を2日止めた版を、新しいトークンで。
          - version: "2.1.241"
            role: suspect
    name: ${{ matrix.role }}-${{ matrix.version }}
    steps:
      - name: Claude Code を入れる（action と同じ手順）
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "${{ matrix.version }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 版を実測する（入った版が指定どおりか確かめる）
        id: ver
        run: |
          actual="$(claude --version 2>&1 || true)"
          echo "actual=$actual" >> "$GITHUB_OUTPUT"
          echo "installed: $actual"

      - name: 1ターンだけ走らせて結果を記録する
        id: probe
        run: |
          set +e
          out="$(claude -p 'Reply with exactly the word PROBE_OK and nothing else.' \
                   --max-turns 1 --output-format json 2>&1)"
          code=$?
          set -e

          # **判定はここに書いたものを読む。**ステップの conclusion は
          # continue-on-error に書き換えられうるので根拠にしない。
          {
            echo "### ${{ matrix.role }} — Claude Code ${{ matrix.version }}"
            echo ""
            echo "- installed: \`${{ steps.ver.outputs.actual }}\`"
            echo "- exit code: \`${code}\`"
            echo ""
            echo '```json'
            echo "$out" | head -c 3000
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "exit=${code}"
          echo "$out" | head -c 3000
          # 失敗そのものが観測結果なので、ここでジョブを落とさない。
          exit 0
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
