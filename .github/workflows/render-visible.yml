name: Visible Content Compatibility (isolated)
on:
  push:
    branches: [claude/pagespeed-render-study-20260917]
    paths:
      - 'scripts/perf/render_visible_compat.cjs'
      - '.github/workflows/render-visible.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p "$RUNNER_TEMP/visible-compatibility"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/perf-tools" --no-save playwright@1.55.0
          "$RUNNER_TEMP/perf-tools/node_modules/.bin/playwright" install --with-deps webkit
      - name: At-point-of-use text geometry keyboard find print and an injected failure
        env:
          NODE_PATH: ${{ runner.temp }}/perf-tools/node_modules
          PERF_RESULTS: ${{ runner.temp }}/visible-compatibility
        run: node scripts/perf/render_visible_compat.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-visible-compatibility
          path: ${{ runner.temp }}/visible-compatibility/
          retention-days: 7
