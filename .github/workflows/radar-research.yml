name: Radar Research
on:
  # The bounded experiment is complete. Reopen manually after a new hypothesis
  # or source/parser change; do not keep funding the same comparison weekly.
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: radar-research
  cancel-in-progress: false
jobs:
  experiment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate experimental failure semantics
        run: python3 scripts/radar-research.test.py
      - name: Run bounded paired experiment
        env:
          RESEARCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/radar-research.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radar-research
          path: data/radar-research.json
          retention-days: 90
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_PAT }}
          branch: Codex/radar-research-observations
          add-paths: data/radar-research.json
          commit-message: 'chore: record radar acquisition experiment'
          title: 'chore: record radar acquisition experiment'
          body: 'Paired sequential/parallel acquisition experiment. Only observations are published; the prototype is not promoted automatically.'
