# Generation/posting intentionally suspended; offline repository checks remain available.
name: Devlog platform boundary
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      input_platform:
        type: string
        required: true
      mode:
        type: string
        required: true
      force:
        type: boolean
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      IDENTITY_DENYLIST:
        required: false
      DEVTO_API_KEY:
        required: false
      HATENA_API_KEY:
        required: false
      LIVEDOOR_API_KEY:
        required: false
# TEMPORARY SECURITY STOP: public Actions artifacts are not a private handoff.
# Generation and publication remain blocked until a reviewed private, bounded,
# integrity-checked handoff preserves separate model and credentialed runners.
# Do not replace this with a same-runner model/secret pipeline.
permissions: {}
jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Block generation and publication pending private handoff
        run: |
          echo '::error title=Devlog syndication::PRIVATE_HANDOFF_REQUIRED'
          exit 1
