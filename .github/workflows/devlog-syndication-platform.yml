# A model runner never shares a VM, checkout, or writable artifact with credentialed validation/publication.
# Only bounded article JSON crosses that boundary. Context comes from the model-free prepare job.
name: Devlog platform boundary
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      input_platform:
        type: string
        required: true
      mode:
        type: string
        required: true
      force:
        type: boolean
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      IDENTITY_DENYLIST:
        required: false
      DEVTO_API_KEY:
        required: false
      HATENA_API_KEY:
        required: false
      LIVEDOOR_API_KEY:
        required: false
permissions:
  contents: read
env:
  PLATFORM: ${{ inputs.platform }}
  INPUT_PLATFORM: ${{ inputs.input_platform }}
  MODE: ${{ inputs.mode }}
  FORCE: ${{ inputs.force }}
# Job timeout ceilings sum to the former 90-minute per-platform ceiling.
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      due: ${{ steps.gate.outputs.due }}
      code: ${{ steps.gate.outputs.code }}
      model: ${{ steps.route.outputs.model }}
      fix_model: ${{ steps.route.outputs.fix_model }}
      budget: ${{ steps.route.outputs.budget }}
    steps:
      - name: 対象の媒体か
        id: select
        run: |
          if [ "$INPUT_PLATFORM" = "all" ] || [ "$INPUT_PLATFORM" = "$PLATFORM" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.select.outputs.on == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.select.outputs.on == 'true'
        with:
          node-version: '24.22.1'

      - name: 自己テスト（壊れた検査で投稿しない）
        if: steps.select.outputs.on == 'true'
        run: node scripts/devlog-syndication.mjs --selftest

      # 鍵の値は渡さない。真偽だけを出力にして、門が「鍵が無い」をどう扱うかを決める
      # （旧「投稿用の鍵があるか」は門に吸収した。dev.to・はてなは投稿する番に no_key で落とし、
      #   鍵をこれから登録するライブドアは key_pending で休む。dry_run は鍵を見ない）。
      - name: 鍵の有無（値は渡さない・真偽だけ）
        id: key
        if: steps.select.outputs.on == 'true'
        env:
          HAS_KEY: ${{ (inputs.platform == 'devto' && secrets.DEVTO_API_KEY != '') || ((inputs.platform == 'hatena' || inputs.platform == 'hatenadiary') && secrets.HATENA_API_KEY != '') || (inputs.platform == 'livedoor' && secrets.LIVEDOOR_API_KEY != '') }}
        run: echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: 門（緊急停止・鍵・公開面の最新投稿からの間隔）
        id: gate
        if: steps.select.outputs.on == 'true'
        env:
          HAS_KEY: ${{ steps.key.outputs.has_key }}
        run: |
          ARGS=(gate --platform "$PLATFORM" --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ "$MODE" != "publish" ]; then ARGS+=(--dry-run); fi
          if [ "$MODE" = "publish" ] && [ "$HAS_KEY" != "true" ]; then ARGS+=(--key-missing); fi
          node scripts/devlog-syndication.mjs "${ARGS[@]}"

      - name: 文脈（記事ネタ台帳・既存記事・リンク候補）
        if: steps.gate.outputs.due == 'true'
        run: |
          mkdir -p .syndication
          node scripts/devlog-syndication.mjs context --platform "$PLATFORM" --out .syndication/context.json

      - name: モデルの振り分け
        id: route
        if: steps.gate.outputs.due == 'true'
        run: |
          MODEL="$(node scripts/check-model-routing.mjs --resolve syndication)"
          # 手直しは同じモデルで回さない（同じ盲点で同じ失敗をする）。梯子の2段目を使う。
          FIX_MODEL="$(node scripts/check-model-routing.mjs --escalate syndication --attempt 2)"
          BUDGET="$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/model-routing.json','utf8')).rules.syndication.max_usd_per_run)")"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "fix_model=$FIX_MODEL" >> "$GITHUB_OUTPUT"
          echo "budget=$BUDGET" >> "$GITHUB_OUTPUT"
          echo "::notice title=Model routing::syndication -> $MODEL / fix -> $FIX_MODEL (max \$$BUDGET per run)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.due == 'true'
        with:
          name: devlog-context-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .syndication/context.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: prepare
    if: needs.prepare.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: devlog-context-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context
      - run: |
          mkdir -p .syndication
          cp "$RUNNER_TEMP/context/context.json" .syndication/context.json
      - name: 執筆（Claude Code・1本）
        id: write
        if: needs.prepare.outputs.due == 'true'
        timeout-minutes: 40
        continue-on-error: true
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262 (Bun 1.4.4 / Claude Code 2.1.310 / Agent SDK 0.3.310)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"
          claude_args: |
            --max-turns 100
            --max-budget-usd ${{ needs.prepare.outputs.budget }}
            --model ${{ needs.prepare.outputs.model }}
            --allowedTools "Read,Write,Edit,Glob,Grep"
          prompt: |
            開発記録の外部ブログ配信の執筆ステップです。媒体は「${{ inputs.platform }}」。
            カレントディレクトリはリポジトリのルートです。次の順に1本だけ書いてください。

            1. `docs/syndication/RUNBOOK.md` を全文読む。以降はすべてこの手順書に従う（このプロンプトより手順書が優先）。
            2. `.syndication/context.json` を読む。題材を1つ選び、使うファイル（種のある `docs/story-seeds.md`、題材のページのファイル、`llms.txt` など）を実際に読む。
            3. 記事を `.syndication/article.json` に書く（手順書 §6 の形）。ほかのファイルは作らない・変えない。
            ネットワークには出ないでください。書けない理由があるときは、手順書 §1-3 のとおり skip を書いて終えてください。

      # claude-code-action は実行記録を毎回同じパスに書くので、手直しのステップが執筆の記録を上書きする
      # （2026-09-25 の試験実行で、要約の2行が同じ値になった）。書いた直後に数字だけ抜いておく。
      # 実行記録そのもの（会話の全文）は成果物に入れない。
      #
      # 【2026-10-13】**失敗した回だけ、エラー文の先頭300字を残す**（要約・成果物の metrics.txt と、
      # API で読める注釈 ::warning の両方）。10-08〜10-12 の全回が「0.3〜1秒・費用0・is_error=true」で
      # 執筆の前に落ちていたが、action は既定でエラー文を隠し、ここも数字しか抜いていなかったので、
      # 原因（週次の利用上限・認証・モデル指定のどれか）を後から確かめられなかった。
      # 成功した回は今までどおり数字だけ。会話の全文は今までどおり残さない。
      - name: 執筆の記録（ターン数と費用）
        if: always() && (steps.write.outcome == 'success' || steps.write.outcome == 'failure')
        env:
          EXEC_FILE: ${{ steps.write.outputs.execution_file }}
          LABEL: 執筆
        run: |
          mkdir -p .syndication
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const r=(Array.isArray(d)?d:[d]).filter(x=>x&&x.type==='result').pop()||{};const err=r.is_error?String(r.result??'').replace(/\s+/g,' ').trim().slice(0,300):'';fs.appendFileSync('.syndication/metrics.txt','- '+process.argv[2]+': turns='+r.num_turns+' cost_usd='+r.total_cost_usd+' is_error='+r.is_error+(err?' error='+JSON.stringify(err):'')+'\n');if(err)console.log('::warning title=Devlog syndication::'+process.argv[2]+'のステップが失敗した: '+err.replace(/%/g,'%25'))" "$EXEC_FILE" "$LABEL" || true
          else
            echo "- $LABEL: 実行記録なし" >> .syndication/metrics.txt
          fi

      - name: Model cost and turns
        run: sed 's/^/    /' .syndication/metrics.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: devlog-draft-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .syndication/article.json
            .syndication/metrics.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  validate:
    needs: [prepare, draft]
    if: needs.prepare.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      ok: ${{ steps.validate.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: devlog-context-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: devlog-draft-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draft
      - name: Import article data into the clean trusted checkout
        run: |
          mkdir -p .syndication
          cp "$RUNNER_TEMP/context/context.json" .syndication/context.json
          node scripts/syndication-input.mjs "$RUNNER_TEMP/draft/article.json" .syndication/article.json
      - name: 検証
        id: validate
        if: needs.prepare.outputs.due == 'true'
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
          WRITE_OUTCOME: ${{ needs.draft.result }}
        run: |
          if [ ! -s .syndication/article.json ]; then
            echo "::error title=Devlog syndication::執筆が記事（.syndication/article.json）を残していない（執筆の結果: $WRITE_OUTCOME）"
            exit 1
          fi
          if [ "$WRITE_OUTCOME" != "success" ]; then
            echo "::warning title=Devlog syndication::執筆が上限などで途中で止まった（$WRITE_OUTCOME）。書けていた記事を検証に回す"
          fi
          if node scripts/devlog-syndication.mjs validate --platform "$PLATFORM" \
               --article .syndication/article.json --context .syndication/context.json \
               --report .syndication/validation.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: devlog-validation-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .syndication/validation.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  fix:
    needs: [prepare, validate]
    if: needs.prepare.outputs.due == 'true' && needs.validate.outputs.ok != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 27
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: devlog-context-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: devlog-draft-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draft
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: devlog-validation-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
      - run: |
          mkdir -p .syndication
          cp "$RUNNER_TEMP/context/context.json" .syndication/context.json
          cp "$RUNNER_TEMP/validation/validation.txt" .syndication/validation.txt
          node scripts/syndication-input.mjs "$RUNNER_TEMP/draft/article.json" .syndication/article.json
      - name: 手直し（検証で落ちたときだけ・1回）
        id: fix
        if: needs.validate.outputs.ok != 'true'
        timeout-minutes: 25
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262 (Bun 1.4.4 / Claude Code 2.1.310 / Agent SDK 0.3.310)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"
          claude_args: |
            --max-turns 30
            --max-budget-usd ${{ needs.prepare.outputs.budget }}
            --model ${{ needs.prepare.outputs.fix_model }}
            --allowedTools "Read,Write,Edit,Glob,Grep"
          prompt: |
            開発記録の外部ブログ配信の手直しステップです。媒体は「${{ inputs.platform }}」。
            `.syndication/validation.txt` に検査で落ちた理由があります。`docs/syndication/RUNBOOK.md` の §7 に従い、
            `.syndication/article.json` をその場で直してください。出典の見つからない数字は削ってください。
            ほかのファイルは作らない・変えない。ネットワークには出ないでください。

      - name: 手直しの記録（ターン数と費用）
        if: always() && (steps.fix.outcome == 'success' || steps.fix.outcome == 'failure')
        env:
          EXEC_FILE: ${{ steps.fix.outputs.execution_file }}
          LABEL: 手直し
        run: |
          mkdir -p .syndication
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const r=(Array.isArray(d)?d:[d]).filter(x=>x&&x.type==='result').pop()||{};const err=r.is_error?String(r.result??'').replace(/\s+/g,' ').trim().slice(0,300):'';fs.appendFileSync('.syndication/metrics.txt','- '+process.argv[2]+': turns='+r.num_turns+' cost_usd='+r.total_cost_usd+' is_error='+r.is_error+(err?' error='+JSON.stringify(err):'')+'\n');if(err)console.log('::warning title=Devlog syndication::'+process.argv[2]+'のステップが失敗した: '+err.replace(/%/g,'%25'))" "$EXEC_FILE" "$LABEL" || true
          else
            echo "- $LABEL: 実行記録なし" >> .syndication/metrics.txt
          fi

      - name: Model cost and turns
        run: sed 's/^/    /' .syndication/metrics.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: devlog-fixed-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .syndication/article.json
            .syndication/metrics.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, validate, fix]
    if: >-
      always() && !cancelled() && needs.prepare.outputs.due == 'true' &&
      needs.validate.result == 'success' &&
      (needs.validate.outputs.ok == 'true' || needs.fix.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: devlog-context-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ format('devlog-{0}-{1}-{2}-{3}', needs.validate.outputs.ok == 'true' && 'draft' || 'fixed', inputs.platform, github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/article
      - name: Import article data; ignore every other model-produced file
        run: |
          mkdir -p .syndication
          cp "$RUNNER_TEMP/context/context.json" .syndication/context.json
          node scripts/syndication-input.mjs "$RUNNER_TEMP/article/article.json" .syndication/article.json
      - name: 再検証
        if: needs.prepare.outputs.due == 'true'
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
        run: |
          node scripts/devlog-syndication.mjs validate --platform "$PLATFORM" \
            --article .syndication/article.json --context .syndication/context.json \
            --report .syndication/validation-2.txt

      - name: 投稿
        id: publish
        if: needs.prepare.outputs.due == 'true'
        env:
          DEVTO_API_KEY: ${{ inputs.platform == 'devto' && secrets.DEVTO_API_KEY || '' }}
          HATENA_API_KEY: ${{ (inputs.platform == 'hatena' || inputs.platform == 'hatenadiary') && secrets.HATENA_API_KEY || '' }}
          LIVEDOOR_API_KEY: ${{ inputs.platform == 'livedoor' && secrets.LIVEDOOR_API_KEY || '' }}
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
        run: |
          ARGS=(publish --platform "$PLATFORM" --article .syndication/article.json \
                --context .syndication/context.json --out .syndication/published.json)
          if [ "$MODE" != "publish" ]; then ARGS+=(--dry-run); fi
          # 投稿の直前に認証済みの一覧で門を確かめ直す。force は間隔だけを越える（24時間の上限は越えない）
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          node scripts/devlog-syndication.mjs "${ARGS[@]}"

      - name: 公開確認（自社リンクの rel と meta robots）
        if: needs.prepare.outputs.due == 'true' && env.MODE == 'publish'
        run: |
          node scripts/devlog-syndication.mjs verify --platform "$PLATFORM" \
            --published .syndication/published.json --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.prepare.outputs.due == 'true'
        with:
          name: devlog-syndication-${{ inputs.platform }}-${{ github.run_id }}
          path: |
            .syndication/article.json
            .syndication/validation-2.txt
            .syndication/published.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
