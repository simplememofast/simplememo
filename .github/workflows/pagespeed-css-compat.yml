name: Prepare Inline CSS Compatibility
on:
  pull_request:
    paths: ['.github/workflows/pagespeed-css-compat.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/pagespeed-mobile-20260916' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Teach the existing static guard to verify exact inline shared rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-viewport-overflow.mjs')
          s=p.read_text()
          old="import { MARKER, measurementGroup } from './lib/viewport-health.mjs';"
          assert s.count(old)==1
          s=s.replace(old,old+"\nimport { hasCurrentInlineSharedCss } from './perf/inline_styles.mjs';")
          old="export const SAFETY_NET_CSS = 'assets/css/safety-net.css';"
          assert s.count(old)==1
          s=s.replace(old,old+"\n\n/** Linked safety CSS or a byte-verified inline copy of the shared layout. */\nexport function hasSafetyNet(html) {\n  return linksStylesheet(html, SHARED_CSS) || linksStylesheet(html, SAFETY_NET_CSS)\n    || hasCurrentInlineSharedCss(html, fs.readFileSync(path.join(ROOT, SHARED_CSS), 'utf8'));\n}")
          old='!linksStylesheet(html, SHARED_CSS) && !linksStylesheet(html, SAFETY_NET_CSS)'
          assert s.count(old)==2
          s=s.replace(old,'!hasSafetyNet(html)')
          p.write_text(s)
          PY
          node --test scripts/perf/inline_styles.test.mjs
          node scripts/check-viewport-overflow.mjs --static
          node scripts/check-guard-shapes.mjs --check
      - name: Commit the single reviewed compatibility change to the draft branch
        run: |
          set -euo pipefail
          git add -- scripts/check-viewport-overflow.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(perf): recognize verified inline shared CSS in the existing overflow guard'
          git push origin HEAD:refs/heads/claude/pagespeed-mobile-20260916
