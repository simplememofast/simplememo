name: Prepare PageSpeed Assets
on:
  pull_request:
    paths:
      - 'scripts/perf/build_home.py'
      - '.github/workflows/pagespeed-prepare.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/pagespeed-mobile-20260916' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned asset tools
        run: pip install fonttools==4.63.0 brotli==1.2.0 Pillow==12.3.0
      - name: Generate and reproduce the optimized assets
        run: |
          python scripts/perf/build_home.py --write
          python scripts/perf/build_home.py --check
          node scripts/check-css-version.mjs --check
          node scripts/seo-check.js --selftest
          node scripts/seo-check.js
      - name: Commit only generated homepage files to the draft branch
        run: |
          set -euo pipefail
          git add -- index.html en/index.html assets/home-perf/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: ship page-specific fonts, inline CSS and responsive AVIF images'
            git push origin HEAD:refs/heads/claude/pagespeed-mobile-20260916
          fi
          git rev-parse HEAD
      - name: Measure generated pages
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/perf-tools" --no-save lighthouse@12.8.2
          mkdir -p "$RUNNER_TEMP/perf-results"
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/perf-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          for run in 1 2 3; do
            "$RUNNER_TEMP/perf-tools/node_modules/.bin/lighthouse" http://127.0.0.1:8765/ --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path="$RUNNER_TEMP/perf-results/optimized-$run" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          done
          "$RUNNER_TEMP/perf-tools/node_modules/.bin/lighthouse" http://127.0.0.1:8765/en/ --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path="$RUNNER_TEMP/perf-results/optimized-en" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          python3 - <<'PY'
          import glob,json,os
          for path in sorted(glob.glob(os.environ['RUNNER_TEMP']+'/perf-results/*.report.json')):
              report=json.load(open(path)); a=report['audits']
              row={'file':os.path.basename(path),'score':report['categories']['performance']['score'],'metrics':{k:a[k].get('displayValue') for k in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift']}}
              print(json.dumps(row))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed-optimized-reports
          path: ${{ runner.temp }}/perf-results/
          retention-days: 7
      - name: Archive generated public source for review
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/perf-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/perf-source/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed-prepared-source
          path: ${{ runner.temp }}/perf-source/
          retention-days: 1
