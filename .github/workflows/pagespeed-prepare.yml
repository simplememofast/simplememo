name: Prepare PageSpeed Assets
on:
  pull_request:
    paths:
      - 'scripts/perf/**'
      - '.github/workflows/pagespeed-prepare.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/pagespeed-mobile-20260916' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned asset tools
        run: pip install fonttools==4.63.0 brotli==1.2.0 Pillow==12.3.0
      - name: Generate and reproduce the optimized assets
        run: |
          python scripts/perf/prepare_once.py
          python scripts/perf/build_home.py --write
          python scripts/perf/build_home.py --check
          node scripts/check-css-version.mjs --check
          node scripts/seo-check.js --selftest
          node scripts/seo-check.js
      - name: Commit only reviewed generated and guard files to the draft branch
        run: |
          set -euo pipefail
          git add -- index.html en/index.html assets/home-perf/ scripts/perf/build_home.py scripts/check-css-version.mjs CLAUDE.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: validate generated homepage assets in existing SEO checks'
            git push origin HEAD:refs/heads/claude/pagespeed-mobile-20260916
          fi
          git rev-parse HEAD
      - name: Verify editorial text, metadata, images and analytics unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/perf')
          from build_home import Text
          for name in ['index.html','en/index.html']:
              before=subprocess.check_output(['git','show',os.environ['BASE_SHA']+':'+name],text=True)
              after=Path(name).read_text()
              for pattern in [r'<script\b[^>]*>.*?</script>',r'<meta\b[^>]*>',r'<a\b[^>]*>',r'<img\b[^>]*>',r'<title>.*?</title>',r'<link rel="(?:canonical|alternate)"[^>]*>']:
                  assert re.findall(pattern,before,re.S)==re.findall(pattern,after,re.S),(name,pattern)
              def text(html):
                  parser=Text();parser.feed(html);return re.sub(r'\s+',' ',''.join(parser.parts)).strip()
              assert text(before)==text(after),name
              target=Path('.perf-baseline')/name
              target.parent.mkdir(parents=True,exist_ok=True);target.write_text(before)
          print('PASS: both homepages preserve text, metadata, scripts, image fallbacks and all links.')
          PY
      - name: Measure compressed baseline and optimized pages; test browsers
        env:
          PERF_RESULTS: ${{ runner.temp }}/perf-results
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/perf-tools" --no-save lighthouse@12.8.2 playwright@1.55.0
          mkdir -p "$PERF_RESULTS"
          python3 scripts/perf/server.py > "$RUNNER_TEMP/perf-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          for run in 1 2 3; do
            for target in baseline optimized; do
              url=http://127.0.0.1:8765/
              if [ "$target" = baseline ]; then url=http://127.0.0.1:8765/.perf-baseline/; fi
              "$RUNNER_TEMP/perf-tools/node_modules/.bin/lighthouse" "$url" --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path="$PERF_RESULTS/$target-$run" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
            done
          done
          "$RUNNER_TEMP/perf-tools/node_modules/.bin/lighthouse" http://127.0.0.1:8765/en/ --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path="$PERF_RESULTS/optimized-en" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          NODE_PATH="$RUNNER_TEMP/perf-tools/node_modules" node scripts/perf/browser_checks.cjs
      - name: Summarize measured results
        if: always()
        run: |
          python3 - <<'PY'
          import glob,json,os
          for path in sorted(glob.glob(os.environ['RUNNER_TEMP']+'/perf-results/*.report.json')):
              report=json.load(open(path)); a=report['audits']
              row={'file':os.path.basename(path),'score':report['categories']['performance']['score'],'metrics':{k:a[k].get('displayValue') for k in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift']}}
              print(json.dumps(row))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed-optimized-reports
          path: ${{ runner.temp }}/perf-results/
          retention-days: 7
      - name: Archive generated public source for review
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/perf-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/perf-source/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed-prepared-source
          path: ${{ runner.temp }}/perf-source/
          retention-days: 1
