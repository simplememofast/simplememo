# claude/ ブランチのPRを自動マージする。
#
# 【この設計の理由】
# 以前は `pull_request: [opened, synchronize]` で発火し、その場で pulls.merge を
# 呼んでいた。つまり SEO Validation の結果を一切待たずにマージしており、
# main へのマージ＝Cloudflare Pages の本番デプロイなので、
# 検証が落ちる変更でも「PRを開いた瞬間に本番へ出る」状態だった。
#
# そこで SEO Validation の完了を待つ `workflow_run` トリガーに変更した。
# 検証が success のときだけマージする。
#
# 注意: workflow_run で起動するワークフローは常にデフォルトブランチ(main)の
# 定義が使われる。このファイルを編集しても、main にマージされるまで反映されない。

name: Auto-merge Claude PRs

on:
  workflow_run:
    workflows: ["SEO Validation"]
    types: [completed]

# 既定は権限なし。必要なジョブにだけ付与する。
permissions: {}

jobs:
  auto-merge:
    # 検証が通っていないものは触らない。
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # 再実行やReadyへの遷移で同じブランチの検証完了が重なるため、直列化する。
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout the trusted merge guard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Merge the validated commit
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const {
              approvedMergeOwner, completeCommitList, findUnapprovedPrincipals,
            } = require(`${process.env.GITHUB_WORKSPACE}/scripts/merge-identity-check.js`);
            const run = context.payload.workflow_run;
            const branch = run.head_branch || '';
            const validatedSha = run.head_sha;
            const { owner, repo } = context.repo;
            let mergedCount = 0;

            if (!branch.startsWith('claude/') && !branch.startsWith('Codex/')) {
              core.info(`${branch} は自動マージ対象のブランチではない`);
              return;
            }

            // Require the PR merge-tree check for every branch. Old branch
            // workflows may still emit push results during this migration.
            if (run.event !== 'pull_request') {
              core.info('PRのマージ内容を照合した pull_request 検証の成功を待つ');
              return;
            }

            // 検証時点の関連付けを信用せず、現在開いているPRをheadから引き直す。
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`,
            });

            if (prs.length === 0) {
              core.info(`${branch} に対する open な PR が無いため何もしない`);
              return;
            }

            for (const listedPr of prs) {
              // The list endpoint is a summary and may omit commit count.
              // Re-read the current PR before evaluating the merge gate.
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: listedPr.number,
              });
              if (pr.base.ref !== 'main' || pr.head.repo?.full_name !== `${owner}/${repo}`) {
                core.info(`#${pr.number}: unexpected repository or base branch`);
                continue;
              }
              if (pr.draft) {
                core.info(`#${pr.number} は draft のため見送り（Ready にすると次の検証で対象になる）`);
                continue;
              }

              // 検証されたコミットだけをマージする。検証後に push されていれば、
              // その push が起こす次の SEO Validation → workflow_run が拾う。
              if (pr.head.sha !== validatedSha) {
                core.info(
                  `#${pr.number} は検証後に更新されている` +
                  `（検証 ${validatedSha.slice(0, 7)} / 現在 ${pr.head.sha.slice(0, 7)}）ため見送り`
                );
                continue;
              }

              // GitHub credits the PR opener as the squash author. Check the
              // public account profile, not just source-commit metadata.
              const openerLogin = pr.user?.login;
              if (openerLogin !== 'simplememofast') {
                core.setFailed(`#${pr.number}: unapproved PR opener; merge withheld`);
                return;
              }
              const { data: openerProfile } = await github.rest.users.getByUsername({
                username: openerLogin,
              });
              if (!approvedMergeOwner(openerLogin, openerProfile)) {
                core.setFailed(`#${pr.number}: unapproved PR opener profile; merge withheld`);
                return;
              }

              // The PR commits endpoint cannot return beyond 250 commits.
              // Fail closed rather than validate an incomplete subset.
              if (!Number.isInteger(pr.commits) || pr.commits < 1 || pr.commits > 250) {
                core.setFailed(`#${pr.number}: commit count unavailable or above review limit; merge withheld`);
                return;
              }

              // GitHub's default squash message can credit every PR commit
              // author. Validate all principals immediately before merge,
              // including trailers, without logging rejected identity data.
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              if (!completeCommitList(pr.commits, commits)) {
                core.setFailed(`#${pr.number}: incomplete commit list; merge withheld`);
                return;
              }
              const unapproved = findUnapprovedPrincipals(commits);
              if (unapproved.length) {
                core.setFailed(
                  `#${pr.number}: unapproved commit identity in ${unapproved.length} field(s); merge withheld`
                );
                return;
              }

              const { data: merged } = await github.rest.pulls.merge({
                owner, repo,
                pull_number: pr.number,
                merge_method: 'squash',
                sha: validatedSha,
                // Do not copy unverified PR or source-commit prose into the
                // public squash message. The PR remains the review record.
                commit_title: `Merge validated PR #${pr.number}`,
                commit_message: `Source PR: https://github.com/${owner}/${repo}/pull/${pr.number}\nValidated head: ${validatedSha}`,
              });
              mergedCount++;
              // merged.sha は main に積まれた squash コミット。後続の IndexNow
              // 通知ステップがこの SHA を checkout して首親差分を通知する。
              core.setOutput('merged_sha', merged.sha);
              core.notice(`#${pr.number} を ${validatedSha.slice(0, 7)} でマージした`);
            }
            core.setOutput('merged_count', String(mergedCount));

      # GITHUB_TOKEN によるマージ push はワークフローを発火させない（GitHub の
      # 再帰防止仕様）ため、seo-check.yml の「main push で IndexNow 通知」は
      # auto-merge 経由のデプロイでは一度も走らない。マージを実行したこの run が
      # 通知まで責任を持つ。通知の失敗はマージ結果に影響させない。
      - name: Checkout merged commit
        if: steps.merge.outputs.merged_count != '0' && steps.merge.outputs.merged_count != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.merge.outputs.merged_sha }}
          fetch-depth: 10

      - name: Setup Node
        if: steps.merge.outputs.merged_count != '0' && steps.merge.outputs.merged_count != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: IndexNow notify (merged diff)
        if: steps.merge.outputs.merged_count != '0' && steps.merge.outputs.merged_count != ''
        continue-on-error: true
        run: node scripts/indexnow-notify.js --since ${{ steps.merge.outputs.merged_count }}
