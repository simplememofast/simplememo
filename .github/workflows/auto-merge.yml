# claude/ ブランチのPRを自動マージする。
#
# 【この設計の理由】
# 以前は `pull_request: [opened, synchronize]` で発火し、その場で pulls.merge を
# 呼んでいた。つまり SEO Validation の結果を一切待たずにマージしており、
# main へのマージ＝Cloudflare Pages の本番デプロイなので、
# 検証が落ちる変更でも「PRを開いた瞬間に本番へ出る」状態だった。
#
# そこで SEO Validation の完了を待つ `workflow_run` トリガーに変更した。
# 検証が success のときだけマージする。
#
# 注意: workflow_run で起動するワークフローは常にデフォルトブランチ(main)の
# 定義が使われる。このファイルを編集しても、main にマージされるまで反映されない。
#
# 【無人の自律運転ブランチはオーナーの承認つき（2026-10-20 オーナー判断・監査 F2/F3）】
# claude/obsidian-auto-<YYYYMMDD> の PR は、台帳（scripts/lib/autopilot-paths.mjs の LEDGER と、
# 新しく足した宣言・却下のファイル）だけを変えるときに限って、ここで自動マージする。
# 台帳以外（ページ・スクリプト・/autopilot/ と翻訳・sitemap の生成物を含む）を変える PR は
# 開いたまま残し、同じ run の merge-after-approval ジョブが Environment autopilot-approval で
# オーナーの承認を待つ。判定は main の scripts/autopilot-approval-check.mjs。
# ほかのブランチ（オーナーのセッション・Act・Codex/* など）の扱いは変えていない。

name: Auto-merge Claude PRs

on:
  workflow_run:
    workflows: ["SEO Validation"]
    types: [completed]

# 既定は権限なし。必要なジョブにだけ付与する。
permissions: {}

jobs:
  auto-merge:
    # 検証が通っていないものは触らない。
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # 再実行やReadyへの遷移で同じブランチの検証完了が重なるため、直列化する。
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    # 承認待ちにした自律運転の PR を merge-after-approval へ渡す（それ以外は空）。
    outputs:
      approval_pr: ${{ steps.merge.outputs.approval_pr }}
      approval_sha: ${{ steps.merge.outputs.approval_sha }}
      approval_files: ${{ steps.merge.outputs.approval_files }}
      validated_at: ${{ steps.merge.outputs.validated_at }}
    steps:
      - name: Checkout the trusted merge guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Merge the validated commit
        id: merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {
              approvedMergeOwner, completeCommitList, findUnapprovedPrincipals,
            } = require(`${process.env.GITHUB_WORKSPACE}/scripts/merge-identity-check.js`);
            const run = context.payload.workflow_run;
            const branch = run.head_branch || '';
            const validatedSha = run.head_sha;
            const { owner, repo } = context.repo;
            let mergedCount = 0;

            if (!branch.startsWith('claude/') && !branch.startsWith('Codex/')) {
              core.info(`${branch} は自動マージ対象のブランチではない`);
              return;
            }

            // Require the PR merge-tree check for every branch. Old branch
            // workflows may still emit push results during this migration.
            if (run.event !== 'pull_request') {
              core.info('PRのマージ内容を照合した pull_request 検証の成功を待つ');
              return;
            }

            // 検証時点の関連付けを信用せず、現在開いているPRをheadから引き直す。
            // List only PRs into main. Anyone can open PRs from this branch into
            // other bases; listed by head alone they could fill the first page
            // (newest 30) and hide the PR into main. GitHub allows one open PR
            // per head and base, so more than one means the listing is not what
            // this gate assumes (or is truncated): withhold rather than merge a subset.
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`, base: 'main',
            });
            if (prs.length > 1) {
              core.setFailed(`${branch}: more than one open PR into main listed; merge withheld`);
              return;
            }

            if (prs.length === 0) {
              core.info(`${branch} から main への open な PR が無いため何もしない`);
              return;
            }

            for (const listedPr of prs) {
              // The list endpoint is a summary and may omit commit count.
              // Re-read the current PR before evaluating the merge gate.
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: listedPr.number,
              });
              if (pr.base.ref !== 'main' || pr.head.repo?.full_name !== `${owner}/${repo}`) {
                core.info(`#${pr.number}: unexpected repository or base branch`);
                continue;
              }
              if (pr.draft) {
                core.info(`#${pr.number} は draft のため見送り（Ready にすると次の検証で対象になる）`);
                continue;
              }

              // 検証されたコミットだけをマージする。検証後に push されていれば、
              // その push が起こす次の SEO Validation → workflow_run が拾う。
              if (pr.head.sha !== validatedSha) {
                core.info(
                  `#${pr.number} は検証後に更新されている` +
                  `（検証 ${validatedSha.slice(0, 7)} / 現在 ${pr.head.sha.slice(0, 7)}）ため見送り`
                );
                continue;
              }

              // GitHub credits the PR opener as the squash author. Check the
              // public account profile, not just source-commit metadata.
              const openerLogin = pr.user?.login;
              if (openerLogin !== 'simplememofast') {
                core.setFailed(`#${pr.number}: unapproved PR opener; merge withheld`);
                return;
              }
              const { data: openerProfile } = await github.rest.users.getByUsername({
                username: openerLogin,
              });
              if (!approvedMergeOwner(openerLogin, openerProfile)) {
                core.setFailed(`#${pr.number}: unapproved PR opener profile; merge withheld`);
                return;
              }

              // The PR commits endpoint cannot return beyond 250 commits.
              // Fail closed rather than validate an incomplete subset.
              if (!Number.isInteger(pr.commits) || pr.commits < 1 || pr.commits > 250) {
                core.setFailed(`#${pr.number}: commit count unavailable or above review limit; merge withheld`);
                return;
              }

              // GitHub's default squash message can credit every PR commit
              // author. Validate all principals immediately before merge,
              // including trailers, without logging rejected identity data.
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              if (!completeCommitList(pr.commits, commits)) {
                core.setFailed(`#${pr.number}: incomplete commit list; merge withheld`);
                return;
              }
              const unapproved = findUnapprovedPrincipals(commits);
              if (unapproved.length) {
                core.setFailed(
                  `#${pr.number}: unapproved commit identity in ${unapproved.length} field(s); merge withheld`
                );
                return;
              }

              // 無人の自律運転ブランチ（claude/obsidian-auto-<YYYYMMDD>）だけの門。台帳だけを
              // 変える PR はこのままマージし、それ以外は開いたまま merge-after-approval に渡す。
              // 判定の失敗はこの PR だけを承認待ちにする。setFailed も return もしない
              // （ほかのブランチと、この run の完了を待つ Act・decision-monitor に影響させない）。
              if (/^claude\/obsidian-auto-(\d{8})$/.test(branch)) {
                let policy = null;
                let verdict;
                try {
                  policy = await import(`${process.env.GITHUB_WORKSPACE}/scripts/autopilot-approval-check.mjs`);
                  if (!policy.isAutopilotBranch(branch)) throw new Error('branch scope differs from the policy');
                  const files = pr.changed_files > policy.MAX_LISTED_FILES ? null
                    : await github.paginate(github.rest.pulls.listFiles, {
                      owner, repo, pull_number: pr.number, per_page: 100,
                    });
                  verdict = { ...policy.autoMergeClass(files, pr.changed_files),
                    files: Array.isArray(files) ? policy.fileListHash(files) : '' };
                } catch {
                  verdict = { class: 'approval', reasons: ['policy_error'], files: '' };
                }
                if (verdict.class !== 'ledger') {
                  core.setOutput('approval_pr', String(pr.number));
                  core.setOutput('approval_sha', validatedSha);
                  core.setOutput('approval_files', verdict.files || '');
                  core.setOutput('validated_at', run.created_at || '');
                  try {
                    await github.rest.issues.addLabels({
                      owner, repo, issue_number: pr.number, labels: ['autopilot:owner-approval'],
                    });
                  } catch {
                    core.info(`#${pr.number}: 表示用のラベルを付けられなかった（判定には影響しない）`);
                  }
                  try {
                    await core.summary.addHeading('Autopilot PR はオーナーの承認待ち')
                      .addRaw(policy ? policy.approvalSummary({ pr: pr.number, reasons: verdict.reasons })
                        : '判定を読み込めなかったため、この PR は承認待ちにした。\n').write();
                  } catch {
                    core.info('ジョブサマリを書けなかった（判定には影響しない）');
                  }
                  core.notice(`#${pr.number} は台帳以外を変えるため自動マージしない（承認待ち: merge-after-approval）`);
                  continue;
                }
              }

              let merged;
              try {
                ({ data: merged } = await github.rest.pulls.merge({
                  owner, repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  sha: validatedSha,
                  // Do not copy unverified PR or source-commit prose into the
                  // public squash message. The PR remains the review record.
                  commit_title: `Merge validated PR #${pr.number}`,
                  commit_message: `Source PR: https://github.com/${owner}/${repo}/pull/${pr.number}\nValidated head: ${validatedSha}`,
                }));
              } catch (error) {
                // PR と main の両方が、マージの土台より後に同じ .github/workflows/ のファイルを変えていると、
                // squash の結果の blob を head のコミットがまだ持っていない。そのとき GitHub は GITHUB_TOKEN
                // （workflows の権限なし）でのマージを HTTP 403 で拒む（読み。CLAUDE.md「自動マージの挙動」、
                // 2026-09-05 #938・2026-10-26 #2179）。この PR を main の取り込み待ちにして終える（一覧は1件まで）。
                // main を取り込んで push し直せば、次の検証の後にここでマージされる。ほかの失敗は今までどおり落とす。
                if (error?.status !== 403 || !/create or update workflow/.test(String(error?.message ?? ''))) throw error;
                // 反証条件: head が main を全部含む（squash の結果が head と同じになる）のに 403 なら、この読みは
                // 外れている。取り込みでは直らないので、待たせずに run を落とす。main と比べられないときも落とす。
                // 比べるのは今の main なので、403 から比べるまでの間に main が進むと反証の形でも待たせるが、
                // 取り込んだ後の次の 403 で behind_by が 0 になり、run が落ちる。
                let behind = null;
                try {
                  ({ data: { behind_by: behind } } = await github.rest.repos.compareCommitsWithBasehead({
                    owner, repo, basehead: `main...${validatedSha}`, per_page: 1,
                  }));
                } catch {
                  core.info(`#${pr.number}: main との差を読めなかった`);
                }
                if (!Number.isInteger(behind) || behind === 0) {
                  core.setFailed(behind === 0
                    ? `#${pr.number}: workflow-file 403 although the head already contains main (the reading is falsified); merge withheld`
                    : `#${pr.number}: workflow-file 403 and the head could not be compared with main; merge withheld`);
                  continue;
                }
                // ラベルは PR の側に届くただ1つの合図。付けられなければ、前と同じく run を落として知らせる。
                try {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: pr.number, labels: ['needs-main-sync'],
                  });
                } catch {
                  core.setFailed(`#${pr.number}: workflow-file 403 (main sync needed) and the label could not be added; merge withheld`);
                  continue;
                }
                try {
                  await core.summary.addHeading('ワークフローを変える PR は main の取り込み待ち')
                    .addRaw(`#${pr.number} と main が同じ .github/workflows/ のファイルを変えていて、GitHub が GITHUB_TOKEN での`
                      + `マージを拒んだ。main を取り込んで push し直すと、次の検証の後に自動マージされる。`
                      + `head が main を全部含んでもなお 403 なら、この読みは外れている（CLAUDE.md の反証条件）。\n`).write();
                } catch {
                  core.info('ジョブサマリを書けなかった（判定には影響しない）');
                }
                core.notice(`#${pr.number} はワークフローのファイルを main と両方で変えているため自動マージしない（main を取り込んで push し直す）`);
                continue;
              }
              mergedCount++;
              // merged.sha は main に積まれた squash コミット。後続の IndexNow
              // 通知ステップがこの SHA を checkout して首親差分を通知する。
              core.setOutput('merged_sha', merged.sha);
              core.notice(`#${pr.number} を ${validatedSha.slice(0, 7)} でマージした`);
              if (pr.labels?.some(label => label?.name === 'needs-main-sync')) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: 'needs-main-sync' });
                } catch {
                  core.info(`#${pr.number}: needs-main-sync を外せなかった（マージには影響しない）`);
                }
              }
            }
            core.setOutput('merged_count', String(mergedCount));

      # GITHUB_TOKEN によるマージ push はワークフローを発火させない（GitHub の
      # 再帰防止仕様）ため、seo-check.yml の「main push で IndexNow 通知」は
      # auto-merge 経由のデプロイでは一度も走らない。マージを実行したこの run が
      # 通知まで責任を持つ。通知の失敗はマージ結果に影響させない。
      - name: Checkout merged commit
        if: steps.merge.outputs.merged_count != '0' && steps.merge.outputs.merged_count != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.merge.outputs.merged_sha }}
          persist-credentials: false
          fetch-depth: 10

      - name: Setup Node
        if: steps.merge.outputs.merged_count != '0' && steps.merge.outputs.merged_count != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: IndexNow notify (merged diff)
        if: steps.merge.outputs.merged_count != '0' && steps.merge.outputs.merged_count != ''
        continue-on-error: true
        run: node scripts/indexnow-notify.js --since ${{ steps.merge.outputs.merged_count }}

  # 承認待ちにした自律運転の PR を、オーナーの承認の後にだけマージする（2026-10-20 オーナー判断）。
  # Environment autopilot-approval（Required reviewers: simplememofast）は 2026-10-20 にオーナーが作成済み。
  # GitHub は参照された Environment が無いと保護なしで作るので、ここで保護を API で確かめ、
  # 無ければマージしない。承認されたら、検証済みの SHA・ファイル一覧・名義を確かめ直し、
  # JST の日付が検証の日と同じときだけ、通常の経路と同じ squash でマージする。
  merge-after-approval:
    needs: auto-merge
    if: needs.auto-merge.outputs.approval_pr != ''
    runs-on: ubuntu-latest
    environment: autopilot-approval
    permissions:
      contents: write
      pull-requests: write
      actions: read   # Environment の保護ルールを読む（GET /environments）。write は与えない
    # 新しい検証が来たら、古い承認待ちは取り消す（同じ PR に承認待ちは1つ）。
    concurrency:
      group: autopilot-approval-${{ needs.auto-merge.outputs.approval_pr }}
      cancel-in-progress: true
    outputs:
      merged_sha: ${{ steps.merge.outputs.merged_sha }}
    steps:
      - name: Checkout the trusted merge guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Merge the approved Autopilot PR
        id: merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APPROVAL_PR: ${{ needs.auto-merge.outputs.approval_pr }}
          APPROVAL_SHA: ${{ needs.auto-merge.outputs.approval_sha }}
          APPROVAL_FILES: ${{ needs.auto-merge.outputs.approval_files }}
          VALIDATED_AT: ${{ needs.auto-merge.outputs.validated_at }}
        with:
          script: |
            const {
              approvedMergeOwner, completeCommitList, findUnapprovedPrincipals,
            } = require(`${process.env.GITHUB_WORKSPACE}/scripts/merge-identity-check.js`);
            const policy = await import(`${process.env.GITHUB_WORKSPACE}/scripts/autopilot-approval-check.mjs`);
            const run = context.payload.workflow_run;
            const branch = run.head_branch || '';
            const { owner, repo } = context.repo;
            const refuse = async code => {
              core.setFailed(`Autopilot approval: ${code}; not merged`);
              try {
                await core.summary.addHeading('Autopilot PR: 承認の後もマージしなかった')
                  .addRaw(policy.refusalSummary(code)).write();
              } catch {
                core.info('ジョブサマリを書けなかった');
              }
            };

            // 承認に意味があるのは、Environment の required reviewer にオーナーがいるときだけ。
            let environment = null;
            try {
              ({ data: environment } = await github.request('GET /repos/{owner}/{repo}/environments/{environment_name}', {
                owner, repo, environment_name: policy.APPROVAL_ENVIRONMENT,
              }));
            } catch {
              environment = null;
            }
            const protection = policy.environmentProtection(environment);
            if (!protection.ok) return refuse(protection.reason);

            const input = policy.approvalInput(process.env);
            if (!input.ok) return refuse('invalid_input');
            if (!policy.isAutopilotBranch(branch)) return refuse('not_autopilot_branch');

            // sitemap の lastmod は squash コミットの JST 日付。日をまたいだら作り直しが要る。
            if (!policy.sameJstDay(input.validatedAt, new Date()).ok) return refuse('jst_day_changed');

            // 検証した PR のままかを、今の状態で確かめ直す。
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: input.pr });
            if (pr.state !== 'open' || pr.draft || pr.base?.ref !== 'main'
              || pr.head?.repo?.full_name !== `${owner}/${repo}` || pr.head?.ref !== branch
              || pr.head?.sha !== input.sha) {
              return refuse('pr_changed');
            }
            const openerLogin = pr.user?.login;
            if (openerLogin !== 'simplememofast') return refuse('unapproved_opener');
            const { data: openerProfile } = await github.rest.users.getByUsername({ username: openerLogin });
            if (!approvedMergeOwner(openerLogin, openerProfile)) return refuse('unapproved_opener');
            if (!Number.isInteger(pr.commits) || pr.commits < 1 || pr.commits > 250) return refuse('commit_identity');
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            if (!completeCommitList(pr.commits, commits) || findUnapprovedPrincipals(commits).length) {
              return refuse('commit_identity');
            }
            if (!Number.isInteger(pr.changed_files) || pr.changed_files < 1 || pr.changed_files > policy.MAX_LISTED_FILES) {
              return refuse('file_list_changed');
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            if (files.length !== pr.changed_files || policy.fileListHash(files) !== input.files) {
              return refuse('file_list_changed');
            }

            const { data: merged } = await github.rest.pulls.merge({
              owner, repo,
              pull_number: pr.number,
              merge_method: 'squash',
              sha: input.sha,
              // Same message as the normal path: no unverified PR or commit prose.
              commit_title: `Merge validated PR #${pr.number}`,
              commit_message: `Source PR: https://github.com/${owner}/${repo}/pull/${pr.number}\nValidated head: ${input.sha}`,
            });
            core.setOutput('merged_sha', merged.sha);
            core.notice(`#${pr.number} をオーナーの承認の後に ${input.sha.slice(0, 7)} でマージした`);

  # 通常の経路と同じく、マージした run が IndexNow 通知まで行う（失敗はマージに影響させない）。
  # マージした tree のスクリプトを動かすので、書き込み権限のあるジョブとは別のランナーで、
  # 読み取りだけのトークンで動かす。
  indexnow-after-approval:
    needs: merge-after-approval
    if: needs.merge-after-approval.outputs.merged_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.merge-after-approval.outputs.merged_sha }}
          persist-credentials: false
          fetch-depth: 10

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: IndexNow notify (merged diff)
        continue-on-error: true
        run: node scripts/indexnow-notify.js --since 1
