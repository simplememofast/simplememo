name: Homepage Section Rendering
on:
  pull_request:
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'assets/css/**'
      - 'scripts/perf/section*.mjs'
      - '.github/workflows/home-sections.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'assets/css/**'
      - 'scripts/perf/section*.mjs'
      - '.github/workflows/home-sections.yml'
permissions:
  contents: read
concurrency:
  group: home-sections-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  section-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install pinned functional browser tools
        timeout-minutes: 4
        run: |
          # The Azure mirror can trickle forever without an inactivity timeout.
          # Keep the runner's existing official HTTPS fallbacks and APT trust.
          grep -qE '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' /etc/apt/apt-mirrors.txt
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          if grep -qF 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt; then exit 1; fi
          # Bound stalled mirrors, including apt invoked by Playwright via sudo.
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null <<'APT'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "2";
          APT::Update::Error-Mode "any";
          APT
          npm install --prefix "$RUNNER_TEMP/tools" --no-save playwright@1.55.0
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Prepare identical-content rendering control
        run: |
          node --test candidate/scripts/perf/section*.test.mjs
          node candidate/scripts/perf/section_control.mjs candidate "$RUNNER_TEMP/section-control"
      - name: Compare native screen, anchor, focus and print behavior
        env:
          QA_BROWSER: ${{ matrix.browser }}
          QA_RESULTS: ${{ runner.temp }}/section-results
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node candidate/scripts/perf/sections_browser.mjs "$RUNNER_TEMP/section-control" candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: section-rendering-${{ matrix.browser }}
          path: ${{ runner.temp }}/section-results/
          retention-days: 14
          if-no-files-found: error
