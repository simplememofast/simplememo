name: Homepage Asset Cache Verification
on:
  pull_request:
    paths:
      - 'functions/assets/home-perf/**'
      - 'scripts/perf/cache_headers*'
      - 'assets/home-perf/manifest.json'
      - '.github/workflows/home-perf-cache.yml'
  push:
    branches: [main, claude/pagespeed-asset-cache-20260917]
    paths:
      - 'functions/assets/home-perf/**'
      - 'scripts/perf/cache_headers*'
      - 'assets/home-perf/manifest.json'
      - '.github/workflows/home-perf-cache.yml'
permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: read
concurrency:
  group: asset-cache-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Scope privacy response and inventory regressions
        run: node --test scripts/perf/cache_headers*.test.mjs scripts/perf/cache_access*.test.cjs

  cache-contract:
    needs: candidate-regressions
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require successful candidate regressions
        env:
          CANDIDATE_RESULT: ${{ needs.candidate-regressions.result }}
        run: test "$CANDIDATE_RESULT" = success
      # This fresh runner has never executed candidate code. Resolve main once,
      # check out its immutable SHA, then bind the consumer to the measured HEAD.
      - name: Resolve trusted main verifier
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 2139
        id: trusted
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            try {
              const { status, data } = await github.rest.repos.getBranch({
                owner: 'simplememofast', repo: 'simplememo', branch: 'main',
                request: { timeout: 10000 },
              });
              const sha = data?.commit?.sha;
              if (status !== 200 || data.name !== 'main' || typeof sha !== 'string'
                  || sha.length !== 40 || !/^[a-f0-9]{40}$/.test(sha)) throw new Error();
              core.setOutput('sha', sha);
            } catch { core.setFailed('TRUSTED_MAIN_RESOLUTION_FAILED'); }
      - name: Checkout trusted main verifier
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 2139
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - name: Checkout public cache target
        if: github.event_name != 'pull_request' || github.event.pull_request.number != 2139
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Record verifier checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 2139
        id: checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify approved preview proof
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 2139
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          TRUSTED_CHECKOUT_SHA: ${{ steps.checkout.outputs.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { verifyPublishedProof } = require('./scripts/perf/cache_access_consumer.cjs');
            try {
              const receipt = await verifyPublishedProof({ github,
                headSha: context.payload.pull_request.head.sha,
                checkoutSha: process.env.TRUSTED_CHECKOUT_SHA, now: Date.now });
              const output = path.join(process.env.RUNNER_TEMP, 'cache-results');
              fs.mkdirSync(output, { recursive: true });
              fs.writeFileSync(path.join(output, 'approved-cache-proof.json'), JSON.stringify(receipt, null, 2) + '\n');
              core.info(JSON.stringify(receipt));
              if (receipt.verified !== true) core.setFailed('Exact reviewed preview has no complete successful cache proof');
            } catch { core.setFailed('Approved preview proof could not be verified'); }
      - name: Resolve the exact successful deployment
        if: github.event_name != 'pull_request' || github.event.pull_request.number != 2139
        id: deployment
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha || context.sha;
            const production = context.eventName === 'push' && context.ref === 'refs/heads/main';
            for (let i = 0; i < 30; i++) {
              const {data} = await github.rest.checks.listForRef({...context.repo, ref: sha, per_page: 100, filter: 'all'});
              const run = data.check_runs.find(r => r.name === 'Cloudflare Pages' && r.head_sha === sha && r.conclusion === 'success');
              const url = run?.output?.summary?.match(/https:\/\/[a-z0-9-]+\.simplememo-596\.pages\.dev/);
              if (url) { core.setOutput('origin', production ? 'https://simplememofast.com' : url[0]); return; }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('No successful exact-SHA Cloudflare deployment; do not test an old revision.');
      - name: Install pinned browser client
        if: github.event_name != 'pull_request' || github.event.pull_request.number != 2139
        run: |
          mkdir -p "$RUNNER_TEMP/cache-results"
          npm install --prefix "$RUNNER_TEMP/perf-tools" --no-save playwright@1.55.0
      - name: Verify real response bodies and cache policies
        if: github.event_name != 'pull_request' || github.event.pull_request.number != 2139
        env:
          NODE_PATH: ${{ runner.temp }}/perf-tools/node_modules
          PERF_RESULTS: ${{ runner.temp }}/cache-results
          PERF_ORIGIN: ${{ steps.deployment.outputs.origin }}
        run: node scripts/perf/cache_headers.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: homepage-asset-cache-proof
          path: ${{ runner.temp }}/cache-results/
          retention-days: 14
          if-no-files-found: warn
