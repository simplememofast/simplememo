name: Homepage Asset Cache Verification
# Production only (since 2026-11-12). This run measures the real edge after deployment:
# asset bytes and hashes, Cache-Control, the 404 policy and bodyless 304 responses.
# - Before merge, the same contract is checked offline inside SEO Validation
#   (scripts/cache-contract.test.mjs). Pages previews sit behind Cloudflare Access
#   since 2026-10-20 and CI holds no credentials for them, so PRs no longer fetch a preview.
# - Auto-merge merges with GITHUB_TOKEN, which starts no push run. The daily schedule
#   is therefore the main watch; Cron Health turns a failed scheduled run into an issue.
on:
  schedule:
    - cron: '41 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_headers'
      - 'functions/**'
      - 'assets/home-perf/**'
      - 'scripts/perf/cache_headers*'
      - '.github/workflows/home-perf-cache.yml'
permissions:
  contents: read
  checks: read
concurrency:
  group: asset-cache-production
  cancel-in-progress: false
jobs:
  production-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      # A push run measures production only after this exact commit is live there.
      - name: Wait for this commit's successful production deployment
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (let i = 0; i < 60; i++) {
              const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: context.sha, per_page: 100, filter: 'latest' });
              const run = data.check_runs.find(r => r.name === 'Cloudflare Pages' && r.head_sha === context.sha);
              if (run?.status === 'completed') {
                if (run.conclusion === 'success') return;
                throw new Error('Cloudflare Pages did not deploy this commit: ' + run.conclusion);
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('No completed Cloudflare Pages deployment for this commit; do not measure an older revision.');
      - name: Install pinned browser client
        run: |
          mkdir -p "$RUNNER_TEMP/cache-results"
          npm install --prefix "$RUNNER_TEMP/perf-tools" --no-save playwright@1.55.0
      # One delayed retry: right after a deployment the edge can still answer with the
      # previous policy for a few minutes (#1434). A real regression fails both attempts.
      - name: Verify production response bodies and cache policies
        env:
          NODE_PATH: ${{ runner.temp }}/perf-tools/node_modules
          PERF_RESULTS: ${{ runner.temp }}/cache-results
          PERF_ORIGIN: https://simplememofast.com
        run: node scripts/perf/cache_headers.cjs || { sleep 300; node scripts/perf/cache_headers.cjs; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: homepage-asset-cache-proof
          path: ${{ runner.temp }}/cache-results/
          retention-days: 14
          if-no-files-found: warn
