name: Prepare Reviewed Hero Density
on:
  push:
    branches: [claude/pagespeed-hero-density-20260918]
    paths: [.github/workflows/prepare-hero-density.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  prepare:
    if: github.repository == 'simplememofast/simplememo' && github.ref == 'refs/heads/claude/pagespeed-hero-density-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the exact isolated preparation history
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = a33f6b7230dc46628f4e5f34c25e5524e60073cd
          python - <<'PY'
          import subprocess
          files=set(subprocess.check_output(['git','diff','--name-only','2c25e4b5fc4f3395cdc7c16e27a23868510b59e3','HEAD'],text=True).splitlines())
          assert files=={'.github/workflows/prepare-hero-density.yml','scripts/perf/prepare_density_once.py','scripts/perf/reconcile_density_counters.mjs'},files
          PY
      - name: Reproduce assets and reconcile only known historical outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check fonttools==4.63.0 brotli==1.2.0 Pillow==12.3.0
          node --check scripts/perf/reconcile_density_counters.mjs
          python - <<'PY'
          import os,pathlib
          text=pathlib.Path('scripts/perf/prepare_density_once.py').read_text()
          target="run('node','scripts/check-autopilot-page.mjs','--check')"
          assert text.count(target)==1
          text=text.replace(target,"run('node','scripts/perf/reconcile_density_counters.mjs')\n"+target)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'prepare_density_once.py').write_text(text)
          PY
          python "$RUNNER_TEMP/prepare_density_once.py"
          python scripts/perf/verify_home.py --selftest
          python scripts/perf/verify_home.py
          node --test scripts/perf/inline_styles.test.mjs scripts/perf/verify_production.test.cjs scripts/perf/browser_checks.test.cjs scripts/perf/cache_headers*.test.mjs scripts/perf/section*.test.mjs
          python scripts/perf/test_summarize.py
      - name: Publish only the bounded candidate to the same unmerged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/density-prepared"
          python - <<'PY'
          import os,pathlib,subprocess,tarfile
          allowed={'assets/home-perf/manifest.json','assets/home-perf/voice-airpods-pro-bright-1536-1200-c83d10d4e8a0.avif','autopilot/index.html','data/autopilot-runs.json','data/autopilot-status.json','en/index.html','index.html','scripts/perf/browser_checks.cjs','scripts/perf/browser_checks.test.cjs','scripts/perf/build_home.py','docs/perf/pagespeed-reconciliation-20260918.json','docs/perf/hero-density-20260918.json','sitemap-ja.xml','sitemap-en.xml','sitemap.xml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed|untracked==allowed,(changed,untracked,allowed)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','rm','scripts/perf/prepare_density_once.py','scripts/perf/reconcile_density_counters.mjs'],check=True)
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'density-prepared'
          (output/'allowed-files.txt').write_text('\n'.join(sorted(allowed))+'\n')
          with tarfile.open(output/'prepared-files.tar.gz','w:gz') as archive:
              for name in sorted(allowed): archive.add(name,arcname=name)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: add precisely sized hero source and preserve verified historical outcomes'
          git rev-parse HEAD > "$RUNNER_TEMP/density-prepared/commit.txt"
          git diff --binary 2c25e4b5fc4f3395cdc7c16e27a23868510b59e3 HEAD -- . ':!.github/workflows/prepare-hero-density.yml' > "$RUNNER_TEMP/density-prepared/review.patch"
          git ls-tree -r HEAD > "$RUNNER_TEMP/density-prepared/tree.txt"
          sha256sum "$RUNNER_TEMP/density-prepared/prepared-files.tar.gz" > "$RUNNER_TEMP/density-prepared/prepared-files.sha256"
          test "$(git ls-remote origin refs/heads/claude/pagespeed-hero-density-20260918 | cut -f1)" = "$GITHUB_SHA"
          cat > "$RUNNER_TEMP/density-askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/density-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/density-askpass.sh" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/claude/pagespeed-hero-density-20260918
          rm "$RUNNER_TEMP/density-askpass.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-density-candidate
          path: ${{ runner.temp }}/density-prepared/
          retention-days: 7
          if-no-files-found: warn
