name: SEO Validation

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO validation
        run: |
          EXIT_CODE=0
          node scripts/seo-check.js || EXIT_CODE=$?
          # Exit code 1 = warnings only (acceptable), 2 = errors (fail CI)
          if [ $EXIT_CODE -ge 2 ]; then exit $EXIT_CODE; fi

      # Every URL shape GSC has reported must resolve in exactly one hop, and
      # no `X.html` may gain a sibling directory `X/` (which would make the
      # middleware's extension stripping ambiguous).
      # Cache-busting queries are derived from a hash of the file, so changing
      # an asset without changing its query is a hard failure. That combination
      # shipped once (2026-08-10): the markup went live while the CDN and
      # browsers kept serving the previous stylesheet, so none of the new rules
      # applied and nothing reported an error.
      #
      # Extended to /js/* on 2026-08-11, which immediately found the same bug
      # already live: js/lang.js was last changed 2026-07-10 while its query
      # still read ?v=20260529-titlefix, and _headers serves /*.js as
      # immutable/max-age=604800 — so returning visitors had been holding a
      # month-old lang.js. Only CSS was covered, so nothing could report it.
      - name: Cache-busters match asset contents (CSS + JS)
        run: node scripts/check-css-version.mjs

      - name: URL normalization rules
        run: node scripts/check-url-normalization.mjs

      # Internal links must point at a direct 200 — never at a redirect, a
      # 404, or a bare mailto: that Cloudflare rewrites into
      # /cdn-cgi/l/email-protection.
      - name: Internal links resolve directly
        run: node scripts/check-internal-redirects.mjs

      # Rating / price / © / og:site_name must match data/site-constants.json
      - name: Site constants consistency
        run: node scripts/sync_constants.js --check

      # Every App Store CTA must carry placement/cluster/variant metadata. A new
      # page copied from an old template would otherwise silently reintroduce
      # unmeasurable CTAs, which is the state this replaced.
      - name: CTA placement metadata
        run: node scripts/tag-cta-placements.js --check

      # An experiment whose evaluation date has passed must not go unnoticed.
      # Deliberately NOT blocking: a green run here is what lets auto-merge
      # ship to production, so failing on an unevaluated retitle would also
      # block unrelated fixes and pressure someone into rubber-stamping a
      # decision to unblock a deploy. It annotates the PR and writes a job
      # summary instead. A *malformed* ledger still exits non-zero, because an
      # unparseable entry can never come due and would disable this check.
      - name: Experiment evaluation dates
        run: node growth/scripts/check-experiments.mjs

      # Smoke test only (--dry-run writes nothing). Note: the shallow CI
      # checkout means git-derived lastmod dates collapse to one date here;
      # real sitemap generation happens locally with full history.
      - name: Generate sitemap (dry run)
        run: python3 scripts/generate_sitemap.py --dry-run

      - name: IndexNow notification (on main push only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: node scripts/indexnow-notify.js --since 1
        continue-on-error: true
