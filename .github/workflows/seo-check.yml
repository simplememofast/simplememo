name: SEO Validation

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 2 — IndexNow 通知が HEAD~1..HEAD の first-parent 差分で
      # 対象を決めるため、親コミットまで必要（既定の depth=1 だと HEAD~1 が無く
      # git diff が失敗する）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO validation
        run: |
          EXIT_CODE=0
          node scripts/seo-check.js || EXIT_CODE=$?
          # Exit code 1 = warnings only (acceptable), 2 = errors (fail CI)
          if [ $EXIT_CODE -ge 2 ]; then exit $EXIT_CODE; fi

      # Every URL shape GSC has reported must resolve in exactly one hop, and
      # no `X.html` may gain a sibling directory `X/` (which would make the
      # middleware's extension stripping ambiguous).
      # Cache-busting queries are derived from a hash of the file, so changing
      # an asset without changing its query is a hard failure. That combination
      # shipped once (2026-08-10): the markup went live while the CDN and
      # browsers kept serving the previous stylesheet, so none of the new rules
      # applied and nothing reported an error.
      #
      # Extended to /js/* on 2026-08-11, which immediately found the same bug
      # already live: js/lang.js was last changed 2026-07-10 while its query
      # still read ?v=20260529-titlefix, and _headers serves /*.js as
      # immutable/max-age=604800 — so returning visitors had been holding a
      # month-old lang.js. Only CSS was covered, so nothing could report it.
      - name: Cache-busters match asset contents (CSS + JS)
        run: node scripts/check-css-version.mjs

      # Report-only, and it stays that way until a measurement run resolves the
      # backlog. The site publishes four competitor speed tables that disagree,
      # and no CI job can decide which is right — only an iPhone can. Failing
      # the build on that would block unrelated work on a question the build
      # cannot answer. What this does buy: the drift is now visible on every
      # run instead of surfacing years later inside a comparison article that
      # rated every rival faster than us and still called us the fastest.
      - name: Competitor speed figures vs data/benchmark.json (report-only)
        run: node scripts/check-benchmark.mjs

      # seo-check.js は title/description/canonical を正規表現で読むので、
      # 閉じていない <script> の内側に落ちたそれらも「有る」と判定してしまう。
      # 2026-08-13 に実際そうなった: 新記事の head を既存記事から切り出した際に
      # </script> を取りこぼし、title/description/canonical/og/BlogPosting が
      # まるごとスクリプト本文に飲まれた状態で12ゲート全部が緑になり、本番へ出た。
      # スクリーンショットでも崩れない（body は正常に描画される）。
      - name: Script tags are closed
        run: node scripts/check-script-tags.mjs

      - name: URL normalization rules
        run: node scripts/check-url-normalization.mjs

      # Internal links must point at a direct 200 — never at a redirect, a
      # 404, or a bare mailto: that Cloudflare rewrites into
      # /cdn-cgi/l/email-protection.
      - name: Internal links resolve directly
        run: node scripts/check-internal-redirects.mjs

      # data/content-graph.json（Parent/Sibling/NextStepの台帳）が実在ページと
      # growth側のBUSINESS_RELEVANCEに整合しているか。/obsidian/ 配下は登録必須。
      # 台帳が現実からズレた瞬間に落とす — 「更新されない記録」を作らないための門。
      - name: Content graph integrity
        run: node scripts/check-content-graph.mjs

      # Rating / price / © / og:site_name must match data/site-constants.json
      - name: Site constants consistency
        run: node scripts/sync_constants.js --check

      # Every App Store CTA must carry placement/cluster/variant metadata. A new
      # page copied from an old template would otherwise silently reintroduce
      # unmeasurable CTAs, which is the state this replaced.
      - name: CTA placement metadata
        run: node scripts/tag-cta-placements.js --check

      # App Store CTA hrefs must match the CPP wiring table (data/cpp-map.json):
      # a wired page carries exactly the mapped ppid, an unwired page carries
      # none. Null ppids in the map are pending owner input and only notice.
      - name: CPP ppid wiring matches data/cpp-map.json
        run: node scripts/apply-cpp-ppid.js --check

      # 163 pages are still dual-DOM (both languages at one URL, toggled by
      # js/lang.js, defaulting to ja). No page under /en/ loads lang.js, so
      # without this seed an English reader following any link into one of
      # them lands in Japanese — which is how it behaved until 2026-08-13.
      # A new /en/ page copied from a template would silently reintroduce it.
      - name: /en/ pages seed the reader's locale
        run: python3 scripts/inject_locale_seed.py --check

      # An experiment whose evaluation date has passed must not go unnoticed.
      # Deliberately NOT blocking: a green run here is what lets auto-merge
      # ship to production, so failing on an unevaluated retitle would also
      # block unrelated fixes and pressure someone into rubber-stamping a
      # decision to unblock a deploy. It annotates the PR and writes a job
      # summary instead. A *malformed* ledger still exits non-zero, because an
      # unparseable entry can never come due and would disable this check.
      - name: Experiment evaluation dates
        run: node growth/scripts/check-experiments.mjs

      # 【予算】台帳の形と、当月が上限に達していないかを見る。
      #
      # 主系ワークフローの予算ゲートと同じスクリプトを使う。ここで落ちるのは
      # 実質「台帳が壊れている」ときだけ（上限超過の日は主系がそもそも走らない）
      # だが、壊れた台帳は「集計できない」ではなく **上限に永久に当たらない**
      # ＝安全装置の停止を意味するので、PRの時点で止める。
      - name: Autopilot budget ledger
        run: node scripts/autopilot-budget.mjs --check

      # 【PR原稿の事実検査】古い事実と誇大表現を機械が落とす。
      #
      # 2026-08-22、2026-06の原稿を雛形にした新しい原稿が3件の古い事実を
      # そのまま引き継いだ（旧アプリ名・起動時間・**廃止済みの無料トライアル**）。
      # 人が読み直して初めて見つかった。3件目は廃止そのものが景表法・ストア審査
      # 上のリスク対応だったので、書けば一度消したリスクを外向きに作り直す。
      # **人の読み直しに依存している限り、次も同じことが起きる。**
      #
      # 正は data/site-constants.json と data/benchmark.json。値が変われば
      # 検査も自動で追随する（スクリプトに数値を直書きしない）。
      # docs/pr-*.md は draft / internal / archived のどれかを宣言する。
      # 未宣言は落とす — 暗黙のファイル名規則にすると新しい原稿が黙って外れる。
      - name: PR draft facts
        run: node scripts/check-pr-facts.mjs --check

      # 【切替演習】バックアップ経路が本当に引き継ぐかを、実行で確かめる。
      #
      # 主系は11回のうち一度も出荷しておらず、日々の出荷は副系が担っている。
      # つまり切替は常態なのに、**正しく起きることを確かめたことは一度も無かった。**
      # 観測（誰が出荷したか）と検証（正しく引き継ぐか）は別物で、
      # 「結果として動いていた」は「壊れていない」の証明にならない。
      #
      # 予算の非対称性（上限到達で主系は止まるが副系は止まらない）も
      # シナリオとして固定してある。既知の仕様なので、いつのまにか
      # 変わっていたら落ちる。
      - name: Failover drill
        run: node scripts/autopilot-drill.mjs --check

      # 【自動化カバレッジ】全領域の自動化率台帳の形と証跡を見る。
      #
      # ここが緩むと台帳が自己申告になり、「やっていることにする」だけで
      # 数字が上がるようになる。だから ai_autonomous / ai_executes_gated は
      # 証跡ファイルの実在を強制し、nobody は「なぜ無いか」を強制する。
      # 理由の無い未実装は、次の棚卸しで拾えない。
      - name: Automation coverage ledger
        run: node scripts/automation-rate.mjs --check

      # 【自己修復の境界】レーンFが越えてはいけない線が壊れていないかを見る。
      #
      # repair_of の指す run が実在するか、失敗行に failure_class があるか、
      # may_modify が承認制領域を含んでいないか、停止条件があるか。
      # 未修理の故障が残っていること自体では落とさない（それは運用の話であって、
      # PRを止める理由ではない）。
      - name: Self-repair boundary
        run: node scripts/autopilot-selfheal.mjs --check

      # 【権限表】不可逆な領域が承認制になっているか、根拠のファイルが実在するかを見る。
      #
      # 機械が守れる部分だけ機械に守らせる。実際に人が承認したかは見られないので、
      # 見るのは (1) 不可逆なのに承認不要になっていないか (2) 稼働中の領域が
      # 根拠ファイルを指せているか (3) 金額が動く領域が上限を持っているか の3つ。
      # 「空欄」と「未設定と決めた」は違うので、後者は set_by: "unset" と書かせる。
      - name: Authority matrix
        run: node scripts/check-authority.mjs --check

      # 【運転台帳】共通実行IDの一意性と、attempted／outcome の整合を見る。
      #
      # 壊れた台帳は「集計できない」ではなく **指標が黙って嘘になる**。
      # とくに attempted と outcome の食い違い（Gateスキップなのに着手扱い等）は
      # AI完走率を静かにずらすので、PRの時点で止める。
      # 「shipped なのに PR番号が無い」「failed なのに理由が無い」も同様に落とす —
      # 検算できない出荷と、原因の無い失敗は、指標として存在しないのと同じ。
      - name: Autopilot run ledger
        run: node scripts/autopilot-runs.mjs --check

      # 【機能バックログ】計測の結果が次に作るものを決めているか。
      #
      # 確信度は evidence_strength から機械的に決まる（手で置けない）。
      # ここを主観にすると順位はいくらでも動かせるので台帳の意味が消える。
      # リスクは点数を下げるのではなく承認を要求する — 掛け算にすると
      # **期待効果が大きければ危険な案が1位になる**。
      - name: Feature backlog
        run: node scripts/feature-score.mjs --check

      # 【主張】プレスリリースの見出し・リード文を実装台帳に当てる。
      #
      # 原稿は実装より速く動く。リード文に「AIが一気通貫で循環」と書いた後で
      # 台帳の該当タスクが未実装のままだと、**配信当日まで誰も気づかない**。
      #
      # 支持率が低いことでは落とさない — それは「まだ書けない」であって
      # 「壊れている」ではない。落とすのは参照が解決できないとき
      # （＝原稿と台帳のどちらかが古い）。赤い行を黙って消す道具にしない。
      - name: PR claims vs ledger
        run: node scripts/check-pr-claims.mjs --check

      # 【期限】資格情報・証明書が切れる前に気づく。
      #
      # これが無い間は **切れた日に初めて分かる** 状態だった。証明書と
      # Provisioning Profile は年1で切れ、切れるとリリースが一切できなくなる。
      #
      # 実行環境が中間者復号していると TLS の実測はプロキシの証明書を読む。
      # 発行元が信用集合に無ければ期限を報告せず unverifiable にする
      # （scripts/compute_spki_pins.sh が警告している罠と同じもの）。
      #
      # いまは fail_days を切ったときだけ落ちる。critical の未把握で落とすには
      # 日付を埋めてから policy.enforce_unknown を true にする。
      - name: Credential expiry
        run: |
          node scripts/check-expiry.mjs --selftest
          node scripts/check-expiry.mjs --check --no-net

      # 【D-SCORE】pr_release レコードの算数とゲートの矛盾を見る。
      #
      # 採点そのものは人（かセッション）が根拠つきで置く。ここが自動で点を
      # 出し始めると、点を取るための見出しを機械が書くようになり、G2 が
      # 防いでいるはずの「煽り語で点を稼ぐ」に自分から突っ込む。
      # 機械が持つのは算数とゲートだけ:
      #   - 各軸の合計と total のズレ（手で足した数字は検算されない）
      #   - 満点超過
      #   - status が running/evaluated なのにゲートが未判定・不合格
      #   - 合格ライン60未満のまま running
      # どれも「配信してから気づく」と取り返しがつかない。
      - name: PR release D-SCORE consistency
        run: node growth/scripts/d-score.mjs --check

      # BigQuery の資格情報まわり。ネットワークにもGCPにも触らない
      # （token エンドポイントは fetch を差し替えて潰してある）ので、
      # 鍵の無いCIでも走る。ここが壊れると毎日の測定が丸ごと止まるが、
      # 止まったことは「数字が小さい」という形でしか現れないため、
      # 実際に一度、OAuthログイン済みの資格情報が「資格情報が無い」として
      # 拒否される状態で2日間気づかれずに走っていた。
      - name: BigQuery credential handling
        run: node growth/lib/bigquery.test.mjs

      # Smoke test only (--dry-run writes nothing). Note: the shallow CI
      # checkout means git-derived lastmod dates collapse to one date here;
      # real sitemap generation happens locally with full history.
      # --dry-run は件数を表示するだけでコミット済みのファイルを見ないため、
      # generate_sitemap.py の実行を忘れたPRを一度も止められなかった（2026-08-22）。
      # --check はURLの集合を突き合わせ、新しいページが sitemap に載っていなければ落ちる。
      - name: Sitemap lists every page (stale sitemap fails)
        run: python3 scripts/generate_sitemap.py --check

      # --since 1 = HEAD~1..HEAD（マージは首親差分）で実際に変わった .html だけを
      # 通知する。以前は mtime 判定で、新規 checkout では全ファイルが「更新済み」に
      # 見えるため main push のたびに全ページ通知になっていた。内訳と送信結果は
      # ジョブサマリに出る。複数コミットの直接 push は最後の1コミット分のみに
      # なるので、必要なら手動で --since N を実行する。
      #
      # このステップが動くのは main への「直接 push」だけ。auto-merge の
      # マージ push は GITHUB_TOKEN 起因でワークフローを発火させないため、
      # そちらの通知は auto-merge.yml のマージ後ステップが行う。
      - name: IndexNow notification (on main push only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: node scripts/indexnow-notify.js --since 1
        continue-on-error: true
