name: SEO Validation

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 2 — IndexNow 通知が HEAD~1..HEAD の first-parent 差分で
      # 対象を決めるため、親コミットまで必要（既定の depth=1 だと HEAD~1 が無く
      # git diff が失敗する）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO validation
        run: |
          EXIT_CODE=0
          node scripts/seo-check.js || EXIT_CODE=$?
          # Exit code 1 = warnings only (acceptable), 2 = errors (fail CI)
          if [ $EXIT_CODE -ge 2 ]; then exit $EXIT_CODE; fi

      # Every URL shape GSC has reported must resolve in exactly one hop, and
      # no `X.html` may gain a sibling directory `X/` (which would make the
      # middleware's extension stripping ambiguous).
      # Cache-busting queries are derived from a hash of the file, so changing
      # an asset without changing its query is a hard failure. That combination
      # shipped once (2026-08-10): the markup went live while the CDN and
      # browsers kept serving the previous stylesheet, so none of the new rules
      # applied and nothing reported an error.
      #
      # Extended to /js/* on 2026-08-11, which immediately found the same bug
      # already live: js/lang.js was last changed 2026-07-10 while its query
      # still read ?v=20260529-titlefix, and _headers serves /*.js as
      # immutable/max-age=604800 — so returning visitors had been holding a
      # month-old lang.js. Only CSS was covered, so nothing could report it.
      - name: Cache-busters match asset contents (CSS + JS)
        run: node scripts/check-css-version.mjs

      # Report-only, and it stays that way until a measurement run resolves the
      # backlog. The site publishes four competitor speed tables that disagree,
      # and no CI job can decide which is right — only an iPhone can. Failing
      # the build on that would block unrelated work on a question the build
      # cannot answer. What this does buy: the drift is now visible on every
      # run instead of surfacing years later inside a comparison article that
      # rated every rival faster than us and still called us the fastest.
      - name: Competitor speed figures vs data/benchmark.json (report-only)
        run: node scripts/check-benchmark.mjs

      # seo-check.js は title/description/canonical を正規表現で読むので、
      # 閉じていない <script> の内側に落ちたそれらも「有る」と判定してしまう。
      # 2026-08-13 に実際そうなった: 新記事の head を既存記事から切り出した際に
      # </script> を取りこぼし、title/description/canonical/og/BlogPosting が
      # まるごとスクリプト本文に飲まれた状態で12ゲート全部が緑になり、本番へ出た。
      # スクリーンショットでも崩れない（body は正常に描画される）。
      - name: Script tags are closed
        run: node scripts/check-script-tags.mjs

      - name: URL normalization rules
        run: node scripts/check-url-normalization.mjs

      # Internal links must point at a direct 200 — never at a redirect, a
      # 404, or a bare mailto: that Cloudflare rewrites into
      # /cdn-cgi/l/email-protection.
      - name: Internal links resolve directly
        run: node scripts/check-internal-redirects.mjs

      # data/content-graph.json（Parent/Sibling/NextStepの台帳）が実在ページと
      # growth側のBUSINESS_RELEVANCEに整合しているか。/obsidian/ 配下は登録必須。
      # 台帳が現実からズレた瞬間に落とす — 「更新されない記録」を作らないための門。
      - name: Content graph integrity
        run: node scripts/check-content-graph.mjs

      # Rating / price / © / og:site_name must match data/site-constants.json
      - name: Site constants consistency
        run: node scripts/sync_constants.js --check

      # 【公開表示の鮮度】評価と公開バージョンは、**JSON-LD の aggregateRating
      # として12ページに出ている公開表示**なのに、どちらも人が App Store Connect を
      # 見て手で書いた値だった。台帳のメモにも「NOT machine-verified」と書いてある。
      # つまり**古くなっても誰も気づかない。**
      #
      # ここはネットに触らない —— PRのたびに外部APIを叩くと、向こうの不調で
      # CIが赤くなり、やがて無視される（check-benchmark を報告のみにしたのと同じ理由）。
      # 見るのは「いつ確認したか」だけで、45日を超えたら落とす。
      # 実物との突き合わせは seo-daily.yml の --net。
      - name: Store facts freshness (no network)
        run: node scripts/check-store-facts.mjs --check

      # Every App Store CTA must carry placement/cluster/variant metadata. A new
      # page copied from an old template would otherwise silently reintroduce
      # unmeasurable CTAs, which is the state this replaced.
      - name: CTA placement metadata
        run: node scripts/tag-cta-placements.js --check

      # App Store CTA hrefs must match the CPP wiring table (data/cpp-map.json):
      # a wired page carries exactly the mapped ppid, an unwired page carries
      # none. Null ppids in the map are pending owner input and only notice.
      - name: CPP ppid wiring matches data/cpp-map.json
        run: node scripts/apply-cpp-ppid.js --check

      # 163 pages are still dual-DOM (both languages at one URL, toggled by
      # js/lang.js, defaulting to ja). No page under /en/ loads lang.js, so
      # without this seed an English reader following any link into one of
      # them lands in Japanese — which is how it behaved until 2026-08-13.
      # A new /en/ page copied from a template would silently reintroduce it.
      - name: /en/ pages seed the reader's locale
        run: python3 scripts/inject_locale_seed.py --check

      # 【DL意図 × 課金意図】**1つの数字がDLと課金の両方を表すのをやめる。**
      #
      # Premium が売っているのは機能ではなく送信回数の上限（Free 1日3通 → 無制限）。
      # だから課金するのは「毎日何度もキャプチャする人」だけで、
      # **「無料のメモアプリを探している人」をいくら集めてもそこは増えない。**
      #
      # 課金意図は**宣言**（手入力）である。ct= 別のインストール／課金は
      # このリポジトリに無い（公開なので分類列ごとの内訳を置かない方針で、
      # ASCの列も Source Type / Page Type までで Campaign が無い）。
      # だから**今日から反証できる実測を1つ持たせてある** —— クエリ文字列から数える
      # 「無料狙い」の割合。高く宣言した面がそこで無料狙いに寄っていたら、
      # --check が落ちる。
      #
      # ここで走らせるのは自己テストと --check の両方。--check が守るのは
      # 「宣言が実測に殴られていないこと」だけで、宣言の中身そのものは守らない
      # （守れない —— 実測が無い）。
      - name: Intent axes (DL vs monetization)
        run: |
          node growth/scripts/intent-axes.mjs --selftest
          node growth/scripts/intent-axes.mjs --check

      # 【獲得面ミックス】「SEOが伸びている」を、事業の言葉に割ったまま保つ。
      #
      # 総クリックだけを見ていると、情報記事だけが伸びている状態と獲得面が
      # 伸びている状態が同じ数字に見える。この道具は BUSINESS_RELEVANCE で
      # 面を3つに割り、**1日あたり**で比べる（窓の長さが揃わないため）。
      #
      # ここで走らせるのは自己テストだけで、レポートそのものは走らせない ——
      # 出力の中身はスナップショットで変わるので、PRごとの合否にできない。
      # 守っているのは計算のほう: 総数で比べていないこと、窓の長さが取れなければ
      # 「1日あたり」を勝手に作らないこと、そして**分類を差し替えると順位が
      # 入れ替わる場合に robust=false を返すこと。**
      # 最後の1つが効かなくなると、この道具は「どの面が伸びているか」を
      # 常に断言する装置になる —— 既定0.5のページがクリックの3割を占めたままで。
      - name: Acquisition mix decomposition (selftest)
        run: node growth/scripts/acquisition-mix.mjs --selftest

      # An experiment whose evaluation date has passed must not go unnoticed.
      # Deliberately NOT blocking: a green run here is what lets auto-merge
      # ship to production, so failing on an unevaluated retitle would also
      # block unrelated fixes and pressure someone into rubber-stamping a
      # decision to unblock a deploy. It annotates the PR and writes a job
      # summary instead. A *malformed* ledger still exits non-zero, because an
      # unparseable entry can never come due and would disable this check.
      - name: Experiment evaluation dates
        run: node growth/scripts/check-experiments.mjs

      # 【定点観測】言及・競合ウォッチを**やらなかった週に気づく。**
      #
      # 手順書には「週1回・前回が7日以上前なら実行する」と書いてあったが、
      # **その条件を誰も検査していなかった。**2026-08-22 に数えたら前回は
      # 08-12 で、10日空いていた。
      #
      # この種の作業はやらなくても何も壊れない。壊れないので後回しになり、
      # 後回しが続くと**やらないことが常態になる。**
      #
      # 固定クエリが欠けていても落とす —— 忙しい回に一部だけ検索して
      # 「やった」ことにすると、系列は連続しているのに中身が変わる。
      # あとから見ると「あの週から言及が減った」に見えるが、減ったのは検索のほう。
      - name: Mention watch cadence
        run: node growth/scripts/check-mentions.mjs --check

      # 【予算】台帳の形と、当月が上限に達していないかを見る。
      #
      # 主系ワークフローの予算ゲートと同じスクリプトを使う。ここで落ちるのは
      # 実質「台帳が壊れている」ときだけ（上限超過の日は主系がそもそも走らない）
      # だが、壊れた台帳は「集計できない」ではなく **上限に永久に当たらない**
      # ＝安全装置の停止を意味するので、PRの時点で止める。
      - name: Autopilot budget ledger
        run: node scripts/autopilot-budget.mjs --check

      # 【採用1件あたりのAI原価】分子（実費）はあるが分母（採用数）が無い、が
      # 長らくこの行を nobody にしていた理由。outcome は既にあったので、
      # 残っていたのは revert の扱いだけ。出荷後に戻した run を分母から外し、
      # **費用は分子に残す**（失敗は採用1件の原価の一部）。
      # 分母が MIN_ADOPTED に届くまで measured を名乗らない。
      - name: AI unit cost (adopted improvements)
        run: node scripts/ai-unit-cost.mjs --check

      # 【検査が落ちることの記録】data/stop-drills.json の検査版。
      # 2026-08-26 の1日で、自分が書いた検査が黙って効いていないのを5回踏んだ。
      # うち check-pr-facts.mjs は規則を足したのに一度も発火せず緑を出し続けていた。
      #
      # **推測しない** —— ソースを読んで「否定ケースがありそう」と判定する案は捨てた。
      # demonstrated は実際に壊して落ちるのを見たときにしか書けない（at / broke 必須）。
      #
      # **ラチェット** —— 41本を一度に直すのは無理なので増える方向だけを止める。
      # 新しい検査は自己テスト付きで入るしかない。**上限を上げて通さないこと。**
      - name: Checks have been seen to fail
        run: node scripts/check-selftests.mjs --check

      # 【正が無いと消える規則】4つのPRで7件出た形を、機械で洗い出す。
      #
      #   intakeIds.size && !intakeIds.has(id)   空の台帳 → 規則が丸ごと消える
      #   READY !== undefined && n !== READY     実測が無い → 速度の規則が発火しない
      #   doc.production_verified !== undefined  宣言を消すと突き合わせも消える
      #
      # **7件目まで運で見つけていた。**コメント・文字列・正規表現を潰したうえで
      # 台帳由来の束縛だけを追うので、以前 102件の誤検出を出した走査とは別物。
      #
      # **判定ではなく棚卸し。**`a.stopped && !a.reason` のように、その鍵が在ることが
      # 規則の前提である書き方は正しい。だから data/guard-shapes.json に
      # 1件ずつ読んだ記録を持ち、**新しく増えた分だけ**を止める。
      - name: Guards that vanish without ground truth
        run: |
          node scripts/check-guard-shapes.mjs --selftest
          node scripts/check-guard-shapes.mjs --check

      # 【書き出す側が、まだ動くか】CI は各検査の --selftest と --check を回すが、
      # **--write は回さない。**生成器は「書いた結果」だけが検査されていて、
      # 「書く動作そのもの」は誰も動かしていなかった。2026-08-26 に2件出た:
      #
      #   revenue-series --write が ReferenceError で落ちていた（**一度も成功していない**）
      #   autonomy-timeline.svg が台帳から4日遅れ（見出し 18倍 / 台帳 9倍）
      #
      # **--run は作業ツリーを触る。**クリーンでなければ拒否し、走らせた後は
      # 追跡下のファイルを戻し、作った新規ファイルも消す。CIのチェックアウトは
      # 使い捨てなので安全側。実測で11本 1.3秒。
      #
      # 隣リポジトリが要るものは、**隣が無いとき非0で拒否するのが正しい。**
      # CI では「拒否したこと」を確かめる（免除にしない）。
      - name: Generators still run, artifacts not stale
        run: |
          node scripts/check-generators.mjs --selftest
          node scripts/check-generators.mjs --check
          node scripts/check-generators.mjs --run

      # 【中期ロードマップ】日次のアクション台帳と個別バックログしか無く、
      # **「次の四半期に何をやるか」を機械が組み立てる経路が無かった。**
      # 日次の最適化だけが自動化されていると、短期に効く施策へ寄る。
      #
      # **日付を発明しない。**台帳に評価日があるものだけを暦に置き、
      # 順番しか決まらないものは順番だけ出す。オーナーの手数が要るものを
      # 機械の側と混ぜない（混ぜると「機械だけで届く」の主張が壊れる）。
      - name: Mid-term roadmap is assembled, not invented
        run: |
          node scripts/roadmap.mjs --selftest
          node scripts/roadmap.mjs --check

      # 【検索意図の変化】単一スナップショットの分析はあったが、
      # **窓をまたいだ比較が無かった。**同じクエリに Google が別のページを
      # 当てるようになったら、検索側が解釈している意図が動いている。
      #
      # **出現・消滅は使わない。**スナップショットは行数上限（1000/900）で
      # 切れており、最小表示回数は両窓とも1。「消えた」と「上限より下に落ちた」を
      # 区別できないので、**区別できない差を意図の変化と呼ばない。**
      - name: Search intent shifts across windows
        run: |
          node growth/scripts/search-intent.mjs --selftest
          node growth/scripts/search-intent.mjs --check

      # 【PRD の定型】都度作成で定型が無く、**書かれていないことに気づけなかった。**
      #
      # いちばん効くのは §6「決めていないこと」。PRD は提案であって決定ではないので、
      # ここが空だと **PRD が黙ってオーナー判断を代行できる**（取り消し可能時間・
      # 課金の置き場所・本文を残すか、はどれもオーナーの判断）。
      # 本当に何も無いなら「無い」と書く —— 書かないことと、無いことを分ける。
      #
      # VISION §13 の6問は**見出しがあるだけでは通さない**（各問に本文が要る）。
      - name: PRDs follow the template
        run: |
          node scripts/check-prd.mjs --selftest
          node scripts/check-prd.mjs --check

      # 【PR原稿の事実検査】古い事実と誇大表現を機械が落とす。
      #
      # 2026-08-22、2026-06の原稿を雛形にした新しい原稿が3件の古い事実を
      # そのまま引き継いだ（旧アプリ名・起動時間・**廃止済みの無料トライアル**）。
      # 人が読み直して初めて見つかった。3件目は廃止そのものが景表法・ストア審査
      # 上のリスク対応だったので、書けば一度消したリスクを外向きに作り直す。
      # **人の読み直しに依存している限り、次も同じことが起きる。**
      #
      # 正は data/site-constants.json と data/benchmark.json。値が変われば
      # 検査も自動で追随する（スクリプトに数値を直書きしない）。
      # docs/pr-*.md は draft / internal / archived のどれかを宣言する。
      # 未宣言は落とす — 暗黙のファイル名規則にすると新しい原稿が黙って外れる。
      - name: PR draft facts
        run: node scripts/check-pr-facts.mjs --check

      # 【切替演習】バックアップ経路が本当に引き継ぐかを、実行で確かめる。
      #
      # 主系は11回のうち一度も出荷しておらず、日々の出荷は副系が担っている。
      # つまり切替は常態なのに、**正しく起きることを確かめたことは一度も無かった。**
      # 観測（誰が出荷したか）と検証（正しく引き継ぐか）は別物で、
      # 「結果として動いていた」は「壊れていない」の証明にならない。
      #
      # 予算の非対称性（上限到達で主系は止まるが副系は止まらない）も
      # シナリオとして固定してある。既知の仕様なので、いつのまにか
      # 変わっていたら落ちる。
      - name: Failover drill
        run: node scripts/autopilot-drill.mjs --check

      # 【自動化カバレッジ】全領域の自動化率台帳の形と証跡を見る。
      #
      # ここが緩むと台帳が自己申告になり、「やっていることにする」だけで
      # 数字が上がるようになる。だから ai_autonomous / ai_executes_gated は
      # 証跡ファイルの実在を強制し、nobody は「なぜ無いか」を強制する。
      # 理由の無い未実装は、次の棚卸しで拾えない。
      # 【自律度の到達可能上限】61.5% という数字は、放っておくと
      # 「あと38.5%ぶん実装すれば埋まる」と読まれる。実際にはAIが実行していない
      # 67タスクのうち実装量で解けるのは32件で、22件は**意図的に人へ残した境界**、
      # 14件は物理・対人・観測不能・検出力不足で、渡しても実行できない。
      #
      # ここが見るのは、その分類が**全件あること**と、
      # **境界と不能を到達可能側に数えていないこと**。
      # この2つを緩めると、この台帳は「頑張れば95%に行けます」と言う道具になり、
      # 目標値を置いたときに達成する方法が「境界を渡す」しか無くなる。
      - name: Autonomy gap ledger
        run: |
          node scripts/autonomy-gap.mjs --selftest
          node scripts/autonomy-gap.mjs --check

      # 【取り込み復旧】落ちた回に機械が取る手の判断を、実行で確かめる。
      # --selftest は台帳を読まないので、記録が増えても壊れない。
      # check() の本体は「人にしかできない手が要る回を recovered: true にしていないか」で、
      # ここを緩めると自動復旧率が**人が直した回を数えた数字**になる。
      - name: Ingest recovery
        run: |
          node scripts/recover-ingest.mjs --selftest
          node scripts/recover-ingest.mjs --check

      - name: Automation coverage ledger
        run: node scripts/automation-rate.mjs --check

      # 【自己修復の境界】レーンFが越えてはいけない線が壊れていないかを見る。
      #
      # repair_of の指す run が実在するか、失敗行に failure_class があるか、
      # may_modify が承認制領域を含んでいないか、停止条件があるか。
      # 未修理の故障が残っていること自体では落とさない（それは運用の話であって、
      # PRを止める理由ではない）。
      - name: Self-repair boundary
        run: node scripts/autopilot-selfheal.mjs --check

      # 【権限表】不可逆な領域が承認制になっているか、根拠のファイルが実在するかを見る。
      #
      # 機械が守れる部分だけ機械に守らせる。実際に人が承認したかは見られないので、
      # 見るのは (1) 不可逆なのに承認不要になっていないか (2) 稼働中の領域が
      # 根拠ファイルを指せているか (3) 金額が動く領域が上限を持っているか の3つ。
      # 「空欄」と「未設定と決めた」は違うので、後者は set_by: "unset" と書かせる。
      - name: Authority matrix
        run: node scripts/check-authority.mjs --check

      # 【段階公開の機械ゲート】権限表がこのスクリプトの evaluatePromotion を
      # 名指ししていて、**そこが実在しなければ「段階公開の拡大」は承認制へ戻る**
      # （check-authority の gateProblems が checker と export を実際に見る）。
      #
      # 見ているのは台帳の形 —— 上限が 100% 未満か、日次上限が正か、
      # required_metrics が空でないか、梯子が昇順か、
      # そして**上限を超えた昇格が記録に紛れていないか**。
      #
      # self-test の主眼は「条件が揃えば通る」ではなく、
      # **材料を1つずつ落として必ず hold になる**ことのほう（holds_when_unknown の実体）。
      - name: Rollout promotion gate
        run: |
          node scripts/check-rollout-promotion.mjs --selftest
          node scripts/check-rollout-promotion.mjs --check

      # 【段階公開のゲートが変わったことを、変えたPRの中で気づかせる】
      # 判断は公開側（ここ）、実行は非公開側（simplememo-api の Rollout Promote）。
      # あちらは留めた指紋と実物が違えば**本番に書かずに落ちる。**
      #
      # レビュー返信で同じ穴を踏んでいる（#659 で留め → #661 が直す → 翌朝落ちる）。
      # **こちらはもう一段たちが悪い** —— `claude/` は緑なら自動マージされるので、
      # ゲートを直したPRがそのまま main へ入り、次の cron が人の目を通さずに
      # 新しいゲートで本番へ書きうる。あちらは「黙って止まる」、こちらは
      # 「黙って実行される」向き。
      - name: Rollout gate pin (実行側の指紋が古くなっていないか)
        run: |
          node scripts/check-rollout-gate-pin.mjs --selftest
          node scripts/check-rollout-gate-pin.mjs --check

      # 【副系が走ったかを外から確かめる】
      # 主系（Actions）は run を全部列挙できるので記録が完結するが、副系は
      # **セッションが自分で書いたときだけ**行が残る（autopilot-runs.json の
      # source:session）。**書かずに死んだ回はどこにも現れない。**
      #
      # 台帳の⑩は「ログが外部から読めない。構造的に不可」と書いていたが、
      # **走ったかどうかは読める** —— Routines API の last_run。
      # 2026-08-28 に初めて読んだら、その場で4件見つかった
      # （副系A/Bが2日以上停止・週次2本が4日前から失敗のまま）。
      #
      # list_triggers はCIから叩けないので、セッションが写しを置きCIが検査する。
      # **だから写しの鮮度そのものを検査する** —— 古い写しを緑にすると
      # 「読めているつもり」で止まる。
      - name: Routine runs (副系が止まっていないか)
        run: |
          node scripts/check-routine-runs.mjs --selftest
          node scripts/check-routine-runs.mjs --check

      # 【士業への確認】判断は人のまま、運ぶところだけを機械が持つ。
      # ⑧の返信ゲートと同じ形で、**宛先が外部の専門家なので閾値は厳しい** ——
      # 送るのは台帳にある reviewed な文面だけ（送信時に作らない）／
      # 向き先が実在すること／元の未把握がまだ未把握であること／
      # 金額・資格情報・利用者の識別子が本文に入っていたら落とす。
      #
      # **この検査が塞いだ穴は実際に開いていた** —— corporate-obligations の
      # social-insurance は「社労士がついているので期限はそちらに確認する」と
      # 書いていたが、社労士は雇っていない（2026-08-28 オーナー確認）。
      # **居ない相手を向き先にしていた。**確認先の実在を誰も検査していなかった。
      #
      # **アドレスは台帳に置かない**（このリポジトリは公開）。secret の在り処だけ。
      - name: Expert escalation (士業への確認)
        run: |
          node scripts/check-expert-escalation.mjs --selftest
          node scripts/check-expert-escalation.mjs --check

      # 【運転台帳】共通実行IDの一意性と、attempted／outcome の整合を見る。
      #
      # 壊れた台帳は「集計できない」ではなく **指標が黙って嘘になる**。
      # とくに attempted と outcome の食い違い（Gateスキップなのに着手扱い等）は
      # AI完走率を静かにずらすので、PRの時点で止める。
      # 「shipped なのに PR番号が無い」「failed なのに理由が無い」も同様に落とす —
      # 検算できない出荷と、原因の無い失敗は、指標として存在しないのと同じ。
      # 【2026-08-23追加】陳腐化も落とす。
      # 主系が初めて自走出荷した日（PR #538）、台帳に行が書かれず、この --check は
      # 素通りした。**行の形はすべて正しかったので、既存の検査は何も言えなかった。**
      # 壊れた行は指標を嘘にするが、書かれなかった行は指標を止める。
      # 止まった指標は「変化が無い」と見分けがつかないぶん質が悪い。
      # --selftest は台帳を読まないので、台帳の中身が変わっても壊れない。
      #
      # 2026-08-23追加: 台帳と data/autopilot-status.json の突き合わせも同じ --check で見る。
      # 同日、主系が初出荷したのに status JSON だけが前日のままで、10:00 JST の日報が
      # 「当日分の実行記録なし」と報告した。**日報が読むのは status JSON のほう**なので、
      # 台帳が正しくても、ここが古いと出荷が無かったことになる。
      - name: Autopilot run ledger（＋日報データ源との突き合わせ）
        run: |
          node scripts/autopilot-runs.mjs --selftest
          node scripts/autopilot-runs.mjs --check

      # 【アクション台帳】日次アクチュエータが読み書きする台帳の形を見る。
      #
      # ここが見るのは中身の正しさではなく、**閉じられる形をしているか**:
      #   - close_check が無い行が無いこと（無い依頼は永久に残る）
      #   - close_check が登録簿にある種別だけを指していること
      #     （台帳に任意のコマンドを書けるようにすると、依頼リストが実行経路になる）
      #   - done の行が evidence を持つこと（「閉じた」は根拠とセットでしか書けない）
      #   - auto を持つ行が self_repair.may_modify の内側だけを触ること
      #     **これを見ないと、権限の拡大が台帳の1行でできてしまう。**
      #
      # --selftest は台帳を読まないので、台帳の中身が変わっても壊れない
      # （autopilot-runs.mjs と同じ理由・同じ作法）。
      # 【監視Issueの取り込み】変換の自己検査だけをここで見る（**取得は毎朝のセッション**）。
      # ここが守るのは3つ: 対象ラベル以外を運ばない / 二重に足さない /
      # **取り込みが行を閉じない**（回復判定は issue_closed の仕事で、2箇所に散らさない）。
      - name: Health intake
        run: node scripts/health-intake.mjs --check

      - name: Autopilot action ledger
        run: |
          node scripts/autopilot-act.mjs --selftest
          node scripts/autopilot-act.mjs --check

      # 【ヒーロー画像】生成器の形だけを見る（Chromium を CI に持ち込まない）。
      #
      # 画像そのものは配信前に人が確認して出す。ここで見るのは、
      # 見出しが1行に収まるかと、裏の取れていない主張で完成品が
      # 作れない仕組みが生きているか。**切れた見出しの画像が配信される**のと
      # **裏取り未完の画像が完成品として流通する**のが、この検査で防ぎたい2つ。
      - name: PR hero guardrails
        run: node scripts/check-pr-hero.mjs

      # 【自律度の推移】プレスリリースに出すグラフの系列。
      #
      # 月次で測っていた期間は無く、**実測は最新の1点だけ**。それ以前は
      # 証跡ファイルの初出月から遡った再構成なので、**終点が台帳の現在値と
      # ずれた瞬間にグラフ全体が嘘になる。**そこだけは機械が見る
      # （分母のタスク数と、累計が減っていないことも同時に見る）。
      - name: Autonomy timeline
        run: node scripts/autonomy-timeline.mjs --check

      # 【モデルの振り分け】タスク種別 → モデル。**引かれない表は装飾**なので、
      # obsidian-autopilot.yml が実際に --resolve を呼んでいることまで見る。
      # 不可逆なタスク（対外配信）を最安ティアに落とす変更もここで落ちる。
      - name: Model routing
        run: node scripts/check-model-routing.mjs --check

      # 【データ品質】鮮度だけでは足りない。判断を狂わせるのは古いデータではなく
      # **静かに欠けたデータ**。重複と内部不整合は落とす（数字が黙って嘘になる）。
      # 日付の欠けと鮮度は報告のみ — 元データ側の遅れで無関係な出荷を止めない。
      - name: Data quality (GSC snapshots)
        run: node growth/scripts/check-data-quality.mjs --check

      # 【シグナル台帳】要望・レビュー・問い合わせ・競合を1つの台帳に集め、
      # **同じ話を1行にする**。声の大きさを「何回転記されたか」で測らないため。
      # declined に理由が無いと落ちる（理由の無い却下は見落としと区別できない）。
      - name: Signal ledger
        run: node scripts/check-signals.mjs --check

      # 【公開面の事実】check-pr-facts は配信原稿しか見ていない。
      # 同じ古い事実は FAQ・トップ・llms.txt にも残る。**人の目視で消したものは、
      # 次の追加を止められない。**廃止済みトライアルの再出現をここで止める。
      - name: Public-facing facts
        run: node scripts/check-public-facts.mjs --check

      # 【性質テスト】ドリルは26の**具体例**を固定する。ここは**書かなかった
      # 組み合わせ**を総当たりで踏む。2026-08-21の二重着手は、まさに
      # 書かれていなかった組み合わせだった。種を固定して反例を再現可能にする。
      - name: Property-based tests
        run: node scripts/property-tests.mjs --check

      # 【モデル評価セット】替えたあとに「前より良くなった気がする」で決めない。
      # 入力と合格条件を先に固定し、**結果が無いことを空配列として持つ。**
      # policy.enforce を true にすると、未評価モデルへのルーティングで落ちる。
      - name: Model eval set
        run: node scripts/check-model-eval.mjs --check

      # 【有人移管】権限表には「止めて経営者へ移管する」と書いてあったが、
      # **何が検知で、誰にどう渡すのか、いつまでにか**が決まっていなかった。
      # 実行判定の故障コードと、実際に起きた failure_class の全部に規則が要る。
      - name: Escalation rules
        run: node scripts/check-escalation.mjs --check

      # 【緊急停止】台帳ではなく**配線**を見る。判定・ワークフロー・Runbookの
      # 3経路すべてがこれを読んでいること。新しい経路だけが読まない状態は
      # 平常時に症状が出ず、**止めたい日に初めて分かる。**
      - name: Emergency stop wiring
        run: node scripts/check-emergency-stop.mjs --check

      # 【注入面】外部の文字列が入ってくる口の棚卸し。
      #
      # Issue本文・PRタイトル・レビューコメント・検索結果・メール本文は
      # **全部「他人が書いた命令」になりうる**。ワークフローの run: に
      # ${{ github.event.* }} を直接埋めると、タイトルにシェルを書くだけで
      # ランナーで実行できる（env: 経由で渡す形は安全なので除外する）。
      #
      # 口ごとに緩和策と**残存リスク**を書かせる。残存リスクが空の口は
      # 「考えていない」であって「安全」ではないので落とす。
      - name: Injection surface
        run: node scripts/check-injection-surface.mjs --check

      # 【最後の手段が空でないこと】緊急停止の台帳は「判定が壊れていても
      # 資格情報を失効させれば止まる」と書いている。ところが 2026-08-22 に
      # 数えたら、ワークフローが実際に読む secret 11件のうち**台帳にあったのは3件**で、
      # **主系を止める鍵（GH_PAT）が入っていなかった。**最後の手段が指す先が空だった。
      #
      # ここが見るのは期限ではなく（それは Credential expiry の仕事）、
      # 「止めたい経路ごとに、失効させる鍵を名指しできるか」。
      # 新しい secret を使う経路が増えると落ちる。
      - name: Credential scope and revocation
        run: node scripts/check-credentials.mjs --check

      # 【金額の規則】変更幅・損失上限・撤回条件と、資金繰りのシナリオ。
      # **損失上限が現在の上限以下だと落ちる**（初日から発火する上限は上限ではない）。
      # 収入が未接続なのにランウェイを書いていたら落ちる。
      - name: Financial policy
        run: node scripts/check-financial-policy.mjs --check

      # 【独立監査】監査の中身ではなく**独立**を守る。憲章と所見を自己修復レーンが
      # 書き換えられないこと・監査が repair と別モデルであること・所見が消せないこと。
      - name: Audit independence
        run: node scripts/check-audit-independence.mjs --check

      # 【法人の期限・記録・条項】**「把握していない」を「余裕がある」と読ませない。**
      # 中身はオーナーしか埋められないので、未把握の件数は報告に留め、
      # 落とすのは台帳の形（理由の無い未確認・ベンダー台帳との食い違い）だけ。
      - name: Corporate obligations
        run: node scripts/check-corporate.mjs --check

      # 【毎朝の1枚】台帳6件を1枚に圧縮できること。生成できない＝どれかが読めていない。
      - name: Daily brief
        run: node scripts/daily-brief.mjs --check

      # 【ASC】取得は隣のリポジトリ（鍵がある場所）。ここは受け側の形と、
      # **接続していないのに接続している前提の数字を出していないか**を見る。
      - name: App Store Connect ingest
        run: node growth/scripts/ingest-asc.mjs --check

      # 【機能の改善サイクル】コンテンツ側は experiments.json で完走しているが、
      # **機能側には同じ台帳が無かった。**feature-backlog は採点だけで、
      # rollout-guard の3指標は「壊していないか」の安全指標であって
      # 「効いたか」ではない。**出す前に測り方を決めさせる**のが主眼で、
      # declared_at <= shipped_at を強制する（後から指標を選べないように）。
      - name: Feature outcome loop
        run: |
          node scripts/check-feature-outcomes.mjs --selftest
          node scripts/check-feature-outcomes.mjs --check

      # 【運転記憶】判断→実行→結果→**次の判断がどう変わったか**を1レコードで持つ。
      #
      # ①〜④だけなら Autopilot、⑤停止・revert まで行けば Closed-loop、
      # **⑥記憶と⑦方針改善まで行って初めて「再帰的」と言える。**
      # ここが空でも他の検査は全部緑になるので、**自律性の主張だけが
      # 中身なしで通る**経路になっていた。
      #
      # 検査の主眼は2つ:
      #   - learning.changed が実在の成果物を指すこと（**感想を学習と呼ばせない**）
      #   - 同じ lesson_key が2回出たら落とす（1回目の学習が効いていない）
      # 【公開ページ × 台帳】一番人目に触れる数字が、検査の網の外にあった。
      # 2026-08-25 に棚卸しへ13件足して 61.3% → 58.6% に動いたとき、
      # /autopilot/ は 176タスク・61.3% のまま**誰にも落とされなかった。**
      # 記者が最初にやるのは「その数字はどう数えましたか」なので、
      # **ページと台帳が違うのがいちばん悪い。**
      # 【レビュー返信の承認境界】返信は**公開される**ので、書いた相手だけでなく
      # ストアを見る全員に対する会社の発言になる。取り消しても
      # 「見た人が見なかったことにはならない」——段階公開の promote と同じ性質。
      # **[2026-08-27] 境界が変わった** —— 「投稿だけを人が承認する」から
      # 「品質ゲートを通れば自動投稿」へ（オーナーの決定）。下書き・検査に加えて
      # 投稿もAIが実行する。落とすものは変わらない:
      # 期日・版の約束、個人情報、禁止表現は下書きの時点で落とす。
      - name: Review reply approval boundary
        run: |
          node scripts/check-review-replies.mjs --selftest
          node scripts/check-review-replies.mjs --check

      # 【ゲートが変わったことを、変えたPRの中で気づかせる】
      # 実際に投稿を止めているのは隣の非公開リポジトリの指紋照合。
      # ここで check-review-replies.mjs を1文字直すと**あちらの指紋が黙って古くなり、
      # 翌朝の日次が落ちて初めて分かる。**#659 で留め、#661 が直し、実際にそうなった。
      # 止まる方向なので事故にはならないが、**止まったことに誰も気づかない。**
      - name: Review reply gate pin (隣の指紋が古くなっていないか)
        run: |
          node scripts/check-review-gate-pin.mjs --selftest
          node scripts/check-review-gate-pin.mjs --check

      # 【公開してよいものだけ公開する】
      # Cloudflare Pages はリポジトリの中身をそのまま配信する。除外設定は無いので、
      # **data/*.json は放っておくと全件が公開される。**実際 34件中28件が
      # 意図せず公開されていた（鍵の棚卸し・攻撃面・法人情報を含む）。
      # 新しい data ファイルは分類するまで落ちる。**既定を非公開に倒す。**
      #
      # [2026-08-26] **配信を止めても非公開にはならない。**このリポジトリは
      # GitHub 上で公開されている（api.github.com が private: false を返す）。
      # そこで真偽値を served_by_site に改名し、リポジトリ側の状態は
      # REPO_PRIVATE の実測と突き合わせる。**否定は script 側で三値のまま行う**
      # （`!private` を YAML で計算すると、値が空のとき「公開」を名乗る）。
      # 【停止機構の訓練】④自動本番デプロイ。**「実装した」と「止まることを
      # 確かめた」を同じ語で呼ばない。**台帳の note には散文で「本番でまだ1回も
      # 発火していない」と書いてあったが、散文はこのリポジトリでは効かない
      # （prose-does-not-stop-an-agent）。数えられる形にした。
      - name: Stop-mechanism drills
        run: |
          node scripts/check-stop-drills.mjs --selftest
          node scripts/check-stop-drills.mjs --check

      - name: Data publication policy
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          node scripts/check-publication.mjs --selftest
          node scripts/check-publication.mjs --check

      # 【収入の履歴】日次の取り込みを足して「何日ぶん観測したか」を数える。
      # **足せないものは足さない** —— date_range を持たない取り込みは飛ばす。
      # 2026-08-25 に収入が接続されたが、月次にするには28日要る。
      # ここが方針側の revenue_history_days とずれたら落とす
      # （ずれたまま runway の材料に使われるのを防ぐ）。
      - name: Revenue series
        run: |
          node growth/scripts/revenue-series.mjs --selftest
          node growth/scripts/revenue-series.mjs --check

      # 【待ち行列の再生成】検出は前からあったが、**出力を待ち行列へ落とす経路が無かった。**
      # refresh-queue は 2026-08-09 に手で作られたまま更新されず、以後の観測が
      # 反映されていなかった（自律コンテンツループが消化しているのは coverage だけ）。
      # 核心は「落とした判断を復活させないこと」——
      # dropped/done は再生成で戻らず、**別の台帳（experiments.json）で
      # abandoned と判定されたページへも積み直さない。**
      - name: Content queue rebuild
        run: |
          node growth/scripts/build-queues.mjs --selftest
          node growth/scripts/build-queues.mjs --check

      # 【マーケ stop-loss】評価日を待たずに「戻す」判断だけを機械が出す。
      # 開発側には rollout-guard の kill があるのに**マーケ側だけ無く**、
      # 2026-07-01/02 の7件は6週間そのまま放置されていた。
      # revert のときだけ落とす。hold（母数不足・基準値なし）では落とさない ——
      # **判定できないことは異常ではない。**ただし件数は必ず出す。
      - name: Marketing stop-loss
        run: |
          node growth/scripts/check-stoploss.mjs --selftest
          node growth/scripts/check-stoploss.mjs --check

      - name: Autopilot page vs ledger
        run: |
          node scripts/check-autopilot-page.mjs --selftest
          node scripts/check-autopilot-page.mjs --check

      - name: Operating memory
        run: |
          node scripts/check-operating-memory.mjs --selftest
          node scripts/check-operating-memory.mjs --check

      # 【KPIの定義】数字ではなく**定義**を凍結する。
      #
      # 「自動化率が上がった」の半分は計算を変えたから、という事故を防ぐ。
      # 定義ごとに算出元ファイルの sha256 を持ち、算出コードが変われば落ちる。
      # 直すには --bump <id> --why "..." が要る（履歴が残る）。
      # **黙って定義を変えて数字を良くする経路をつぶすための検査。**
      - name: KPI definitions vs source
        run: node scripts/check-definitions.mjs --check

      # 【コード著者率】原稿の「変更行の98.8%」は**再現できなかった。**
      #
      # 2026-08-22 に同じ窓で数え直したところ、どの数え方をしても
      # 231,315行 にも 98.8% にもならなかった。再現できない数字は、
      # 記者に聞かれた瞬間にいちばん高くつく。
      #
      # ここは再計測しない（隣のリポジトリはCIのチェックアウトに無く、
      # 浅いクローンでは履歴も足りない）。見るのは算数と、数え方が
      # 書いてあること、そして **headline が実測とずれていないこと** —
      # 「数字だけ良くする」経路をつぶすための検査。
      - name: Code authorship ledger
        run: node scripts/code-authorship.mjs --check

      # 【季節性】上下を施策の成果と読む前に、曜日と外れ値を落とす。
      #
      # 金土は平日比 0.8 倍まで落ちるので、金曜に出した施策は何もしなくても
      # 「効かなかった」ように見える。28日未満では判定を拒否する
      # （**足りない標本で判定しないことを機械に強制する**）。
      # 説明のつかない外れ値は注釈台帳と突き合わせて名指しする。
      - name: Series decomposition
        run: node growth/scripts/decompose-series.mjs --check

      # 【監視】何が見張られていて、何が空いているか。
      #
      # 検知の中央値は2.1hだが最大は50.7h。その差は「見張られていない領域で
      # 起きた」ことによる。**どこが空いているかを名指しできなければ縮まらない。**
      # 検知器と書いたファイルが実在するかと、**実際に起きた障害種別に
      # 検知経路があるか**を見る（起きた実績があるものは、次も起きる）。
      - name: Monitoring coverage
        run: node scripts/check-monitoring.mjs --check

      # 【ベンダー】依存している外部サービスの棚卸し。
      #
      # リード文の「契約は人が承認」に中身を与えるための台帳。
      # 個人データを渡しているのに DPA を見ていないものを名指しする
      # （**「見ていない」を「問題なし」と書かない**）。
      # 資格情報の台帳との食い違いも見る — 片方だけ古くなるのを防ぐ。
      - name: Vendor register
        run: node scripts/check-vendors.mjs --check

      # 【縮退運転】台帳が「代替がある」と書いていることを、**実際に動かして確かめる。**
      #
      # 文章は書いた時点では正しくても、経路が変われば黙って嘘になる。
      # 一番まずいのは「代替がある」と書いてあるものが効かない場合で、
      # それは**その事業者が落ちた日に初めて分かる。**
      #
      # 代替（肩代わりする）と縮退（被害の範囲を限る）を分けて数える。
      # 混ぜると resilience を過大に見積もる — Resend が落ちてもメールは
      # 送れない（代替なし）が、遮断器と死信があるので失われず後で戻せる。
      #
      # **単一障害点では落とさない。**分かっていることは壊れていることではない。
      # 落とすのは、代替を名乗っているのに動かして確かめられないときと、
      # **どの事業者にも使われていない probe があるとき**（覆っているように
      # 見えるだけの死んだ実験）。
      - name: Degradation probes
        run: node scripts/check-degradation.mjs --check

      # 【機能バックログ】計測の結果が次に作るものを決めているか。
      #
      # 確信度は evidence_strength から機械的に決まる（手で置けない）。
      # ここを主観にすると順位はいくらでも動かせるので台帳の意味が消える。
      # リスクは点数を下げるのではなく承認を要求する — 掛け算にすると
      # **期待効果が大きければ危険な案が1位になる**。
      - name: Feature backlog
        run: node scripts/feature-score.mjs --check

      # 【レビュー】ユーザーの声を受け取ったかではなく、**捌いたか**を見る。
      #
      # 取り込みは機械化した（../simplememo-ios/scripts/asc_metrics.rb）が、
      # 取り込んだだけのレビューは誰も見ない。growth/README.md 冒頭の
      # 「散文は手を挙げない」と同じ構造なので、**未処理が14日を超えたら落とす**。
      #
      # レビュー本体は別リポジトリにあってこのCIからは見えない。そのときは
      # judged=false を返し、台帳の整合だけを見る。**見えないことを
      # 「未処理0件」と書かない**（check-monitoring と同じ扱い）。
      - name: Review intake
        run: |
          node scripts/review-intake.mjs --selftest
          node scripts/review-intake.mjs --check

      # 【主張】プレスリリースの見出し・リード文を実装台帳に当てる。
      #
      # 原稿は実装より速く動く。リード文に「AIが一気通貫で循環」と書いた後で
      # 台帳の該当タスクが未実装のままだと、**配信当日まで誰も気づかない**。
      #
      # 支持率が低いことでは落とさない — それは「まだ書けない」であって
      # 「壊れている」ではない。落とすのは参照が解決できないとき
      # （＝原稿と台帳のどちらかが古い）。赤い行を黙って消す道具にしない。
      - name: PR claims vs ledger
        run: node scripts/check-pr-claims.mjs --check

      # 【期限】資格情報・証明書が切れる前に気づく。
      #
      # これが無い間は **切れた日に初めて分かる** 状態だった。証明書と
      # Provisioning Profile は年1で切れ、切れるとリリースが一切できなくなる。
      #
      # 実行環境が中間者復号していると TLS の実測はプロキシの証明書を読む。
      # 発行元が信用集合に無ければ期限を報告せず unverifiable にする
      # （scripts/compute_spki_pins.sh が警告している罠と同じもの）。
      #
      # いまは fail_days を切ったときだけ落ちる。critical の未把握で落とすには
      # 日付を埋めてから policy.enforce_unknown を true にする。
      # 【ドメインの期限】解析だけをここで見る（**取得はネットが要るので seo-daily**）。
      # 台帳の domain-renewal は長らく「レジストラの管理画面にしか無い」を理由に
      # 未把握だったが、**それは事実ではない** —— gTLD の有効期限は RDAP で誰でも引ける。
      # いちばん高くつく読み違えは registration を expiration と取り違えることなので、
      # 自己検査がそれを名指しで落とす。
      - name: Domain expiry parser
        run: node scripts/check-domain-expiry.mjs --selftest

      # ⑦法人経営。**規約は改定される。**一度 ok と書いた判定が、改定後も ok のまま
      # 残るのを止める（unreviewed より悪い —— 見た記録が嘘を守る）。
      # 取得はCIの seo-daily 側で、ここは解析の自己検査だけ。
      - name: Vendor terms parser
        run: node scripts/vendor-terms.mjs --selftest

      - name: Credential expiry
        run: |
          node scripts/check-expiry.mjs --selftest
          node scripts/check-expiry.mjs --check --no-net

      # 【D-SCORE】pr_release レコードの算数とゲートの矛盾を見る。
      #
      # 採点そのものは人（かセッション）が根拠つきで置く。ここが自動で点を
      # 出し始めると、点を取るための見出しを機械が書くようになり、G2 が
      # 防いでいるはずの「煽り語で点を稼ぐ」に自分から突っ込む。
      # 機械が持つのは算数とゲートだけ:
      #   - 各軸の合計と total のズレ（手で足した数字は検算されない）
      #   - 満点超過
      #   - status が running/evaluated なのにゲートが未判定・不合格
      #   - 合格ライン60未満のまま running
      # どれも「配信してから気づく」と取り返しがつかない。
      - name: PR release D-SCORE consistency
        run: node growth/scripts/d-score.mjs --check

      # BigQuery の資格情報まわり。ネットワークにもGCPにも触らない
      # （token エンドポイントは fetch を差し替えて潰してある）ので、
      # 鍵の無いCIでも走る。ここが壊れると毎日の測定が丸ごと止まるが、
      # 止まったことは「数字が小さい」という形でしか現れないため、
      # 実際に一度、OAuthログイン済みの資格情報が「資格情報が無い」として
      # 拒否される状態で2日間気づかれずに走っていた。
      - name: BigQuery credential handling
        run: node growth/lib/bigquery.test.mjs

      # 一括エクスポートの「届いているように見えて欠けている」判定。
      # これもネットワークに触らない（テーブル名と日付の配列だけを渡す）。
      # 2026-08-21、Search Console から5件の失敗メールが来たとき、
      # bq-preflight の全チェックは緑だった — 失敗したのは配信済みの日の
      # 再エクスポートで、最新日付は動かないため。唯一の痕跡である
      # temp_ テーブルを、当時のコードは「クエリの残骸」として名前で
      # 捨てていた。ここが緑のまま「エクスポートは健全」と言えなくする。
      - name: Bulk export integrity verdicts
        run: node growth/lib/export-health.test.mjs

      # Smoke test only (--dry-run writes nothing). Note: the shallow CI
      # checkout means git-derived lastmod dates collapse to one date here;
      # real sitemap generation happens locally with full history.
      # --dry-run は件数を表示するだけでコミット済みのファイルを見ないため、
      # generate_sitemap.py の実行を忘れたPRを一度も止められなかった（2026-08-22）。
      # --check はURLの集合を突き合わせ、新しいページが sitemap に載っていなければ落ちる。
      - name: Sitemap lists every page (stale sitemap fails)
        run: python3 scripts/generate_sitemap.py --check

      # --since 1 = HEAD~1..HEAD（マージは首親差分）で実際に変わった .html だけを
      # 通知する。以前は mtime 判定で、新規 checkout では全ファイルが「更新済み」に
      # 見えるため main push のたびに全ページ通知になっていた。内訳と送信結果は
      # ジョブサマリに出る。複数コミットの直接 push は最後の1コミット分のみに
      # なるので、必要なら手動で --since N を実行する。
      #
      # このステップが動くのは main への「直接 push」だけ。auto-merge の
      # マージ push は GITHUB_TOKEN 起因でワークフローを発火させないため、
      # そちらの通知は auto-merge.yml のマージ後ステップが行う。
      - name: IndexNow notification (on main push only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: node scripts/indexnow-notify.js --since 1
        continue-on-error: true
