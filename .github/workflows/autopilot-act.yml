# 日次アクチュエータ — その日の結果から「やるべきこと」を導出し、
# **自分でやってよいものは実際にやって**、結果を日報メールへ渡す。
#
# 【なぜ別のワークフローか】
# この運用の観測は非常に強く、作動がほぼ無かった。日報は毎朝、完走率も
# 変更失敗率も未修理の故障も出しているのに、**そこから何かが起動することは
# 無かった。** 実際に起きたこと:
#
#   - 2026-08-24 06:17 に主系が認証系で即死。台帳に載ったのは翌日 08:48。
#     time_to_detect = 50.7時間。台帳の注記が理由を正確に書いている——
#     「成果物ゼロで落ちた回は台帳を書く主体がいない構造的な穴」。
#     **落ちた回ほど記録されない。壊れているときほど見えなくなる。**
#   - owner_requests は string[] で、id も閉じ条件も無い。解決しても消えないので
#     12件中6件が【解消済み】のまま毎朝再送され、生きている1件がその中に埋まった。
#
# 主系（obsidian-autopilot.yml）に足さないのは、**主系が落ちている日にこそ
# 動く必要がある**から。同じジョブに入れると、認証が切れた日は同期も止まる。
# 認証を必要としない（モデルを呼ばない）ので、主系が死んでいても動く。
#
# 【時刻】09:00 JST = 00:00 UTC。
#   06:00 主系 → 07:30 副系 → 09:00 ここ → 09:20 再試行 → 10:00 日報メール
# 日報の1時間前に置いてあるのは、PR → SEO Validation → auto-merge → Pages
# デプロイが終わってから読まれる必要があるため。間に合わなかった日は
# 日報側が「前日分」と明示する（隠して当日分に見せない）。
#
# 【ブランチ名】claude/autopilot-act-<date>。
# **claude/obsidian-auto-<date> は絶対に使わない** — あれは Runbook §0-2 の
# 当日占有ロックで、ここが取ると主系・副系が「今日は実行済み」と誤判定して
# その日の記事が丸ごと落ちる。claude/ 始まりなのは SEO Validation と
# auto-merge を通すため。

name: Autopilot Act

on:
  push:
    branches: [main]
    paths: ['data/routine-runs.json']
  repository_dispatch:
    types: [autopilot-completed]
  workflow_run:
    # 監視Issueの作成・閉鎖を次の朝まで台帳の外へ置かない。
    workflows: ["Obsidian Autopilot", "Autopilot Health", "Cron Health", "Auto-merge Claude PRs"]
    types: [completed]
  schedule:
    - cron: '0 0 * * *'   # 09:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '実行せず計画だけ出す'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read       # 運転台帳の同期に Actions API を読む。write は与えない

concurrency:
  group: autopilot-act
  cancel-in-progress: false

jobs:
  routine-intake:
    # GITHUB_TOKEN merges suppress push events. Inspect current main after the
    # auto-merge workflow completes; the report records the snapshot Act consumed.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Auto-merge Claude PRs'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.observe.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check whether routine observation reached intake
        id: observe
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import { routineIntakeNeeded } from './scripts/lib/routine-actions.mjs';
          const doc = JSON.parse(fs.readFileSync('data/routine-runs.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('data/autopilot-actions-report.json', 'utf8'));
          const needed = process.env.UPSTREAM_CONCLUSION === 'success' && routineIntakeNeeded(doc, report);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\n`);
          JS

  act:
    needs: routine-intake
    # A routine observation should wake intake. If this job's optional API
    # observer writes a snapshot, its own merge must not create a publish loop.
    if: >-
      always() && !cancelled() &&
      (needs.routine-intake.result == 'skipped' || needs.routine-intake.outputs.needed == 'true') &&
      (github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, '日次アクチュエータの同期（') &&
       !startsWith(github.event.head_commit.message, 'chore(autopilot): 日次アクチュエータの同期（')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # GH_PAT が要る理由は seo-daily.yml / obsidian-autopilot.yml と同じ:
          # GITHUB_TOKEN の push はワークフローを起動しないため、PRを作っても
          # SEO Validation が走らず auto-merge が永久に来ない。
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 【緊急停止】主系と同じ位置・同じ理由。停止中はこの経路も動かない。
      # 台帳の同期は無害に見えるが、**止めたい状況で唯一動き続ける経路**を
      # 作らないほうがよい。止まっていることが観測できるほうが価値が高い。
      - name: 緊急停止の確認
        id: estop
        run: |
          STOP="$(node -p "
            const d = require('./data/emergency-stop.json');
            const a = (d.agents || {}).act || {};
            d.stopped ? ('all:' + (d.reason || '理由未記入'))
              : a.stopped ? ('act:' + (a.reason || '理由未記入'))
              : '';
          ")"
          if [ -n "$STOP" ]; then
            echo "::warning title=Emergency stop::停止が立っている: ${STOP}"
            exit 1
          fi

      # Derive from the pending ledger itself. Computing against main and applying
      # a stash onto a pending PR conflicts when two observers record the same run.
      - name: Prepare ledger branch before observation
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          DAY="claude/autopilot-act-$(TZ=Asia/Tokyo date +%Y%m%d)"
          OPEN="$(gh pr list --head "$DAY" --state open --json number --jq '.[].number')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$OPEN" ]; then
            git fetch origin "$DAY"
            git diff --name-only origin/main...FETCH_HEAD > "$RUNNER_TEMP/act-pending-paths"
            while IFS= read -r FILE; do
              case "$FILE" in
                data/autopilot-actions.json|data/autopilot-actions-report.json|data/autopilot-runs.json|data/autopilot-cost.json|data/emergency-stop.json|data/eligibility-log.json|data/autonomy-score-history.json|data/routine-runs.json|autopilot/index.html) ;;
                *) echo "Unexpected pending PR path: $FILE"; exit 1 ;;
              esac
            done < "$RUNNER_TEMP/act-pending-paths"
            git checkout -B "$DAY" FETCH_HEAD
            git merge --no-edit origin/main
          else
            git checkout -B "$DAY"
          fi

      # 判定ロジックそのものの自己検査。台帳を読まないので、台帳が壊れていても
      # ここは通る（＝壊れているのが判定側か台帳側かを切り分けられる）。
      - name: 自己検査
        run: node scripts/autopilot-act.mjs --selftest

      # Read metadata independently of model quota. Existing credentials stay in
      # this step only; denial does not trigger login, fallback billing, or retries.
      - name: Observe registered routine runs
        # The existing setup-token returned HTTP 401 for this API (run 33935822325).
        # Enable only after this credential's read access has been verified.
        if: vars.CLAUDE_ROUTINE_API_READ_ENABLED == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/routine-observer.mjs --apply

      - name: 実行（導出 → 突き合わせ → 自動実行）
        id: act
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          MODE=--apply
          [ "${{ inputs.dry_run }}" = "true" ] && MODE=""
          node scripts/autopilot-act.mjs $MODE \
            --emit-report data/autopilot-actions-report.json | tee /tmp/act.txt
          cat /tmp/act.txt >> "$GITHUB_STEP_SUMMARY"

      # 【L1適格性ゲート】アクチュエータが台帳を更新したあとに判定する。
      # **順序が要点** —— 先に判定すると、その日に立った候補と閉じた候補を見ずに
      # 前日の姿を採点することになる。
      #
      # `--write` は同じ候補・同じ日なら上書きなので、同日2回目でも行は増えない。
      # **enforcement は record_plus_r2_block** なので、ここで何かが「落ちた」ことは
      # 実行が止まったことを意味しない（止まったかどうかは halted が持つ）。
      - name: L1適格性ゲート（判定して台帳に残す）
        run: node scripts/autonomy-eligibility.mjs --write

      # 【自律スコア】その日の1点を履歴に足す。**非退行制約の基準がこれ。**
      # 履歴が無いと「検査被覆率が下がった窓ではスコアを上げない」が効かないので、
      # ここが毎日走ることがアンチゲーミングの前提になっている。
      - name: 自律スコアの記録
        run: node scripts/autonomy-score.mjs --snapshot

      - name: 公開運転表を最新の観測と同期
        run: node scripts/decision-monitor.mjs --publish-report

      # 書き込んだ台帳がCIを通る形かをここで見る。**PRを出す前に見る** —
      # 壊れた台帳をPRにすると、SEO Validation が落ちて auto-merge が来ず、
      # 翌日も同じ壊れた状態から始まる。
      - name: 台帳の検査
        run: |
          node scripts/autopilot-act.mjs --check
          node scripts/autopilot-runs.mjs --check
          node scripts/autopilot-budget.mjs --check
          node scripts/autonomy-eligibility.mjs --check
          node scripts/autonomy-score.mjs --check
          node scripts/check-autopilot-page.mjs --check
          node scripts/check-routine-runs.mjs --check

      - name: 変更があればPRにする
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更なし（同期も封じ込めも不要な日）。PRは作らない。"
            exit 0
          fi
          DAY="claude/autopilot-act-$(TZ=Asia/Tokyo date +%Y%m%d)"
          git add data/autopilot-actions.json data/autopilot-actions-report.json \
                  data/autopilot-runs.json data/autopilot-cost.json data/emergency-stop.json \
                  data/eligibility-log.json data/autonomy-score-history.json data/routine-runs.json autopilot/index.html 2>/dev/null || true
          git commit -m "chore(autopilot): 日次アクチュエータの同期（$(TZ=Asia/Tokyo date +%Y-%m-%d)）"
          # 同日に再実行した場合は追記されるだけ。強制pushはしない
          # （弾かれること自体が「先に誰かが書いた」という出力）。
          # 取り直した場合、リモートには古い当日ブランチが残っている。
          # そのPRは既にマージ済み（open が無いことは上で確認済み）なので、
          # **既マージ履歴の上書きにしかならない。**--force-with-lease にして
          # 「読んだ時点から動いていたら落ちる」ようにしておく。
          git push --force-with-lease -u origin "$DAY"
          # **open なPRだけを見る。**`gh pr view` はマージ済み・クローズ済みのPRも
          # 見つけてしまう。同日2回目が走ったとき、1回目のPRが既にマージされていると
          # 「PRはある」と判定して新しいPRを作らず、**pushしたコミットがどこにも
          # 取り込まれないまま残る**（2026-08-25 の2回目の実走で実際に起きた:
          # 95a8e186 が当日ブランチに乗ったまま main に入らなかった）。
          #
          # 再実行は「何かがおかしかった日」にこそ起きるので、この壊れ方は
          # **必要なときに限って届かない。**緑のまま何も出ないという、この運用が
          # 繰り返し踏んできた形そのもの。
          if [ -z "$(gh pr list --head "$DAY" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$DAY" \
              --title "日次アクチュエータの同期（$(TZ=Asia/Tokyo date +%Y-%m-%d)）" \
              --body "$(cat /tmp/act.txt)"
          fi
