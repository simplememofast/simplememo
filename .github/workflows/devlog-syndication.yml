# TEMPORARY SECURITY STOP: no generation, publication, or public-feed watcher.
name: Devlog Syndication

on:
  schedule:
    - cron: '17 3 * * *'   # 12:17 JST
    - cron: '47 11 * * *'  # 20:47 JST
  workflow_dispatch:
    inputs:
      platform:
        description: '対象の媒体（hatenadiary は はてなブログ「メモの設計図」、livedoor は ライブドアブログ）'
        type: choice
        options: [all, devto, hatena, hatenadiary, livedoor]
        default: all
      mode:
        description: 'Currently blocked pending private handoff (all modes)'
        type: choice
        options: [dry_run, publish]
        default: dry_run
      force:
        description: '66時間の間隔を無視する（停止と1日1本の上限は越えない）'
        type: boolean
        default: false

permissions: {}
jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Block all external syndication work pending private handoff
        run: |
          echo '::error title=Devlog syndication::PRIVATE_HANDOFF_REQUIRED'
          exit 1
