name: Homepage Poster Verification
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/home-perf/**'
      - 'assets/video/launch-1s*'
      - 'scripts/perf/poster*'
      - 'scripts/perf/test_poster.py'
      - 'scripts/perf/build_home.py'
      - '.github/workflows/home-poster.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/home-perf/**'
      - 'assets/video/launch-1s*'
      - 'scripts/perf/poster*'
      - 'scripts/perf/test_poster.py'
      - 'scripts/perf/build_home.py'
      - '.github/workflows/home-poster.yml'
permissions:
  contents: read
concurrency:
  group: home-poster-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-poster:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
            chrome: /usr/bin/google-chrome
          - browser: firefox
            os: macos-14
            chrome: ''
          - browser: webkit
            os: macos-14
            chrome: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Poster quality, deterministic encoding and markup guards
        run: |
          pip install Pillow==12.3.0
          python scripts/perf/test_poster.py
      - name: Install pinned functional browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/poster-tools" --no-save playwright@1.55.0
          "$RUNNER_TEMP/poster-tools/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Decode poster and verify unchanged native playback, focus and navigation
        env:
          QA_BROWSER: ${{ matrix.browser }}
          CHROME_PATH: ${{ matrix.chrome }}
          QA_RESULTS: ${{ runner.temp }}/poster-results
          NODE_PATH: ${{ runner.temp }}/poster-tools/node_modules
        run: node scripts/perf/poster_browser.mjs .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-poster-${{ matrix.browser }}
          path: ${{ runner.temp }}/poster-results/
          retention-days: 14
          if-no-files-found: error
