name: Rendering Confirmation and Compatibility (isolated)
on:
  push:
    branches: [claude/pagespeed-render-study-20260917]
    paths:
      - '.github/workflows/render-confirm.yml'
      - 'scripts/perf/render_compat.cjs'
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p "$RUNNER_TEMP/confirmation"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/perf-tools" --no-save lighthouse@12.8.2
      - name: Independent repetition using the unchanged declared protocol
        env:
          NODE_PATH: ${{ runner.temp }}/perf-tools/node_modules
          PERF_RESULTS: ${{ runner.temp }}/confirmation
        run: node scripts/perf/render_study.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-independent-confirmation
          path: ${{ runner.temp }}/confirmation/
          retention-days: 7
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p "$RUNNER_TEMP/compatibility"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/perf-tools" --no-save playwright@1.55.0
          "$RUNNER_TEMP/perf-tools/node_modules/.bin/playwright" install --with-deps webkit
      - name: Cold anchors scrolling no-JavaScript and print layout
        env:
          NODE_PATH: ${{ runner.temp }}/perf-tools/node_modules
          PERF_RESULTS: ${{ runner.temp }}/compatibility
        run: node scripts/perf/render_compat.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-browser-compatibility
          path: ${{ runner.temp }}/compatibility/
          retention-days: 7
